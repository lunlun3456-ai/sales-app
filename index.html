<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Sales Reporter 日销报告</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  :root {
    --bg: #f0f4ff; --card: #ffffff; --primary: #2563eb; --primary-dark: #1d4ed8;
    --accent: #f59e0b; --success: #10b981; --danger: #ef4444; --text: #1e293b;
    --text2: #64748b; --border: #e2e8f0; --shadow: 0 4px 24px rgba(37,99,235,0.10); --radius: 18px; --font: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 17px; overflow-x: hidden; }
  .screen { display: none; min-height: 100vh; flex-direction: column; animation: fadeIn .25s; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .topbar { background: var(--primary); color: #fff; padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 99; box-shadow: 0 2px 12px rgba(37,99,235,0.18); }
  .topbar h1 { font-size: 19px; font-weight: 800; letter-spacing: .3px; }
  .topbar .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .lang-btn { background: rgba(255,255,255,0.18); border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #login-screen { align-items: center; justify-content: center; background: linear-gradient(145deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%); padding: 30px 24px; min-height: 100vh; }
  .login-box { background: #fff; border-radius: 28px; padding: 36px 28px 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
  .login-logo { text-align: center; margin-bottom: 18px; }
  .field-label { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; display: block; }
  .input-wrap { margin-bottom: 16px; }
  select, input[type=text], input[type=password], input[type=number], input[type=date], input[type=month] { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; transition: border .2s; }
  select:focus, input:focus { border-color: var(--primary); }
  .btn { display: block; width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 800; cursor: pointer; text-align: center; margin-top: 6px; font-family: var(--font); }
  .btn:active { background: var(--primary-dark); transform: scale(.98); }
  .btn.secondary { background: var(--bg); color: var(--primary); border: 2px solid var(--border); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.success { background: var(--success); color: #fff; }
  .btn.warn { background: var(--accent); color: #fff; }
  .btn.refresh-btn { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 20px; margin-top: 0; background: rgba(255,255,255,0.2); display: flex; align-items: center; gap: 4px; color: #fff; border: none; }
  .btn.refresh-inline { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; margin-top: 0; background: var(--bg); color: var(--primary); border: 1px solid var(--border); }
  .content { padding: 18px 16px 100px; flex: 1; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1.5px solid var(--border); box-shadow: 0 -2px 16px rgba(0,0,0,0.07); z-index: 98; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; cursor: pointer; border: none; background: none; font-family: var(--font); color: var(--text2); font-size: 11px; font-weight: 700; }
  .nav-item.active { color: var(--primary); }
  .nav-item .nav-icon { font-size: 22px; margin-bottom: 2px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-title { font-size: 15px; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .amount-input-wrap { position: relative; margin-bottom: 6px; }
  .amount-prefix { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 800; color: var(--primary); }
  input.amount-input { padding-left: 54px; font-size: 26px; font-weight: 900; height: 64px; background: #eff6ff; border-color: var(--primary); }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { font-size: 15px; color: var(--text2); font-weight: 600; }
  .stat-value { font-size: 17px; font-weight: 900; color: var(--text); }
  .stat-value.big { font-size: 26px; color: var(--primary); }
  .stat-value.green { color: var(--success); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; background: #eff6ff; color: var(--primary); margin-left: 6px; }
  .badge.amber { background: #fef3c7; color: #92400e; }
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-chip { white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; border: 2px solid var(--border); background: #fff; color: var(--text2); cursor: pointer; flex-shrink: 0; }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .record-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .record-item:last-child { border-bottom: none; }
  .record-icon { font-size: 26px; flex-shrink: 0; margin-top: 2px; }
  .record-info { flex: 1; }
  .record-store { font-size: 14px; font-weight: 800; color: var(--text); }
  .record-meta { font-size: 12px; color: var(--text2); margin-top: 2px; line-height: 1.6; }
  .record-amount { font-size: 18px; font-weight: 900; color: var(--primary); }
  .record-sub { font-size: 11px; color: var(--text2); text-align: right; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; opacity: 0; transition: all .3s; z-index: 999; white-space: nowrap; max-width: 85vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success-toast { background: var(--success); }
  #toast.error-toast { background: var(--danger); }
  #toast.pending-toast { background: var(--accent); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 24px 24px 0 0; padding: 28px 24px 40px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; animation: slideUp .25s; }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 18px; }
  .progress-bar-wrap { background: var(--border); border-radius: 8px; height: 10px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #60a5fa); border-radius: 8px; transition: width .5s; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 100px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .bar-fill { width: 100%; background: linear-gradient(180deg, #3b82f6, #1d4ed8); border-radius: 6px 6px 0 0; min-height: 4px; transition: height .5s; }
  .bar-label { font-size: 10px; color: var(--text2); margin-top: 4px; font-weight: 700; }
  .welcome-banner { background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%); border-radius: var(--radius); padding: 20px; color: #fff; margin-bottom: 14px; position: relative; overflow: hidden; }
  .welcome-banner h2 { font-size: 20px; font-weight: 900; }
  .welcome-banner p { font-size: 13px; opacity: .85; margin-top: 4px; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }
  .role-tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-left: 6px; }
  .role-tag.boss { background: #fde8e8; color: #b91c1c; }
  .role-tag.admin { background: #fee2e2; color: #991b1b; }
  .role-tag.manager { background: #dbeafe; color: #1d4ed8; }
  .role-tag.supervisor { background: #d1fae5; color: #065f46; }
  .role-tag.staff { background: #f3e8ff; color: #6d28d9; }
  /* ADMIN PANEL */
  .user-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .user-row:last-child { border-bottom: none; }
  .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; flex-shrink: 0; }
  .user-avatar.pending-av { background: var(--accent); }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .user-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; font-family: var(--font); }
  .btn-sm.edit { background: #eff6ff; color: var(--primary); }
  .btn-sm.del { background: #fee2e2; color: var(--danger); }
  .btn-sm.approve { background: #d1fae5; color: var(--success); }
  .btn-sm.reject { background: #fee2e2; color: var(--danger); }
  .pending-card { border: 2px solid var(--accent); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; background: #fffbeb; }
  .pending-badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 800; margin-left: 6px; }
  /* SPINNER */
  .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 30px; gap: 10px; color: var(--text2); font-size:14px; font-weight:700; }
  .spin { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink:0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (min-width: 500px) { body { max-width: 480px; margin: 0 auto; } }
</style>
</head>
<body>

<div id="toast"></div>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <!-- UPDATED HOME SCREEN LOGO -->
      <svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:340px;margin:0 auto 12px;display:block">
        <defs>
          <linearGradient id="gMain" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
          <linearGradient id="gAccent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#fbbf24"/>
          </linearGradient>
          <filter id="shadow">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(37,99,235,0.25)"/>
          </filter>
        </defs>

        <!-- Main Text: BRANCHES -->
        <text x="180" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="url(#gMain)" filter="url(#shadow)" text-anchor="middle" letter-spacing="3">BRANCHES</text>

        <!-- Sub Text: SALES REPORT -->
        <text x="180" y="84" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1e3a8a" text-anchor="middle" letter-spacing="6">SALES REPORT</text>

        <!-- Decorative Line -->
        <rect x="70" y="98" width="220" height="4" rx="2" fill="url(#gAccent)"/>

        <!-- "by ki" -->
        <text x="260" y="118" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#f59e0b" font-style="italic">by ki</text>

        <!-- "version 1.0" (Right down side) -->
        <text x="350" y="132" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="end">version 1.0</text>

        <!-- Sparkles -->
        <text x="20" y="25" font-size="18" fill="#f59e0b" opacity="0.8">✦</text>
        <text x="335" y="65" font-size="14" fill="#60a5fa" opacity="0.9">✦</text>
        <text x="100" y="125" font-size="10" fill="#93c5fd" opacity="0.7">✦</text>
      </svg>
    </div>
    <div class="input-wrap">
      <label class="field-label" id="lbl-name">Username 用户名</label>
      <input type="text" id="login-name" placeholder="e.g. bonia_ali" autocomplete="off" autocapitalize="none" autocorrect="off">
    </div>
    <div class="input-wrap">
      <label class="field-label" id="lbl-pass">PIN (4 digits 4位密码)</label>
      <input type="password" id="login-pin" maxlength="4" placeholder="••••" inputmode="numeric">
    </div>
    <button class="btn" onclick="doLogin()" id="login-btn">Login 登录</button>
    <button class="btn secondary" onclick="openRegisterModal()" style="margin-top:10px;">📝 Register Account 注册申请</button>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app-screen" class="screen">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <!-- UPDATED INSIDE APP LOGO -->
      <svg viewBox="0 0 190 40" xmlns="http://www.w3.org/2000/svg" style="width:145px;height:32px;flex-shrink:0">
        <defs>
          <linearGradient id="tgWhite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e2e8f0"/>
          </linearGradient>
          <linearGradient id="tgGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fcd34d"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <!-- BRANCHES -->
        <text x="0" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="url(#tgWhite)" letter-spacing="1.5">BRANCHES</text>
        <!-- SALES REPORT -->
        <text x="0" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="url(#tgWhite)" opacity="0.9" letter-spacing="2">SALES REPORT</text>
        <!-- Accent Line -->
        <rect x="0" y="35" width="105" height="2.5" rx="1.25" fill="url(#tgGold)"/>
        <!-- by ki -->
        <text x="112" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="url(#tgGold)" font-style="italic">by ki</text>
        <!-- version 1.0 -->
        <text x="188" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="end">v1.0</text>
      </svg>
      <div class="sub" id="app-user-info"></div>
    </div>
    <div class="topbar-right">
      <button class="btn refresh-btn" onclick="triggerSyncRefresh()" id="sync-btn" title="Sync from Google Sheets">🔄</button>
      <button class="lang-btn" onclick="toggleLang()">中/EN</button>
    </div>
  </div>

  <div class="content" id="tab-submit"  style="display:block"></div>
  <div class="content" id="tab-records" style="display:none"></div>
  <div class="content" id="tab-summary" style="display:none"></div>
  <div class="content" id="tab-admin"   style="display:none"></div>
  <div class="content" id="tab-profile" style="display:none"></div>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" onclick="switchTab('submit',this)"  id="nav-submit">
      <span class="nav-icon">📤</span><span id="nav-submit-lbl">Submit</span>
    </button>
    <button class="nav-item" onclick="switchTab('records',this)" id="nav-records">
      <span class="nav-icon">📋</span><span id="nav-records-lbl">Records</span>
    </button>
    <button class="nav-item" onclick="switchTab('summary',this)" id="nav-summary">
      <span class="nav-icon">📊</span><span id="nav-summary-lbl">Summary</span>
    </button>
    <button class="nav-item" onclick="switchTab('admin',this)"   id="nav-admin" style="display:none">
      <span class="nav-icon">⚙️</span><span id="nav-admin-lbl">Admin</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile',this)" id="nav-profile">
      <span class="nav-icon">👤</span><span id="nav-profile-lbl">Me</span>
    </button>
  </nav>
</div>

<!-- ===================== REGISTER MODAL ===================== -->
<div class="modal-overlay" id="register-modal">
  <div class="modal-box">
    <div class="modal-title">📝 Account Registration Request</div>
    <div class="input-wrap">
      <label class="field-label">Preferred Username 用户名</label>
      <input type="text" id="reg-username" placeholder="e.g. bonia_ali (lowercase)" autocapitalize="none">
    </div>
    <div class="input-wrap">
      <label class="field-label">Full Name / Staff Name 姓名</label>
      <input type="text" id="reg-name" placeholder="e.g. Ali Ahmad">
    </div>
    <div class="input-wrap">
      <label class="field-label">WhatsApp Phone Number 电话号码</label>
      <input type="text" id="reg-phone" placeholder="e.g. 60123456789" inputmode="tel">
    </div>
    <div class="input-wrap">
      <label class="field-label">Target Store Location 门店</label>
      <select id="reg-store">
        <option value="">-- Select Store --</option>
        <option value="Bonia Sabindo">Bonia Sabindo</option>
        <option value="Bonia Eastern">Bonia Eastern</option>
        <option value="Polo Sabindo">Polo Sabindo</option>
        <option value="Polo Eastern">Polo Eastern</option>
        <option value="Gm Sabindo">Gm Sabindo</option>
        <option value="Gm Eastern">Gm Eastern</option>
      </select>
    </div>
    <div class="input-wrap">
      <label class="field-label">Work Role 职位</label>
      <select id="reg-role">
        <option value="staff">Staff 员工</option>
        <option value="supervisor">Supervisor 主管</option>
        <option value="manager">Manager 经理</option>
      </select>
    </div>
    <div class="input-wrap">
      <label class="field-label">Preferred PIN (4 digits) 密码</label>
      <input type="password" id="reg-pin" maxlength="4" placeholder="••••" inputmode="numeric">
    </div>
    <div style="background:#fff8e1;border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#78350f;font-weight:600;">
      ⚠️ Your request will be sent to Admin for approval. You can login only after Admin approves it.<br>
      <span style="font-size:12px;opacity:.8">管理员审批后方可登录。</span>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn secondary" style="flex:1" onclick="closeRegisterModal()">Cancel 取消</button>
      <button class="btn success"   style="flex:1" onclick="submitRegisterRequest()">Submit Request 提交</button>
    </div>
  </div>
</div>

<!-- ===================== CONFIRM SUBMIT MODAL ===================== -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Confirm Submission</div>
    <div id="modal-body"></div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn secondary" style="flex:1" onclick="closeModal()">Cancel 取消</button>
      <button class="btn success"   style="flex:1" onclick="confirmSubmit()">Confirm & Submit ✓</button>
    </div>
  </div>
</div>

<!-- ===================== USER EDIT MODAL ===================== -->
<div class="modal-overlay" id="user-edit-modal">
  <div class="modal-box">
    <div class="modal-title" id="user-edit-title">Edit User</div>
    <input type="hidden" id="edit-user-key">
    <div class="input-wrap">
      <label class="field-label">Username (login ID)</label>
      <input type="text" id="edit-username" autocapitalize="none">
    </div>
    <div class="input-wrap">
      <label class="field-label">Display Name 姓名</label>
      <input type="text" id="edit-name">
    </div>
    <div class="input-wrap">
      <label class="field-label">WhatsApp Phone Number 电话号码</label>
      <input type="text" id="edit-phone" placeholder="e.g. 60123456789" inputmode="tel">
    </div>
    <div class="input-wrap">
      <label class="field-label">PIN (4 digits)</label>
      <input type="password" id="edit-pin" maxlength="4" inputmode="numeric" placeholder="••••">
    </div>
    <div class="input-wrap">
      <label class="field-label">Role 职位</label>
      <select id="edit-role">
        <option value="staff">Staff</option>
        <option value="supervisor">Supervisor</option>
        <option value="manager">Manager</option>
        <option value="boss">Boss</option>
        <option value="admin">Admin</option>
      </select>
    </div>

function openRegisterModal()  { document.getElementById('register-modal').classList.add('open'); }

async function submitRegisterRequest() {
  const username = document.getElementById('reg-username').value.trim().toLowerCase();
  const name     = document.getElementById('reg-name').value.trim();
  const phone    = document.getElementById('reg-phone').value.trim();
  const store    = document.getElementById('reg-store').value;
  const role     = document.getElementById('reg-role').value;
  const pin      = document.getElementById('reg-pin').value.trim();

  if(!username || !name || !store || !pin || !phone) { showToast('Please fill all fields', 'error'); return; }
  if(pin.length !== 4) { showToast('PIN must be 4 digits', 'error'); return; }

  showToast('Sending request...', 'pending');
  try {
    await fetch(WEB_APP_URL, {
      method: 'POST', mode: 'no-cors', cache: 'no-cache',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'registerRequest', username, name, phone, store, role, pin })
    });
    showToast('Registration sent! Waiting for Admin approval.', 'success');
    closeRegisterModal();
    // Clear fields
    ['reg-username','reg-name','reg-phone','reg-pin'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('reg-store').value = '';
  } catch(e) {
    showToast('Error: ' + e, 'error');
  }
}

// ============================================================
// SYNC / REFRESH — fetches real data FROM Google Sheets
// ============================================================
async function triggerSyncRefresh() {
  if(!WEB_APP_URL || WEB_APP_URL.includes("PASTE_YOUR")) { showToast('No URL configured','error'); return; }
  const btn = document.getElementById('sync-btn');
  if(btn) btn.textContent = '⏳';
  showToast(lang === 'zh' ? '正在从云端同步...' : 'Syncing from Cloud...', 'pending');
  try {
    // Fetch sales data from the sheet
    const res  = await fetch(WEB_APP_URL + '?action=getSales');
    const json = await res.json();

    if(json && json.sales && Array.isArray(json.sales)) {
      // json.sales is the canonical list from the sheet — replace local cache entirely
      saveSales(json.sales);
      renderCurrentTab();
      checkAllStoresSubmitted();
      showToast(lang === 'zh' ? '数据已从云端更新 ✓' : 'Synced from Cloud ✓', 'success');
    } else if(Array.isArray(json)) {
      // Legacy: bare array
      saveSales(json);
      renderCurrentTab();
      checkAllStoresSubmitted();
      showToast(lang === 'zh' ? '数据已从云端更新 ✓' : 'Synced from Cloud ✓', 'success');
    } else {
      showToast('Sync error: unexpected response', 'error');
    }
  } catch(e) {
    showToast('Sync failed — check internet', 'error');
  }
  if(btn) btn.textContent = '🔄';
}

// ============================================================
// FETCH USERS FROM SHEET
// ============================================================
async function fetchLiveUsers() {
  if(!WEB_APP_URL || WEB_APP_URL.includes("PASTE_YOUR")) return null;
  try {
    const response = await fetch(WEB_APP_URL + '?action=getUsers');
    const users = await response.json();
    if(users && typeof users === 'object') {
      cachedUsers = users;
      saveData('cached_users', users);
    }
    return cachedUsers;
  } catch(e) {
    cachedUsers = loadData('cached_users', {});
    return cachedUsers;
  }
}

async function doLogin() {
  const username = document.getElementById('login-name').value.trim().toLowerCase();
  const pin      = document.getElementById('login-pin').value.trim();
  if(!username || !pin) { showToast('Enter username and PIN', 'error'); return; }
  showToast(lang === 'zh' ? '正在验证...' : 'Verifying...', 'pending');
  await fetchLiveUsers();
  const userMatch = cachedUsers[username];
  if(!userMatch || String(userMatch.pin) !== String(pin)) {
    showToast('Wrong username or PIN', 'error'); return;
  }
  if(userMatch.status && userMatch.status !== 'active') {
    showToast('Account pending approval. Contact Admin.', 'error'); return;
  }
  currentUser = { ...userMatch, username };
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');

  const isAdmin = ['admin','boss'].includes(currentUser.role);
  document.getElementById('nav-admin').style.display = isAdmin ? 'flex' : 'none';

  updateTopBar(); updateNavLabels();
  switchTab('submit', document.getElementById('nav-submit'));
  triggerSyncRefresh();
}

function renderSubmitTab() {
  const isManagerial = ['boss','admin','manager'].includes(currentUser.role);

         ${allowedStores.map(s => `<option ${s===currentUser.store?'selected':''}>${s}</option>`).join('')}
       </select>`;

  // Lock date for Staff and Supervisors to only allow Today's submissions
  let dateInputHtml = `<input type="date" id="submit-date" value="${todayStr}" onchange="checkAndLoadExistingSales()">`;
  if (isStaffOrSupervisor) {
    dateInputHtml = `<input type="date" id="submit-date" value="${todayStr}" disabled style="background:#e2e8f0;color:var(--text2);font-weight:bold;">`;
  }

  document.getElementById('tab-submit').innerHTML = `
    <div class="welcome-banner">
      <h2>📤 ${t('submitCard')}</h2>

    </div>

      <div class="card-title">${t('submitCard')}</div>
      <div class="input-wrap">
        <label class="field-label">${lang==='zh'?'目标日期':'Target Date'}</label>
        ${dateInputHtml}
      </div>
      <div class="input-wrap">
        <label class="field-label">🏪 ${t('store') || 'Store'}</label>

        <div class="amount-input-wrap"><span class="amount-prefix">RM</span>
          <input type="number" class="amount-input" id="s-cash" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>
      <div class="input-wrap">
        <label class="field-label">📱 ${t('qr')}</label>
        <div class="amount-input-wrap"><span class="amount-prefix">RM</span>
          <input type="number" class="amount-input" id="s-qr" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>
      <div class="input-wrap">
        <label class="field-label">💳 ${t('card')}</label>
        <div class="amount-input-wrap"><span class="amount-prefix">RM</span>
          <input type="number" class="amount-input" id="s-card" placeholder="0.00" min="0" step="0.01" inputmode="decimal">

        <div class="amount-input-wrap"><span class="amount-prefix">RM</span>

        </div>

      <div class="stat-row">
        <span class="stat-label">🧾 ${t('totalSales')}</span>
        <span class="stat-value big" id="live-total">RM 0.00</span>

      <div class="input-wrap" style="margin-top:12px">

function checkAndLoadExistingSales() {
  const dateVal  = document.getElementById('submit-date') ? document.getElementById('submit-date').value : '';
  const storeVal = document.getElementById('submit-store') ? document.getElementById('submit-store').value : '';
  if(!dateVal || !storeVal) return;
  const existing = getSales().find(s => s.dateKey === dateVal && s.store === storeVal);
  if(existing) {
    document.getElementById('s-cash').value  = existing.cash  !== undefined ? existing.cash  : '';
    document.getElementById('s-qr').value    = existing.qr    !== undefined ? existing.qr    : '';
    document.getElementById('s-card').value  = existing.card  !== undefined ? existing.card  : '';
    document.getElementById('s-bank').value  = existing.bank  !== undefined ? existing.bank  : '';
    document.getElementById('s-remark').value = existing.remark || '';
  } else {
    ['s-cash','s-qr','s-card','s-bank'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('s-remark').value = '';
  }
  updateLiveTotal();
}

function updateLiveTotal() {
  const c = parseFloat(document.getElementById('s-cash').value)  || 0;
  const q = parseFloat(document.getElementById('s-qr').value)    || 0;
  const k = parseFloat(document.getElementById('s-card').value)  || 0;
  const b = parseFloat(document.getElementById('s-bank').value)  || 0;
  document.getElementById('live-total').textContent = 'RM ' + (c+q+k+b).toFixed(2);
}

function openConfirm() {
  const store      = document.getElementById('submit-store').value;
  const targetDate = document.getElementById('submit-date').value;
  if(!store || !targetDate) { showToast(lang==='zh'?'请选择门店和日期':'Select store and date', 'error'); return; }

  // Restrict Staff/Supervisors from selecting anything other than Today's date
  const isStaffOrSupervisor = ['staff', 'supervisor'].includes(currentUser.role);
  const todayStr = new Date().toISOString().slice(0,10);
  if (isStaffOrSupervisor && targetDate !== todayStr) {
    showToast(t('onlyTodayAllowed'), 'error');
    return;
  }

  const cash  = parseFloat(document.getElementById('s-cash').value)  || 0;
  const qr    = parseFloat(document.getElementById('s-qr').value)    || 0;
  const card  = parseFloat(document.getElementById('s-card').value)  || 0;
  const bank  = parseFloat(document.getElementById('s-bank').value)  || 0;
  const total = cash + qr + card + bank;
  const remark = document.getElementById('s-remark').value;

  document.getElementById('modal-title').textContent = t('confirmTitle');
  document.getElementById('modal-body').innerHTML = `
    <div class="stat-row"><span class="stat-label">🏪 Store</span><span class="stat-value">${store}</span></div>
    <div class="stat-row"><span class="stat-label">📅 Date</span><span class="stat-value">${targetDate}</span></div>
    <div class="stat-row"><span class="stat-label">💵 ${t('cash')}</span><span class="stat-value">RM ${cash.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-label">📱 ${t('qr')}</span><span class="stat-value">RM ${qr.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-label">💳 ${t('card')}</span><span class="stat-value">RM ${card.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-label">🏦 ${t('bank')}</span><span class="stat-value">RM ${bank.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-label">🧾 ${t('totalSales')}</span><span class="stat-value big">RM ${total.toFixed(2)}</span></div>
    ${remark ? `<div class="stat-row"><span class="stat-label">📝</span><span class="stat-value" style="font-size:14px">${remark}</span></div>` : ''}
  `;
  window._pendingSubmit = { store, targetDate, cash, qr, card, bank, total, remark };
  document.getElementById('confirm-modal').classList.add('open');
}

function closeModal() { document.getElementById('confirm-modal').classList.remove('open'); }

function confirmSubmit() {
  const s   = window._pendingSubmit;
  const now = new Date();

  // Differentiate Daily Sales vs Updated Sales
  const existingRecord = getSales().find(item => item.dateKey === s.targetDate && item.store === s.store);
  const submissionType = existingRecord ? 'update' : 'daily_sales';

  // Construct Change Log Payload to send to Spreadsheet (Log tab backend)
  const changeLog = {
    before: existingRecord ? { cash: existingRecord.cash, qr: existingRecord.qr, card: existingRecord.card, bank: existingRecord.bank, total: existingRecord.total } : null,
    after: { cash: s.cash, qr: s.qr, card: s.card, bank: s.bank, total: s.total }
  };

  const record = {
    id: Date.now(), store: s.store, cash: s.cash, qr: s.qr, card: s.card, bank: s.bank,
    total: s.total, remark: s.remark, submitter: currentUser.name,
    role: currentUser.role, datetime: now.toISOString(),
    dateKey: s.targetDate, month: s.targetDate.slice(0,7),
    submissionType: submissionType, // 'daily_sales' or 'update'
    changeLog: JSON.stringify(changeLog)
  };

  showToast(lang==='zh'?'正在同步至云端...':'Uploading to Cloud...', 'pending');

  fetch(WEB_APP_URL, {
    method: 'POST', mode: 'no-cors', cache: 'no-cache',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'submitSales', ...record })
  }).then(() => {
    // Update local cache: replace same date+store entry
    let sales = getSales().filter(item => !(item.dateKey === s.targetDate && item.store === s.store));
    sales.push(record);
    saveSales(sales);
    closeModal();
    showToast(t('submitted'), 'success');
    renderSubmitTab();
    checkAllStoresSubmitted();
  }).catch(err => { showToast('Error: ' + err, 'error'); });
}

  const sales   = getSales();

  let yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestKey = yest.toISOString().slice(0,10);

  let targetDate = todayKey;
  if(selectedDateRange === 'yesterday')   targetDate = yestKey;
  if(selectedDateRange === 'custom_date') targetDate = customDateValue;

  let filtered = isExec ? sales : sales.filter(s => s.store === currentUser.store);
  if(selectedDateRange === 'month') {
    filtered = filtered.filter(s => s.month === selectedMonthValue);
  } else {
    filtered = filtered.filter(s => s.dateKey === targetDate);
  }
  if(isExec && activeRecordStoreFilter !== 'all') {
    filtered = filtered.filter(r => r.store === activeRecordStoreFilter);
  }
  filtered = filtered.slice().sort((a,b) => String(b.dateKey).localeCompare(String(a.dateKey)));

  let filterHtml = `

function renderSummaryTab() {
  const isExec = ['boss','admin','manager'].includes(currentUser.role);
  if(!isExec) {
    document.getElementById('tab-summary').innerHTML = `
      <div class="card" style="text-align:center;padding:40px 20px">
        <div style="font-size:52px;">🔒</div>
        <h3 style="margin:12px 0 8px">${t('accessDenied')}</h3>
        <p style="color:var(--text2)">${t('accessMsg')}</p>
      </div>`; return;
  }

  const sales = getSales();
  const todayKey = new Date().toISOString().slice(0,10);
  let yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestKey = yest.toISOString().slice(0,10);

  let targetRangeDay = todayKey;
  if(selectedDateRange === 'yesterday')   targetRangeDay = yestKey;
  if(selectedDateRange === 'custom_date') targetRangeDay = customDateValue;

  const rangeSales = selectedDateRange === 'month'
    ? sales.filter(s => s.month === selectedMonthValue)
    : sales.filter(s => s.dateKey === targetRangeDay);

  const monthSales = sales.filter(s => s.month === selectedMonthValue);
  const rangeTotal = rangeSales.reduce((a,s) => a + parseFloat(s.total||0), 0);
  const monthTotal = monthSales.reduce((a,s) => a + parseFloat(s.total||0), 0);

  let allowedStores = STORES;
  if (currentUser.role !== 'admin') allowedStores = STORES.filter(s => s !== 'HQ');

  const storeMap = {}; allowedStores.forEach(s => storeMap[s] = 0);
  monthSales.forEach(s => { if(storeMap[s.store] !== undefined) storeMap[s.store] = (storeMap[s.store]||0) + parseFloat(s.total||0) });
  const maxStore = Math.max(...Object.values(storeMap), 1);

  const days = [];
  for(let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const dk = d.toISOString().slice(0,10);
    const label = d.toLocaleDateString([],{weekday:'short'}).slice(0,2);
    const val = sales.filter(s=>s.dateKey===dk).reduce((a,s)=>a+parseFloat(s.total||0),0);
    days.push({label,val});
  }
  const maxDay = Math.max(...days.map(d=>d.val), 1);

  document.getElementById('tab-summary').innerHTML = `
    <div class="card-header-flex">
      <h2 style="font-size:18px;font-weight:900">${t('summaryTab')}</h2>
      <button class="btn refresh-inline" onclick="triggerSyncRefresh().then(renderSummaryTab)">🔄 ${t('refresh')}</button>
    </div>
    <div class="card" style="padding:14px;background:#eff6ff;">
      <div class="control-grid" style="margin-bottom:0">
        <div>
          <label class="field-label" style="font-size:12px;margin-bottom:4px">📅 ${t('filterRange')}</label>
          <select onchange="updateSummaryDateRange(this.value)" style="padding:8px 10px;font-size:14px">
            <option value="today"       ${selectedDateRange==='today'?'selected':''}>${t('todayOpt')}</option>
            <option value="yesterday"   ${selectedDateRange==='yesterday'?'selected':''}>${t('yestOpt')}</option>
            <option value="custom_date" ${selectedDateRange==='custom_date'?'selected':''}>${t('customOpt')}</option>
            <option value="month"       ${selectedDateRange==='month'?'selected':''}>${lang==='zh'?'月度':'Monthly'}</option>
          </select>
          ${selectedDateRange==='custom_date'?`<input type="date" value="${customDateValue}" onchange="updateSummaryCustomDate(this.value)" style="padding:6px;font-size:12px;margin-top:6px">`:''}
        </div>
        <div>
          <label class="field-label" style="font-size:12px;margin-bottom:4px">🗓️ ${t('selectMonthLabel')}</label>
          <input type="month" value="${selectedMonthValue}" onchange="updateSummaryMonth(this.value)" style="padding:8px 10px;font-size:14px">
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div class="card" style="margin:0;text-align:center">
        <div style="font-size:11px;font-weight:800;color:var(--text2);margin-bottom:6px">📊 ${t('todayTotal')}</div>
        <div style="font-size:20px;font-weight:900;color:var(--primary)">RM ${rangeTotal.toFixed(2)}</div>
      </div>
      <div class="card" style="margin:0;text-align:center">
        <div style="font-size:11px;font-weight:800;color:var(--text2);margin-bottom:6px">🗓️ ${selectedMonthValue}</div>
        <div style="font-size:20px;font-weight:900;color:var(--success)">RM ${monthTotal.toFixed(2)}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📈 ${t('daily')}</div>
      <div class="bar-chart">
        ${days.map(d=>`<div class="bar-col"><div class="bar-fill" style="height:${Math.max(4,(d.val/maxDay)*80)}px"></div><div class="bar-label">${d.label}</div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-header-flex" style="margin-bottom:10px">
        <div class="card-title" style="margin:0">🏪 ${t('byStore')} (${selectedMonthValue})</div>
        <button class="btn warn" onclick="sendReminder()" style="width:auto;padding:6px 12px;font-size:12px;margin:0;border-radius:10px">${t('remindBtn')}</button>
      </div>
      ${allowedStores.map(s=>`
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px">
            <span>${s}</span><span style="color:var(--primary)">RM ${(storeMap[s]||0).toFixed(2)}</span>
          </div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${((storeMap[s]||0)/maxStore*100).toFixed(1)}%"></div></div>
        </div>`).join('')}
    </div>
  `;
}

function updateSummaryDateRange(val)  { selectedDateRange  = val; renderSummaryTab(); }
function updateSummaryCustomDate(val) { customDateValue    = val; renderSummaryTab(); }
function updateSummaryMonth(val)      { selectedMonthValue = val; renderSummaryTab(); }

// ---- APPROVE / REJECT ----
async function approveUser(username) {
  showToast(lang==='zh'?'正在审批...':'Approving...', 'pending');
  try {
    await fetch(WEB_APP_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'approveUser', username })
    });
    // Update local cache immediately
    if(cachedUsers[username]) {
      cachedUsers[username].status = 'active';
      saveData('cached_users', cachedUsers);
    }
    showToast(t('approvedMsg'), 'success');
    renderAdminTab();
  } catch(e) { showToast('Error: '+e, 'error'); }
}

async function rejectUser(username) {
  if(!confirm('Reject & delete this registration request?')) return;
  showToast('Rejecting...', 'pending');
  try {
    await fetch(WEB_APP_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'rejectUser', username })
    });
    delete cachedUsers[username];
    saveData('cached_users', cachedUsers);
    showToast(t('rejectedMsg'), 'success');
    renderAdminTab();
  } catch(e) { showToast('Error: '+e, 'error'); }
}

function openAddUser() {
  document.getElementById('user-edit-title').textContent = '➕ ' + t('addUser');
  document.getElementById('edit-user-key').value  = '';
  document.getElementById('edit-username').value  = '';
  document.getElementById('edit-username').disabled = false;
  document.getElementById('edit-name').value      = '';
  document.getElementById('edit-phone').value     = '';
  document.getElementById('edit-pin').value       = '';
  document.getElementById('edit-role').value      = 'staff';
  document.getElementById('edit-store').value     = 'HQ';

function openEditUser(username) {
  const u = cachedUsers[username];
  if(!u) return;
  document.getElementById('user-edit-title').textContent  = '✏️ ' + t('editUser');
  document.getElementById('edit-user-key').value          = username;
  document.getElementById('edit-username').value          = username;
  document.getElementById('edit-username').disabled       = true; // can't change username
  document.getElementById('edit-name').value              = u.name  || '';
  document.getElementById('edit-phone').value             = u.phone || '';
  document.getElementById('edit-pin').value               = u.pin   || '';
  document.getElementById('edit-role').value              = u.role  || 'staff';
  document.getElementById('edit-store').value             = u.store || 'HQ';
  document.getElementById('user-edit-modal').classList.add('open');
}

function closeUserEditModal() { document.getElementById('user-edit-modal').classList.remove('open'); }

async function saveUserEdit() {
  const originalKey = document.getElementById('edit-user-key').value;
  const username    = document.getElementById('edit-username').value.trim().toLowerCase();
  const name        = document.getElementById('edit-name').value.trim();
  const phone       = document.getElementById('edit-phone').value.trim();
  const pin         = document.getElementById('edit-pin').value.trim();
  const role        = document.getElementById('edit-role').value;
  const store       = document.getElementById('edit-store').value;

  if(!username || !name || !pin || pin.length !== 4 || !phone) {
    showToast('Fill all fields. PIN must be 4 digits.', 'error'); return;
  }

  const userData = { action: 'saveUser', originalKey, username, name, phone, pin, role, store, status: 'active' };
  showToast(lang==='zh'?'正在保存...':'Saving...', 'pending');
  try {
    await fetch(WEB_APP_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(userData)
    });
    // Update local cache
    if(originalKey && originalKey !== username) delete cachedUsers[originalKey];
    cachedUsers[username] = { name, phone, pin, role, store, status: 'active' };
    saveData('cached_users', cachedUsers);
    showToast(t('userSaved'), 'success');
    closeUserEditModal();
    renderAdminTab();
  } catch(e) { showToast('Error: '+e, 'error'); }
}

async function deleteUser(username) {
  if(!confirm('Delete user @' + username + '?')) return;
  try {
    await fetch(WEB_APP_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'deleteUser', username })
    });
    delete cachedUsers[username];
    saveData('cached_users', cachedUsers);
    showToast(t('userDeleted'), 'success');
    renderAdminTab();
  } catch(e) { showToast('Error: '+e, 'error'); }
}

// ---- SECURE PIN MODIFICATION ----
async function changeCurrentUserPin() {
  const currentPin = document.getElementById('profile-curr-pin').value.trim();
  const newPin     = document.getElementById('profile-new-pin').value.trim();
  const confirmPin = document.getElementById('profile-conf-pin').value.trim();

  if(!currentPin || !newPin || !confirmPin) {
    showToast(lang==='zh'?'请填写完整信息！':'Please fill in all security fields!', 'error');
    return;
  }
  if(String(currentPin) !== String(currentUser.pin)) {
    showToast(lang==='zh'?'当前密码错误！':'Incorrect current PIN!', 'error');
    return;
  }
  if(newPin.length !== 4 || isNaN(newPin)) {
    showToast(lang==='zh'?'新密码必须是4位数字！':'New PIN must be exactly 4 digits!', 'error');
    return;
  }
  if(newPin !== confirmPin) {
    showToast(lang==='zh'?'新密码输入不一致！':'New PINs do not match!', 'error');
    return;
  }

  showToast(lang==='zh'?'正在保存新密码...':'Saving new PIN...', 'pending');
  
  // Submit the update pin payload to Apps Script (via saveUser edit endpoint)
  const userPayload = {
    action: 'saveUser',
    originalKey: currentUser.username,
    username: currentUser.username,
    name: currentUser.name,
    phone: currentUser.phone || '',
    pin: newPin,
    role: currentUser.role,
    store: currentUser.store,
    status: 'active'
  };

  try {
    await fetch(WEB_APP_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(userPayload)
    });
    
    // Update local variables on successful transaction
    currentUser.pin = newPin;
    if(cachedUsers[currentUser.username]) {
      cachedUsers[currentUser.username].pin = newPin;
      saveData('cached_users', cachedUsers);
    }
    
    showToast(lang==='zh'?'安全密码修改成功！':'Security PIN updated successfully!', 'success');
    
    // Reset inputs
    document.getElementById('profile-curr-pin').value = '';
    document.getElementById('profile-new-pin').value = '';
    document.getElementById('profile-conf-pin').value = '';
  } catch(e) {
    showToast('Failed: ' + e, 'error');
  }
}

// ============================================================
function checkAllStoresSubmitted() {
  if(!currentUser || !['admin','boss','manager'].includes(currentUser.role)) return;
  
  const today = new Date().toISOString().slice(0,10);
  const notifiedKey = 'notified_all_submitted_' + today;
  if(sessionStorage.getItem(notifiedKey)) return;

  const todaySales = getSales().filter(s => s.dateKey === today);
  const submittedStores = new Set(todaySales.map(s => s.store));
  const branches = STORES.filter(s => s !== 'HQ');
  const allSubmitted = branches.length > 0 && branches.every(b => submittedStores.has(b));

  if(allSubmitted) {
    document.getElementById('all-submitted-title').textContent = t('allSubmittedTitle');
    document.getElementById('all-submitted-msg').textContent = t('allSubmittedMsg');
    document.getElementById('awesome-btn').textContent = t('awesomeBtn');
    document.getElementById('all-submitted-modal').classList.add('open');
    sessionStorage.setItem(notifiedKey, 'true');
  }
}

function sendReminder() {
  const today = new Date().toISOString().slice(0,10);
  const todaySales = getSales().filter(s => s.dateKey === today);
  const submittedStores = new Set(todaySales.map(s => s.store));
  const branches = STORES.filter(s => s !== 'HQ');
  const pending = branches.filter(b => !submittedStores.has(b));

  if (pending.length === 0) {
    showToast(lang==='zh'?'所有门店今日已提交！':'All branches have submitted today!', 'success');
    return;
  }

  const msgEn = `🔔 *Sales Report Reminder*\nDate: ${today}\n\nThe following branches have not submitted their sales report today:\n${pending.map(p=>'- '+p).join('\n')}\n\nPlease submit via the app ASAP. Thank you!`;
  const msgZh = `🔔 *销售报告提醒*\n日期: ${today}\n\n以下门店尚未提交今日的销售数据：\n${pending.map(p=>'- '+p).join('\n')}\n\n请尽快通过系统提交。谢谢！`;

  // Look for users belonging to pending stores to offer direct WA contact links
  let contactsHtml = '';
  pending.forEach(storeName => {
    const storeUsers = Object.entries(cachedUsers)
      .filter(([uname, u]) => u.store === storeName && u.phone && u.status === 'active')
      .map(([uname, u]) => ({ name: u.name, phone: u.phone }));
    
    if (storeUsers.length > 0) {
      contactsHtml += `
        <div style="margin-top: 8px; font-size:13px; display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:8px 12px; border-radius:8px; border:1px solid var(--border)">
          <span style="font-weight:700">${storeName}:</span>
          <div style="display:flex; gap:6px;">
            ${storeUsers.map(u => `
              <a href="https://wa.me/${u.phone}?text=${encodeURIComponent(lang==='zh'?'您好！请尽快提交您门店今天的日销数据，谢谢！':'Hi! Please submit today\'s sales figures for your branch ASAP, thank you!')}" target="_blank" class="badge" style="background:#d1fae5; color:#065f46; text-decoration:none; display:inline-flex; align-items:center; gap:4px; padding:4px 8px;">
                📱 Direct Chat (${u.name})
              </a>
            `).join('')}
          </div>
        </div>`;
    }
  });

  if (contactsHtml) {
    // Generate a beautiful, interactive popup modal
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay open';
    overlay.id = 'reminder-modal';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">🔔 Send Reminders 提醒未交门店</div>
        <div style="margin-bottom:14px; font-size:14px; color:var(--text2)">
          ${lang==='zh'?'可直接一键发送群发模板至群聊，或者分别私聊对应负责人：':'Send a complete group chat summary, or message the person-in-charge directly:'}
        </div>
        
        <button class="btn warn" onclick="window.open('https://wa.me/?text=${encodeURIComponent(lang === 'zh' ? msgZh : msgEn)}', '_blank'); document.getElementById('reminder-modal').remove();" style="margin-bottom:14px;">
          📢 Send Group Reminder 发送群组提醒
        </button>
        
        <div style="font-weight:800; font-size:13px; margin-bottom:6px; color:var(--text); border-top:1px solid var(--border); padding-top:10px;">
          Direct WhatsApp Chat with Staff:
        </div>
        ${contactsHtml}
        
        <button class="btn secondary" onclick="document.getElementById('reminder-modal').remove();" style="margin-top:16px;">Close 关闭</button>
      </div>
    `;
    document.body.appendChild(overlay);
  } else {
    // General group link fallback
    const text = encodeURIComponent(lang === 'zh' ? msgZh : msgEn);
    window.open('https://wa.me/?text=' + text, '_blank');
  }
}
