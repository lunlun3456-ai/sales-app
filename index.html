<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Sales Reporter 日销报告</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  :root {
    --bg: #f0f4ff; --card: #ffffff; --primary: #2563eb; --primary-dark: #1d4ed8;
    --accent: #f59e0b; --success: #10b981; --danger: #ef4444; --text: #1e293b;
    --text2: #64748b; --border: #e2e8f0; --shadow: 0 4px 24px rgba(37,99,235,0.10); --radius: 18px; --font: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 17px; overflow-x: hidden; }
  .screen { display: none; min-height: 100vh; flex-direction: column; animation: fadeIn .25s; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .topbar { background: var(--primary); color: #fff; padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 99; box-shadow: 0 2px 12px rgba(37,99,235,0.18); }
  .topbar h1 { font-size: 19px; font-weight: 800; letter-spacing: .3px; }
  .topbar .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .lang-btn { background: rgba(255,255,255,0.18); border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #login-screen { align-items: center; justify-content: center; background: linear-gradient(145deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%); padding: 30px 24px; min-height: 100vh; }
  .login-box { background: #fff; border-radius: 28px; padding: 36px 28px 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
  .login-logo { text-align: center; margin-bottom: 18px; }
  .field-label { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; display: block; }
  .input-wrap { margin-bottom: 16px; }
  select, input[type=text], input[type=password], input[type=number], input[type=date], input[type=month] { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; transition: border .2s; }
  select:focus, input:focus { border-color: var(--primary); }
  .btn { display: block; width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 800; cursor: pointer; text-align: center; margin-top: 6px; font-family: var(--font); }
  .btn:active { background: var(--primary-dark); transform: scale(.98); }
  .btn.secondary { background: var(--bg); color: var(--primary); border: 2px solid var(--border); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.success { background: var(--success); color: #fff; }
  .btn.warn { background: var(--accent); color: #fff; }
  .btn.refresh-btn { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 20px; margin-top: 0; background: rgba(255,255,255,0.2); display: flex; align-items: center; gap: 4px; color: #fff; border: none; }
  .btn.refresh-inline { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; margin-top: 0; background: var(--bg); color: var(--primary); border: 1px solid var(--border); }
  .content { padding: 18px 16px 100px; flex: 1; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1.5px solid var(--border); box-shadow: 0 -2px 16px rgba(0,0,0,0.07); z-index: 98; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; cursor: pointer; border: none; background: none; font-family: var(--font); color: var(--text2); font-size: 11px; font-weight: 700; }
  .nav-item.active { color: var(--primary); }
  .nav-item .nav-icon { font-size: 22px; margin-bottom: 2px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-title { font-size: 15px; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .amount-input-wrap { position: relative; margin-bottom: 6px; }
  .amount-prefix { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 800; color: var(--primary); }
  input.amount-input { padding-left: 54px; font-size: 26px; font-weight: 900; height: 64px; background: #eff6ff; border-color: var(--primary); }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { font-size: 15px; color: var(--text2); font-weight: 600; }
  .stat-value { font-size: 17px; font-weight: 900; color: var(--text); }
  .stat-value.big { font-size: 26px; color: var(--primary); }
  .stat-value.green { color: var(--success); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; background: #eff6ff; color: var(--primary); margin-left: 6px; }
  .badge.amber { background: #fef3c7; color: #92400e; }
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-chip { white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; border: 2px solid var(--border); background: #fff; color: var(--text2); cursor: pointer; flex-shrink: 0; }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .record-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .record-item:last-child { border-bottom: none; }
  .record-icon { font-size: 26px; flex-shrink: 0; margin-top: 2px; }
  .record-info { flex: 1; }
  .record-store { font-size: 14px; font-weight: 800; color: var(--text); }
  .record-meta { font-size: 12px; color: var(--text2); margin-top: 2px; line-height: 1.6; }
  .record-amount { font-size: 18px; font-weight: 900; color: var(--primary); }
  .record-sub { font-size: 11px; color: var(--text2); text-align: right; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; opacity: 0; transition: all .3s; z-index: 999; white-space: nowrap; max-width: 85vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success-toast { background: var(--success); }
  #toast.error-toast { background: var(--danger); }
  #toast.pending-toast { background: var(--accent); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 24px 24px 0 0; padding: 28px 24px 40px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; animation: slideUp .25s; }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 18px; }
  .progress-bar-wrap { background: var(--border); border-radius: 8px; height: 10px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #60a5fa); border-radius: 8px; transition: width .5s; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 100px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .bar-fill { width: 100%; background: linear-gradient(180deg, #3b82f6, #1d4ed8); border-radius: 6px 6px 0 0; min-height: 4px; transition: height .5s; }
  .bar-label { font-size: 10px; color: var(--text2); margin-top: 4px; font-weight: 700; }
  .welcome-banner { background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%); border-radius: var(--radius); padding: 20px; color: #fff; margin-bottom: 14px; position: relative; overflow: hidden; }
  .welcome-banner h2 { font-size: 20px; font-weight: 900; }
  .welcome-banner p { font-size: 13px; opacity: .85; margin-top: 4px; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }
  .role-tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-left: 6px; }
  .role-tag.boss { background: #fde8e8; color: #b91c1c; }
  .role-tag.admin { background: #fee2e2; color: #991b1b; }
  .role-tag.manager { background: #dbeafe; color: #1d4ed8; }
  .role-tag.supervisor { background: #d1fae5; color: #065f46; }
  .role-tag.staff { background: #f3e8ff; color: #6d28d9; }
  .user-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .user-row:last-child { border-bottom: none; }
  .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; flex-shrink: 0; }
  .user-avatar.pending-av { background: var(--accent); }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .user-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; font-family: var(--font); }
  .btn-sm.edit { background: #eff6ff; color: var(--primary); }
  .btn-sm.del { background: #fee2e2; color: var(--danger); }
  .btn-sm.approve { background: #d1fae5; color: var(--success); }
  .btn-sm.reject { background: #fee2e2; color: var(--danger); }
  .pending-card { border: 2px solid var(--accent); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; background: #fffbeb; }
  .pending-badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 800; margin-left: 6px; }
  .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 30px; gap: 10px; color: var(--text2); font-size:14px; font-weight:700; }
  .spin { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink:0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* LOG TAB */
  .log-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .log-item:last-child { border-bottom: none; }
  .log-action-new  { display:inline-block; background:#d1fae5; color:#065f46; border-radius:20px; padding:2px 10px; font-size:11px; font-weight:800; }
  .log-action-edit { display:inline-block; background:#fff3cd; color:#856404; border-radius:20px; padding:2px 10px; font-size:11px; font-weight:800; }
  .log-diff { font-size:12px; color:var(--text2); margin-top:4px; line-height:1.7; }
  .diff-arrow { color:#94a3b8; margin:0 4px; }
  .diff-changed { color:var(--danger); font-weight:800; }
  .diff-new { color:var(--success); font-weight:800; }
  @media (min-width: 500px) { body { max-width: 480px; margin: 0 auto; } }
</style>
</head>
<body>

<div id="toast"></div>

<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:340px;margin:0 auto 12px;display:block">
        <defs>
          <linearGradient id="gMain" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
          <linearGradient id="gAccent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#fbbf24"/>
          </linearGradient>
          <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(37,99,235,0.25)"/></filter>
        </defs>
        <text x="180" y="52" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="42" fill="url(#gMain)" filter="url(#shadow)" text-anchor="middle" letter-spacing="3">BRANCHES</text>
        <text x="180" y="84" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="20" fill="#1e3a8a" text-anchor="middle" letter-spacing="6">SALES REPORT</text>
        <rect x="70" y="98" width="220" height="4" rx="2" fill="url(#gAccent)"/>
        <text x="260" y="118" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="14" fill="#f59e0b" font-style="italic">by ki</text>
        <text x="350" y="132" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="end">version 3.0</text>
        <text x="20" y="25" font-size="18" fill="#f59e0b" opacity="0.8">✦</text>
        <text x="335" y="65" font-size="14" fill="#60a5fa" opacity="0.9">✦</text>
        <text x="100" y="125" font-size="10" fill="#93c5fd" opacity="0.7">✦</text>
      </svg>
    </div>
    <div class="input-wrap">
      <label class="field-label">Username 用户名</label>
      <input type="text" id="login-name" placeholder="e.g. bonia_ali" autocomplete="off" autocapitalize="none" autocorrect="off">
    </div>
    <div class="input-wrap">
      <label class="field-label">PIN (4 digits 4位密码)</label>
      <input type="password" id="login-pin" maxlength="4" placeholder="••••" inputmode="numeric">
    </div>
    <button class="btn" onclick="doLogin()">Login 登录</button>
    <button class="btn secondary" onclick="openRegisterModal()" style="margin-top:10px;">📝 Register Account 注册申请</button>
  </div>
</div>

<div id="app-screen" class="screen">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <svg viewBox="0 0 190 40" xmlns="http://www.w3.org/2000/svg" style="width:145px;height:32px;flex-shrink:0">
        <defs>
          <linearGradient id="tgWhite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2e8f0"/>
          </linearGradient>
          <linearGradient id="tgGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <text x="0" y="17" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="16" fill="url(#tgWhite)" letter-spacing="1.5">BRANCHES</text>
        <text x="0" y="31" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="10" fill="url(#tgWhite)" opacity="0.9" letter-spacing="2">SALES REPORT</text>
        <rect x="0" y="35" width="105" height="2.5" rx="1.25" fill="url(#tgGold)"/>
        <text x="112" y="32" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="11" fill="url(#tgGold)" font-style="italic">by ki</text>
        <text x="188" y="38" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="end">v3.0</text>
      </svg>
      <div class="sub" id="app-user-info"></div>
    </div>
    <div class="topbar-right">
      <button class="btn refresh-btn" onclick="triggerSyncRefresh()" id="sync-btn">🔄</button>
      <button class="lang-btn" onclick="toggleLang()">中/EN</button>
    </div>
  </div>

  <div class="content" id="tab-submit"  style="display:block"></div>
  <div class="content" id="tab-records" style="display:none"></div>
  <div class="content" id="tab-summary" style="display:none"></div>
  <div class="content" id="tab-log"     style="display:none"></div>
  <div class="content" id="tab-admin"   style="display:none"></div>
  <div class="content" id="tab-profile" style="display:none"></div>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" onclick="switchTab('submit',this)"  id="nav-submit">
      <span class="nav-icon">📤</span><span id="nav-submit-lbl">Submit</span>
    </button>
    <button class="nav-item" onclick="switchTab('records',this)" id="nav-records">
      <span class="nav-icon">📋</span><span id="nav-records-lbl">Records</span>
    </button>
    <button class="nav-item" onclick="switchTab('summary',this)" id="nav-summary">
      <span class="nav-icon">📊</span><span id="nav-summary-lbl">Summary</span>
    </button>
    <button class="nav-item" onclick="switchTab('log',this)" id="nav-log" style="display:none">
      <span class="nav-icon">📜</span><span id="nav-log-lbl">Log</span>
    </button>
    <button class="nav-item" onclick="switchTab('admin',this)" id="nav-admin" style="display:none">
      <span class="nav-icon">⚙️</span><span id="nav-admin-lbl">Admin</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile',this)" id="nav-profile">
      <span class="nav-icon">👤</span><span id="nav-profile-lbl">Me</span>
    </button>
  </nav>
</div>

<div class="modal-overlay" id="register-modal">
  <div class="modal-box">
    <div class="modal-title">📝 Account Registration Request</div>
    <div class="input-wrap">
      <label class="field-label">Preferred Username 用户名</label>
      <input type="text" id="reg-username" placeholder="e.g. bonia_ali (lowercase)" autocapitalize="none">
    </div>
    <div class="input-wrap">
      <label class="field-label">Full Name / Staff Name 姓名</label>
      <input type="text" id="reg-name" placeholder="e.g. Ali Ahmad">
    </div>
    <div class="input-wrap">
      <label class="field-label">WhatsApp Phone Number 📱 电话号码</label>
      <input type="text" id="reg-phone" placeholder="e.g. 60123456789" inputmode="tel">
    </div>
    <div class="input-wrap">
      <label class="field-label">Target Store Location 门店</label>
      <select id="reg-store">
        <option value="">-- Select Store --</option>
        <option value="Bonia Sabindo">Bonia Sabindo</option>
        <option value="Bonia Eastern">Bonia Eastern</option>
        <option value="Polo Sabindo">Polo Sabindo</option>
        <option value="Polo Eastern">Polo Eastern</option>
        <option value="Gm Sabindo">Gm Sabindo</option>
        <option value="Gm Eastern">Gm Eastern</option>
      </select>
    </div>
    <div class="input-wrap">
      <label class="field-label">Work Role 职位</label>
      <select id="reg-role">
        <option value="staff">Staff 员工</option>
        <option value="supervisor">Supervisor 主管</option>
        <option value="manager">Manager 经理</option>
      </select>
    </div>
    <div class="input-wrap">
      <label class="field-label">Preferred PIN (4 digits) 密码</label>
      <input type="password" id="reg-pin" maxlength="4" placeholder="••••" inputmode="numeric">
    </div>
    <div style="background:#fff8e1;border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#78350f;font-weight:600;">
      ⚠️ Your request will be sent to Admin for approval. You can login only after Admin approves it.<br>
      <span style="font-size:12px;opacity:.8">管理员审批后方可登录。</span>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn secondary" style="flex:1" onclick="closeRegisterModal()">Cancel 取消</button>
      <button class="btn success"   style="flex:1" onclick="submitRegisterRequest()">Submit Request 提交</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Confirm Submission</div>
    <div id="modal-body"></div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn secondary" style="flex:1" onclick="closeModal()">Cancel 取消</button>
      <button class="btn success"   style="flex:1" onclick="confirmSubmit()">Confirm & Submit ✓</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="user-edit-modal">
  <div class="modal-box">
    <div class="modal-title" id="user-edit-title">Edit User</div>
    <input type="hidden" id="edit-user-key">
    <div class="input-wrap">
      <label class="field-label">Username (login ID)</label>
      <input type="text" id="edit-username" autocapitalize="none">
    </div>
    <div class="input-wrap">
      <label class="field-label">Display Name 姓名</label>
      <input type="text" id="edit-name">
    </div>
    <div class="input-wrap">
      <label class="field-label">WhatsApp Phone 📱 电话号码</label>
      <input type="text" id="edit-phone" placeholder="e.g. 60123456789" inputmode="tel">
    </div>
    <div class="input-wrap">
      <label class="field-label">Store Assigned 门店</label>
      <select id="edit-store">
        <option value="HQ">HQ / All Branches</option>
        <option value="Bonia Sabindo">Bonia Sabindo</option>
        <option value="Bonia Eastern">Bonia Eastern</option>
        <option value="Polo Sabindo">Polo Sabindo</option>
        <option value="Polo Eastern">Polo Eastern</option>
        <option value="Gm Sabindo">Gm Sabindo</option>

      <label class="field-label">System Role 权限权限</label>
      <select id="edit-role">
        <option value="staff">Staff 员工</option>
        <option value="supervisor">Supervisor 主管</option>
        <option value="manager">Manager 经理</option>

      <label class="field-label">PIN (4 digits 密码)</label>

      <label class="field-label">Account Status 状态</label>

<div class="modal-overlay" id="all-submitted-modal">
  <div class="modal-box" style="text-align:center">
    <div style="font-size:56px;margin-bottom:10px;">🎉</div>
    <div class="modal-title" id="all-submitted-title" style="text-align:center;margin-bottom:8px">All Stores Submitted!</div>
    <p id="all-submitted-msg" style="font-size:14px;color:var(--text2);margin-bottom:20px">All branches have submitted today.</p>
    <button class="btn success" onclick="document.getElementById('all-submitted-modal').classList.remove('open')" id="awesome-btn">Awesome!</button>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyfrScHOVKa3AHXY7A-C9CxEa8sQpLMcJLLfNz3fJ8MjZ1a3Q2uIMiiq8Z-rngqGHG8/exec";
  
  let lang = 'en';
  let currentUser = null;
  let currentTab = 'submit';
  let cachedUsers = {};
  let cachedLog = [];
  let selectedDateRange = 'today';
  let customDateValue = new Date().toISOString().slice(0,10);
  let selectedMonthValue = new Date().toISOString().slice(0,7);
  let activeRecordStoreFilter = 'all';
  let logStoreFilter = 'all';
  let logActionFilter = 'all';

  const STORES = ['HQ','Bonia Sabindo','Bonia Eastern','Polo Sabindo','Polo Eastern','Gm Sabindo','Gm Eastern'];
  const BRANCHES = ['Bonia Sabindo','Bonia Eastern','Polo Sabindo','Polo Eastern','Gm Sabindo','Gm Eastern'];

  function saveData(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
  function loadData(key, def) { try { const v=localStorage.getItem(key); return v?JSON.parse(v):def; } catch(e){return def;} }

  const I18N = {
    en: {
      submitTab:'Submit', recordsTab:'Records', summaryTab:'Summary', profileTab:'Me', logTab:'Log', adminTab:'Admin Backend',
      welcome:'Welcome back', loginTitle:'Branches Sales Report', cash:'Cash 現金', qr:'QR Pay 微信/支付宝/TNG', card:'Card Credit/Debit Card',
      bank:'Bank Transfer 银行转账', totalSales:'Calculated Total Sales', remark:'Remark (Optional)', submitBtn:'Submit Financial Report',
      filterRange:'Date Filter', todayOpt:'Today', yestOpt:'Yesterday', customOpt:'Select Date', selectMonthLabel:'Select Month',
      pendingApprovals:'Pending Registration Requests', noRequests:'No pending requests.', approveBtn:'Approve ✓', rejectBtn:'Reject ✗',
      addUser:'+ Add New User', editUser:'Edit', deleteUser:'Delete', userMgmt:'User Directory Management', approvedMsg:'User Approved Successfully!',
      rejectedMsg:'Registration request rejected.', userSaved:'User updated successfully.', userDeleted:'User removed.',
      allSubmittedTitle:'All Stores Done!', allSubmittedMsg:'All operational stores have completed their sales reporting for today.',
      remindBtn:'🔔 Send WhatsApp Reminder', awesomeBtn:'Excellent!', dailySalesLabel:'Daily Submission', updateSalesLabel:'Modified Entry',
      changePinTitle:'🔐 Change Personal Security PIN', oldPinLabel:'Current PIN', newPinLabel:'New 4-Digit PIN', confirmNewPinLabel:'Confirm New PIN',
      pinSubmitBtn:'Update Security PIN', onlyTodayAllowed:'Staff/Supervisors are limited to submitting today\'s operational data only.',
      logTab:'Sales Audit Log', logDesc:'Immutable ledger of all entry modifications and initial creations', newEntry:'First Submission',
      editEntry:'Modified Entry', beforeLabel:'Before Revision', afterLabel:'After Revision', noLog:'No historical log logs found.',
      logFilter:'Filter Logs', logAccessDenied:'Only Executives (Boss, Admin, Manager) are permitted to inspect the system modifications trail.',
      accessDenied:'Access Restrict', syncLbl:'Cloud Sync', syncingMsg:'Synchronizing live ledger metrics from structural databases...',
      totalCalculated:'Total Collected', paymentBreakdown:'Channel Metrics', submissionMetrics:'Submissions Progress', monthlyOverview:'Monthly Yield Metrics'
    },
    zh: {
      submitTab:'数据上报', recordsTab:'历史记录', summaryTab:'数据图表', profileTab:'我的账户', logTab:'审计日志', adminTab:'管理后台',
      welcome:'欢迎回来', loginTitle:'门店日销报表系统', cash:'现金收入 (RM)', qr:'扫码支付 (RM)', card:'刷卡收入 (RM)',
      bank:'银行转账 (RM)', totalSales:'当日总营业额', remark:'备注信息 (选填)', submitBtn:'确认提交今日报表',
      filterRange:'日期筛选', todayOpt:'今天', yestOpt:'昨天', customOpt:'自选日期', selectMonthLabel:'月份筛选',
      pendingApprovals:'待审批账号申请', noRequests:'暂无待审批申请。', approveBtn:'批准 ✓', rejectBtn:'拒绝 ✗',
      addUser:'+ 添加新用户', editUser:'编辑', deleteUser:'删除', userMgmt:'系统用户管理', approvedMsg:'已批准账号！',
      rejectedMsg:'已拒绝申请。', userSaved:'用户信息已保存！', userDeleted:'用户已成功删除。',
      allSubmittedTitle:'所有门店已提交！', allSubmittedMsg:'所有门店均已完成今日的营业销售数据上报。',
      remindBtn:'🔔 提醒未交门店', awesomeBtn:'太棒了！', dailySalesLabel:'首次提交', updateSalesLabel:'已修改数据',
      changePinTitle:'🔐 修改个人登录密码', oldPinLabel:'当前密码', newPinLabel:'新密码（4位）', confirmNewPinLabel:'确认新密码',
      pinSubmitBtn:'确认更新密码', onlyTodayAllowed:'员工与主管权限仅允许提报并修改今日的销售数据。',
      logTab:'销售审计日志', logDesc:'所有销售额新增与重改的不可逆历史追溯账目', newEntry:'首次提报数据',
      editEntry:'重修数据记录', beforeLabel:'修改前额度', afterLabel:'修改后额度', noLog:'暂无相关的审计日志。',
      logFilter:'图表过滤', logAccessDenied:'只有高级管理层（老板、管理员、经理）有权限查阅系统核心的修改历史日志。',
      accessDenied:'无权访问', syncLbl:'同步云端', syncingMsg:'正在从云端多维动态数据库进行实时指标同步...',
      totalCalculated:'总计营业额', paymentBreakdown:'支付渠道占比', submissionMetrics:'门店上报进度', monthlyOverview:'月度整体数据概览'
    }
  };

  function t(key) { return I18N[lang][key] || key; }

  window.addEventListener('DOMContentLoaded', () => {
    lang = loadData('sales_lang', 'en');
    const saved = loadData('current_user', null);
    if(saved){
      currentUser = saved;
      showMainApp();
    }
  });

  function toggleLang() {
    lang = lang === 'en' ? 'zh' : 'en';
    saveData('sales_lang', lang);
    document.querySelectorAll('.nav-item').forEach(btn => {
      const id = btn.id.replace('nav-', '');
      const lbl = document.getElementById(`nav-${id}-lbl`);
      if(lbl) lbl.textContent = t(id+'Tab');
    });
    renderTopBarInfo();
    renderCurrentTab();
  }

  function showToast(msg, type='success') {
    const toast = document.getElementById('toast');
    toast.className = `show ${type}-toast`;
    toast.textContent = msg;
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  async function gasGet(action) {
    const res = await fetch(`${WEB_APP_URL}?action=${action}`);
    return res.json();
  }

  async function gasPost(data) {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return res;
  }

  async function doLogin() {
    const username = document.getElementById('login-name').value.trim().toLowerCase();
    const pin = document.getElementById('login-pin').value.trim();
    if(!username || !pin){
      showToast(lang==='zh'?'请输入完整凭证':'Please enter fields','error');
      return;
    }
    showToast(lang==='zh'?'安全验证中...':'Authenticating...','pending');
    try {
      const users = await gasGet('getUsers');
      if(users && users[username]){
        const u = users[username];
        if(u.status === 'pending'){
          showToast(lang==='zh'?'账号尚在等待管理员审批！':'Account is pending admin approval!','error');
          return;
        }
        if(u.status === 'disabled' || u.status === 'inactive'){
          showToast(lang==='zh'?'该账号已被系统停用！':'Account is disabled by management!','error');
          return;
        }
        if(String(u.pin).trim() === String(pin).trim()){
          currentUser = u;
          saveData('current_user', u);
          showMainApp();
          showToast(lang==='zh'?'登录成功！':'Logged in successfully!','success');
        } else {
          showToast(lang==='zh'?'密码不正确！':'Invalid PIN combination!','error');
        }
      } else {
        showToast(lang==='zh'?'用户名未注册！':'User identifier not found!','error');
      }
    } catch(e){
      showToast('Network error: ' + e.message, 'error');
    }
  }

  function showMainApp() {
    document.getElementById('login-screen').classList.remove('active');
    document.getElementById('app-screen').classList.add('active');
    
    const isExec = ['boss','admin','manager'].includes(currentUser.role);
    document.getElementById('nav-admin').style.display = (currentUser.role === 'admin') ? 'flex' : 'none';
    document.getElementById('nav-log').style.display = isExec ? 'flex' : 'none';
    
    renderTopBarInfo();
    triggerSyncRefresh();
  }

  function renderTopBarInfo() {
    document.getElementById('app-user-info').innerHTML = `
      <div style="font-weight:900;font-size:14px;color:#fff">${currentUser.name}</div>
      <div style="font-size:11px;opacity:0.9;display:flex;align-items:center;gap:4px">
        <span>📍 ${currentUser.store}</span> • <span class="role-tag ${currentUser.role}" style="margin:0;padding:1px 6px;font-size:9px">${t(currentUser.role)}</span>
      </div>
    `;
  }

  function getSales() { return loadData('cached_sales', []); }
  function saveSales(arr) { saveData('cached_sales', arr); }

  async function triggerSyncRefresh() {
    const btn = document.getElementById('sync-btn');
    if(btn) btn.textContent = '⏳';
    showToast(lang==='zh'?'正在从云端同步...':'Syncing from Cloud...','pending');
    try {
      const json = await gasGet('getSales');
      if(json && json.sales && Array.isArray(json.sales)){
        saveSales(json.sales);
        renderCurrentTab();
        checkAllStoresSubmitted();
        showToast(lang==='zh'?'数据已从云端更新 ✓':'Synced from Cloud ✓','success');
      } else if(Array.isArray(json)){
        saveSales(json);
        renderCurrentTab();
        checkAllStoresSubmitted();
        showToast(lang==='zh'?'数据已从云端更新 ✓':'Synced from Cloud ✓','success');
      } else {
        console.error('Unexpected response:', json);
        showToast('Sync error: unexpected response','error');
      }
    } catch(e){
      console.error('Sync error:', e);
      showToast(lang==='zh'?'同步失败 — 请检查脚本部署设置':'Sync failed — check GAS deployment settings','error');
    }
    if(btn) btn.textContent = '🔄';
  }

  async function fetchLiveUsers() {
    if(!WEB_APP_URL || WEB_APP_URL.includes("PASTE_YOUR")) return null;
    try {
      const users = await gasGet('getUsers');
      if(users && typeof users==='object' && !Array.isArray(users)){
        cachedUsers = users;
        saveData('cached_users', users);
      }
      return cachedUsers;
    } catch(e){
      console.error('fetchLiveUsers error:', e);
      cachedUsers = loadData('cached_users', {});
      return cachedUsers;
    }
  }

  async function fetchLog() {
    try {
      const json = await gasGet('getLog');
      if(json && json.log && Array.isArray(json.log)){
        cachedLog = json.log;
        return cachedLog;
      }
    } catch(e){
      console.error('fetchLog error:', e);
    }
    return [];
  }

  function checkAllStoresSubmitted() {
    if(currentTab !== 'submit') return;
    const todayStr = new Date().toISOString().slice(0,10);
    const sales = getSales();
    const completed = sales.filter(s => s.dateKey === todayStr).map(s => s.store);
    const missing = BRANCHES.filter(b => !completed.includes(b));
    if(missing.length === 0 && BRANCHES.length > 0) {
      document.getElementById('all-submitted-modal').classList.add('open');
      document.getElementById('all-submitted-title').textContent = t('allSubmittedTitle');
      document.getElementById('all-submitted-msg').textContent = t('allSubmittedMsg');
      document.getElementById('awesome-btn').textContent = t('awesomeBtn');
    }
  }

  function switchTab(tabId, el) {
    currentTab = tabId;
    document.querySelectorAll('.content').forEach(c => c.style.display = 'none');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    document.getElementById(`tab-${tabId}`).style.display = 'block';
    if(el) el.classList.add('active');
    renderCurrentTab();
  }

  function renderCurrentTab() {
    if(currentTab === 'submit') renderSubmitTab();
    if(currentTab === 'records') renderRecordsTab();
    if(currentTab === 'summary') renderSummaryTab();
    if(currentTab === 'log') renderLogTab();
    if(currentTab === 'admin') renderAdminTab();
    if(currentTab === 'profile') renderProfileTab();
  }

  // ============================================================
  // SUBMIT FINANCIAL TAB
  // ============================================================
  function renderSubmitTab() {
    const todayStr = new Date().toISOString().slice(0,10);
    const sales = getSales();
    const completed = sales.filter(s => s.dateKey === todayStr).map(s => s.store);
    const pending = BRANCHES.filter(b => !completed.includes(b));

    let storeSelectorHtml = '';
    if(['admin','boss','manager'].includes(currentUser.role)) {
      storeSelectorHtml = `
        <div class="input-wrap">
          <label class="field-label">Select Location Target Store</label>
          <select id="submit-store" onchange="checkAndLoadExistingSales()">
            ${BRANCHES.map(b => `<option value="${b}" ${currentUser.store===b?'selected':''}>${b}</option>`).join('')}
          </select>
        </div>
      `;
    } else {
      storeSelectorHtml = `
        <div class="input-wrap">
          <label class="field-label">Store Location</label>
          <input type="text" id="disabled-store-view" value="${currentUser.store}" disabled style="background:var(--border);font-weight:700">
          <input type="hidden" id="submit-store" value="${currentUser.store}">
        </div>
      `;
    }

    let dateSelectorHtml = '';
    if(['admin','boss','manager'].includes(currentUser.role)) {
      dateSelectorHtml = `
        <div class="input-wrap">
          <label class="field-label">Reporting Ledger Date</label>
          <input type="date" id="submit-date" value="${todayStr}" onchange="checkAndLoadExistingSales()">
        </div>
      `;
    } else {
      dateSelectorHtml = `
        <div class="input-wrap">
          <label class="field-label">Reporting Date</label>
          <input type="date" id="submit-date" value="${todayStr}" disabled style="background:var(--border)">
        </div>
      `;
    }

    let progressCardHtml = '';
    if(['admin','boss','manager','supervisor'].includes(currentUser.role)) {
      const pct = Math.round((completed.length / BRANCHES.length) * 100) || 0;
      progressCardHtml = `
        <div class="card" style="padding:16px;margin-bottom:14px">
          <div style="display:flex;justify-content:between;align-items:center;margin-bottom:4px">
            <span style="font-size:13px;font-weight:800;color:var(--text)">📊 ${t('submissionMetrics')}</span>
            <span style="font-size:13px;font-weight:900;color:var(--primary);margin-left:auto">${completed.length}/${BRANCHES.length} (${pct}%)</span>
          </div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
          ${pending.length > 0 ? `
            <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:11px;color:var(--danger);font-weight:700">${lang==='zh'?'未交门店':'Pending'}: ${pending.join(', ')}</span>
              <button class="btn btn-sm warn" onclick="openReminderModal()" style="margin:0;padding:4px 10px;font-size:11px;width:auto">${t('remindBtn')}</button>
            </div>
          ` : `<div style="margin-top:8px;font-size:11px;color:var(--success);font-weight:800">✓ All stores submitted standard figures today.</div>`}
        </div>
      `;
    }

    document.getElementById('tab-submit').innerHTML = `
      ${progressCardHtml}
      <div class="card">
        <div class="card-title" style="margin-bottom:14px">📥 Financial Data Intake</div>
        ${dateSelectorHtml}
        ${storeSelectorHtml}
        
        <div class="input-wrap">
          <label class="field-label">💵 ${t('cash')}</label>
          <div class="amount-input-wrap"><span class="amount-prefix">RM</span>
            <input type="number" class="amount-input" id="s-cash" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
          </div>
        </div>
        <div class="input-wrap">
          <label class="field-label">📱 ${t('qr')}</label>
          <div class="amount-input-wrap"><span class="amount-prefix">RM</span>
            <input type="number" class="amount-input" id="s-qr" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
          </div>
        </div>
        <div class="input-wrap">
          <label class="field-label">💳 ${t('card')}</label>
          <div class="amount-input-wrap"><span class="amount-prefix">RM</span>
            <input type="number" class="amount-input" id="s-card" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
          </div>
        </div>
        <div class="input-wrap">
          <label class="field-label">🏦 ${t('bank')}</label>
          <div class="amount-input-wrap"><span class="amount-prefix">RM</span>
            <input type="number" class="amount-input" id="s-bank" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
          </div>
        </div>
        
        <div class="divider"></div>
        <div class="stat-row">
          <span class="stat-label">🧾 ${t('totalSales')}</span>
          <span class="stat-value big" id="live-total">RM 0.00</span>
        </div>
        <div class="input-wrap" style="margin-top:12px">
          <label class="field-label">📝 ${t('remark')}</label>
          <input type="text" id="s-remark" placeholder="...">
        </div>
        <button class="btn" onclick="openConfirm()" style="margin-top:8px;font-size:18px;">${t('submitBtn')}</button>
      </div>
      <div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:12px;padding:12px 16px;font-size:13px;color:#166534;font-weight:600;">
        💡 ${lang==='zh'?'所有金额均可填写为 0.00':'All amounts can be 0.00 (means no sales for that type)'}
      </div>
    `;

    ['s-cash','s-qr','s-card','s-bank'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateLiveTotal);
    });
    checkAndLoadExistingSales();
  }

  function updateLiveTotal() {
    const cash = parseFloat(document.getElementById('s-cash').value) || 0;
    const qr   = parseFloat(document.getElementById('s-qr').value) || 0;
    const card = parseFloat(document.getElementById('s-card').value) || 0;
    const bank = parseFloat(document.getElementById('s-bank').value) || 0;
    document.getElementById('live-total').textContent = 'RM ' + (cash + qr + card + bank).toFixed(2);
  }

  function checkAndLoadExistingSales() {
    const dateVal = document.getElementById('submit-date')?.value;
    const storeVal = document.getElementById('submit-store')?.value;
    if(!dateVal || !storeVal) return;

    const existing = getSales().find(s => s.dateKey === dateVal && s.store === storeVal);
    if(existing){
      document.getElementById('s-cash').value = existing.cash !== undefined ? existing.cash : '';
      document.getElementById('s-qr').value   = existing.qr   !== undefined ? existing.qr   : '';
      document.getElementById('s-card').value = existing.card !== undefined ? existing.card : '';
      document.getElementById('s-bank').value = existing.bank !== undefined ? existing.bank : '';
      document.getElementById('s-remark').value = existing.remark || '';
    } else {
      ['s-cash','s-qr','s-card','s-bank'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('s-remark').value = '';
    }
    updateLiveTotal();
  }

  function openConfirm() {
    const cashStr = document.getElementById('s-cash').value.trim();
    const qrStr   = document.getElementById('s-qr').value.trim();
    const cardStr = document.getElementById('s-card').value.trim();
    const bankStr = document.getElementById('s-bank').value.trim();

    if(!cashStr && !qrStr && !cardStr && !bankStr){
      showToast(t('fillAll'), 'error');
      return;
    }

    const todayStr = new Date().toISOString().slice(0,10);
    const dateVal = document.getElementById('submit-date').value;
    if(dateVal !== todayStr && ['staff','supervisor'].includes(currentUser.role)) {
      showToast(t('onlyTodayAllowed'), 'error');
      return;
    }

    const storeVal = document.getElementById('submit-store').value;
    const cash = parseFloat(cashStr) || 0;
    const qr   = parseFloat(qrStr) || 0;
    const card = parseFloat(cardStr) || 0;
    const bank = parseFloat(bankStr) || 0;
    const total = cash + qr + card + bank;
    const remark = document.getElementById('s-remark').value.trim();

    const existing = getSales().find(s => s.dateKey === dateVal && s.store === storeVal);
    const isUpdate = !!existing;

    document.getElementById('modal-title').textContent = t('confirmTitle') + ` (${isUpdate ? t('updateSalesLabel') : t('dailySalesLabel')})`;
    document.getElementById('modal-body').innerHTML = `
      <div style="font-size:14px;background:var(--bg);padding:14px;border-radius:12px;border:1px solid var(--border);line-height:1.7">
        <p>📍 <strong>Store:</strong> ${storeVal}</p>
        <p>📅 <strong>Date:</strong> ${dateVal}</p>
        <hr style="margin:8px 0;border:none;border-top:1px solid var(--border)">
        <p>💵 Cash: RM ${cash.toFixed(2)}</p>
        <p>📱 QR Pay: RM ${qr.toFixed(2)}</p>
        <p>💳 Card: RM ${card.toFixed(2)}</p>
        <p>🏦 Bank: RM ${bank.toFixed(2)}</p>
        <p style="font-size:18px;color:var(--primary);margin-top:6px;font-weight:900">🧾 Total: RM ${total.toFixed(2)}</p>
        ${remark ? `<p style="margin-top:4px;color:var(--text2)">📝 Note: "${remark}"</p>` : ''}
      </div>
      ${isUpdate ? `

  function closeModal() { document.getElementById('confirm-modal').classList.remove('open'); }

  async function confirmSubmit() {
    const dateVal = document.getElementById('submit-date').value;
    const storeVal = document.getElementById('submit-store').value;
    const cash = parseFloat(document.getElementById('s-cash').value) || 0;
    const qr   = parseFloat(document.getElementById('s-qr').value) || 0;
    const card = parseFloat(document.getElementById('s-card').value) || 0;
    const bank = parseFloat(document.getElementById('s-bank').value) || 0;
    const total = cash + qr + card + bank;
    const remark = document.getElementById('s-remark').value.trim();

    const existing = getSales().find(s => s.dateKey === dateVal && s.store === storeVal);
    let changeNote = '';
    
    if(existing) {
      const inputEl = document.getElementById('change-note-input');
      changeNote = inputEl ? inputEl.value.trim() : '';
      if(!changeNote) {
        alert(lang==='zh'?'请输入修改数据的理由原因':'Please provide a reason for data modification.');
        return;
      }
    }

    const changeLog = {
      before: {
        cash: existing ? (existing.cash || 0) : 0,
        qr: existing ? (existing.qr || 0) : 0,
        card: existing ? (existing.card || 0) : 0,
        bank: existing ? (existing.bank || 0) : 0,
        total: existing ? (existing.total || 0) : 0
      },
      note: changeNote
    };

    const payload = {
      action: 'submitSales',
      id: existing ? existing.id : 'S-' + Date.now(),
      dateKey: dateVal,
      store: storeVal,
      cash, qr, card, bank, total,
      remark,
      submitter: currentUser.username,
      role: currentUser.role,
      datetime: new Date().toISOString().replace('T',' ').substring(0,19),
      month: dateVal.substring(0,7),
      submissionType: existing ? 'update' : 'daily',
      changeLog
    };

    closeModal();
    showToast(lang==='zh'?'正在发送数据至云端...':'Transmitting to Cloud...','pending');

    // Optimistic UI updates
    let sales = getSales();
    if(existing) {
      sales = sales.map(s => (s.dateKey===dateVal && s.store===storeVal) ? {...s, cash, qr, card, bank, total, remark} : s);
    } else {
      sales.push(payload);
    }
    saveSales(sales);
    renderCurrentTab();

    try {
      await gasPost(payload);
      showToast(t('submitted'), 'success');
      setTimeout(triggerSyncRefresh, 1000);
    } catch(e) {
      showToast('Network timeout — transaction failed to verify','error');
    }
  }

  function renderSummaryTab() {
    const sales = getSales();
    const isExec = ['boss','admin','manager'].includes(currentUser.role);
    let filtered = isExec ? sales : sales.filter(s => s.store === currentUser.store);
    filtered = filtered.filter(s => s.month === selectedMonthValue);

    let totalCash=0, totalQr=0, totalCard=0, totalBank=0, grandTotal=0;
    const storeTotals = {};
    BRANCHES.forEach(b => storeTotals[b] = 0);

    filtered.forEach(s => {
      const c = parseFloat(s.cash)||0;
      const q = parseFloat(s.qr)||0;
      const cd = parseFloat(s.card)||0;
      const b = parseFloat(s.bank)||0;
      const t = parseFloat(s.total)||0;

      totalCash += c; totalQr += q; totalCard += cd; totalBank += b; grandTotal += t;
      if(storeTotals[s.store] !== undefined) storeTotals[s.store] += t;
    });

    // Generate bar chart scales
    const maxStoreVal = Math.max(...Object.values(storeTotals), 1);
    const chartBarsHtml = Object.keys(storeTotals).map(st => {
      const val = storeTotals[st];
      const pct = Math.min((val / maxStoreVal) * 100, 100);
      const shortName = st.replace('Bonia ','B-').replace('Polo ','P-').replace('Gm ','G-');
      return `
        <div class="bar-col">
          <div style="font-size:9px;font-weight:900;color:var(--text)">${val > 0 ? (val/1000).toFixed(1)+'k' : '0'}</div>
          <div class="bar-fill" style="height:${Math.max(pct, 4)}%"></div>
          <div class="bar-label">${shortName}</div>
        </div>
      `;
    }).join('');

    document.getElementById('tab-summary').innerHTML = `

        <input type="month" value="${selectedMonthValue}" onchange="updateSummaryMonth(this.value)">

      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:14px">🏪 ${t('monthlyOverview')}</div>
        <div class="bar-chart">${chartBarsHtml}</div>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:10px">💳 ${t('paymentBreakdown')}</div>
        <div class="stat-row"><span class="stat-label">💵 Cash:</span><span class="stat-value">RM ${totalCash.toFixed(2)}</span></div>
        <div class="stat-row"><span class="stat-label">📱 QR Pay:</span><span class="stat-value">RM ${totalQr.toFixed(2)}</span></div>
        <div class="stat-row"><span class="stat-label">💳 Card Terminal:</span><span class="stat-value">RM ${totalCard.toFixed(2)}</span></div>

  function applyLogFilters() {
    const container = document.getElementById('log-items-container');
    if(!container) return;

    let filtered = cachedLog.slice().sort((a,b) => String(b.timestamp).localeCompare(String(a.timestamp)));
    if(logStoreFilter !== 'all') filtered = filtered.filter(l => l.store === logStoreFilter);
    if(logActionFilter !== 'all') filtered = filtered.filter(l => l.action === logActionFilter);

    if(filtered.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="e-icon">📜</div><p>${t('noLog')}</p></div>`;
      return;
    }

    container.innerHTML = filtered.map(l => {
      const isEdit = l.action === 'update';
      const actionBadge = isEdit ? `<span class="log-action-edit">${t('editEntry')}</span>` : `<span class="log-action-new">${t('newEntry')}</span>`;
      
      let diffHtml = '';
      if(isEdit) {
        const bCash = parseFloat(l.before_cash)||0; const aCash = parseFloat(l.after_cash)||0;
        const bQr   = parseFloat(l.before_qr)||0;   const aQr   = parseFloat(l.after_qr)||0;
        const bCard = parseFloat(l.before_card)||0; const aCard = parseFloat(l.after_card)||0;
        const bBank = parseFloat(l.before_bank)||0; const aBank = parseFloat(l.after_bank)||0;
        const bTot  = parseFloat(l.before_total)||0;const aTot  = parseFloat(l.after_total)||0;

        diffHtml = `
          <div class="log-diff">
            ${bCash!==aCash ? `<div>💵 Cash: RM ${bCash.toFixed(2)} <span class="diff-arrow">➔</span> <span class="diff-new">${aCash.toFixed(2)}</span></div>`:''}
            ${bQr!==aQr     ? `<div>📱 QR Pay: RM ${bQr.toFixed(2)} <span class="diff-arrow">➔</span> <span class="diff-new">${aQr.toFixed(2)}</span></div>`:''}
            ${bCard!==aCard ? `<div>⌗ Card: RM ${bCard.toFixed(2)} <span class="diff-arrow">➔</span> <span class="diff-new">${aCard.toFixed(2)}</span></div>`:''}
            ${bBank!==aBank ? `<div>🏦 Bank: RM ${bBank.toFixed(2)} <span class="diff-arrow">➔</span> <span class="diff-new">${aBank.toFixed(2)}</span></div>`:''}
            <div style="font-weight:700">🧾 Total: RM ${bTot.toFixed(2)} <span class="diff-arrow">➔</span> <span class="diff-changed">RM ${aTot.toFixed(2)}</span></div>
            ${l.changeNote ? `<div style="color:var(--accent);font-weight:600;margin-top:2px;">💬 Reason: "${l.changeNote}"</div>`:''}
          </div>
        `;
      } else {
        diffHtml = `<div class="log-diff" style="font-weight:700;color:var(--success)">🧾 Reported Amount: RM ${(parseFloat(l.after_total)||0).toFixed(2)}</div>`;
      }

      return `
        <div class="log-item">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <strong>${l.store}</strong> <span style="font-size:12px;color:var(--text2)">(${l.dateKey})</span>
            </div>
            ${actionBadge}
          </div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">
            Executed by @${l.submitter} (${l.role}) at ${l.timestamp}
          </div>
          ${diffHtml}
        </div>
      `;
    }).join('');
  }

  }

  async function deleteUserRow(username) {
    if(!confirm(`CRITICAL: Remove access authorization profile for @${username}?`)) return;
    showToast('Deleting ledger entry index...','pending');
    try {
      await gasPost({ action: 'deleteUser', username });
      showToast(t('userDeleted'), 'success');
      const u = await fetchLiveUsers(); renderAdminUsersData(u);
    } catch(e){ alert(e); }
  }

  // ============================================================
  // USER MODAL REGISTER REQUESTS FRONTEND
  // ============================================================
  function openRegisterModal() { document.getElementById('register-modal').classList.add('open'); }
  function closeRegisterModal() { document.getElementById('register-modal').classList.remove('remove'); document.getElementById('register-modal').classList.remove('open'); }

  async function submitRegisterRequest() {
    const username = document.getElementById('reg-username').value.trim().toLowerCase();
    const name     = document.getElementById('reg-name').value.trim();
    const phone    = document.getElementById('reg-phone').value.trim();
    const store    = document.getElementById('reg-store').value;
    const role     = document.getElementById('reg-role').value;
    const pin      = document.getElementById('reg-pin').value.trim();

    if(!username || !name || !phone || !store || !role || !pin) {
      alert('Please fill out all registration parameters fields.');
      return;
    }
    if(pin.length !== 4 || isNaN(pin)){
      alert('Security PIN selection must be exactly a 4-digit number numeric combination.');
      return;
    }

    const payload = { action: 'registerRequest', username, name, phone, store, role, pin };
    closeRegisterModal();
    showToast('Filing official registration token...','pending');

    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      alert('✓ Registration parameters filed successfully! Please prompt an authorized system Admin to enable your login.');
    } catch(e){
      alert('Error connecting infrastructure pipeline: ' + e.message);
    }
  }

  // ============================================================
  // ACCOUNT PROFILE ME TAB
  // ============================================================
  function renderProfileTab() {
    document.getElementById('tab-profile').innerHTML = `
      <div class="welcome-banner">
        <h2>${t('welcome')}, ${currentUser.name}!</h2>
        <p>Authenticated system identity descriptor frame log.</p>
        <div style="margin-top:12px;font-size:12px;background:rgba(255,255,255,0.2);padding:6px 12px;border-radius:8px;display:inline-block">
          Username ID: <strong>${currentUser.username}</strong>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title" style="margin-bottom:12px">${t('changePinTitle')}</div>
        <div class="input-wrap">
          <label class="field-label">${t('oldPinLabel')}</label>
          <input type="password" id="p-old" maxlength="4" placeholder="••••">
        </div>
        <div class="input-wrap">
          <label class="field-label">${t('newPinLabel')}</label>
          <input type="password" id="p-new1" maxlength="4" placeholder="••••">
        </div>
        <div class="input-wrap">
          <label class="field-label">${t('confirmNewPinLabel')}</label>
          <input type="password" id="p-new2" maxlength="4" placeholder="••••">
        </div>
        <button class="btn secondary" onclick="executePinChange()">✓ ${t('pinSubmitBtn')}</button>
      </div>

      <button class="btn danger" onclick="doLogout()" style="margin-top:10px">${t('logout')}</button>
    `;
  }

  async function executePinChange() {
    const oldPin = document.getElementById('p-old').value.trim();
    const n1 = document.getElementById('p-new1').value.trim();
    const n2 = document.getElementById('p-new2').value.trim();

    if(String(currentUser.pin).trim() !== oldPin) { alert('Current input security PIN verification combination failed.'); return; }
    if(n1.length !== 4 || isNaN(n1)) { alert('New verification structures must conform exactly to a 4-digit token structure.'); return; }
    if(n1 !== n2) { alert('Confirmation configuration mismatch.'); return; }

    const updatedUser = { ...currentUser, pin: n1 };
    showToast('Restructuring encryption records keys...','pending');
    try {
      await gasPost({ action: 'saveUser', ...updatedUser });
      currentUser = updatedUser;
      saveData('current_user', currentUser);
      showToast('Security configuration updated safely ✓', 'success');
      renderProfileTab();
    } catch(e){ alert(e); }
  }

  function doLogout() {
    if(!confirm('Log out from active structural session parameters securely?')) return;
    localStorage.removeItem('current_user');
    currentUser = null;
    document.getElementById('app-screen').classList.remove('active');
    document.getElementById('login-screen').classList.add('active');
    document.getElementById('login-name').value = '';
    document.getElementById('login-pin').value = '';
  }

  // ============================================================
  // WHATSAPP OPERATIONS ALERTS SYSTEM
  // ============================================================
  function openReminderModal() {
    const todayStr = new Date().toISOString().slice(0,10);
    const sales = getSales();
    const completed = sales.filter(s => s.dateKey === todayStr).map(s => s.store);
    const pending = BRANCHES.filter(b => !completed.includes(b));

    if(pending.length === 0) { alert('All functional locations updated operational accounts metrics.'); return; }

    const msgEn = `📢 *STORES REMINDER* 📢\nThe following branches have not submitted their daily sales report for today (*${todayStr}*):\n\n👉 *${pending.join(', ')}*\n\nPlease submit your sales reports as soon as possible. Thank you!`;
    const msgZh = `📢 *团队温馨提示：未交店面催报* 📢\n以下店面尚未提报今日（*${todayStr}*）销售营业额数据：\n\n👉 *${pending.join(', ')}*\n\n请相关负责人收到通知后，立即前往报表工具完成数据录入，谢谢配合！`;

    let contactsHtml = '';
    const uList = Object.values(cachedUsers);
    
    pending.forEach(storeName => {
      const staffInStore = uList.filter(u => u.store === storeName && u.status==='active' && u.phone);
      if(staffInStore.length > 0) {
        contactsHtml += `
          <div style="margin-top:8px;background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--border)">
            <div style="font-size:12px;font-weight:900;color:var(--text);margin-bottom:4px">🏪 ${storeName}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${staffInStore.map(u => {
                const individualTxt = lang==='zh'
                  ? `Hi ${u.name}，温馨提醒，您负责的 ${storeName} 门店今日销售报表尚未提交，麻烦抽空进入系统提报哦，谢谢！`
                  : `Hi ${u.name}, gentle reminder that the sales report for ${storeName} today has not been submitted yet. Please submit via the app at your earliest convenience. Thanks!`;
                return `
                  <a href="https://wa.me/${u.phone}?text=${encodeURIComponent(individualTxt)}" target="_blank" class="btn success" style="width:auto;margin:0;font-size:11px;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;">
                    📱 ${u.name}
                  </a>`;
              }).join('')}
            </div>
          </div>`;
      }
    });

    if(contactsHtml){
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay open'; overlay.id = 'reminder-modal';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-title">🔔 Send Reminders</div>
          <p style="font-size:14px;color:var(--text2);margin-bottom:14px">${lang==='zh'?'未提交门店：':'Pending stores:'} <strong>${pending.join(', ')}</strong></p>
          <button class="btn warn" onclick="window.open('https://wa.me/?text=${encodeURIComponent(lang==='zh'?msgZh:msgEn)}','_blank');document.getElementById('reminder-modal').remove();" style="margin-bottom:14px">
            📢 ${lang==='zh'?'发送群组提醒':'Send Group Reminder'}
          </button>
          <div style="font-weight:800;font-size:13px;margin-bottom:6px;color:var(--text);border-top:1px solid var(--border);padding-top:10px">
            ${lang==='zh'?'直接联系负责人：':'Direct WhatsApp to staff:'}
          </div>
          ${contactsHtml}
          <button class="btn secondary" onclick="document.getElementById('reminder-modal').remove();" style="margin-top:16px">Close 关闭</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }
  }
</script>
