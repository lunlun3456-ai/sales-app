<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Sales Reporter 日销报告</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  :root {
    --bg: #f0f4ff; --card: #ffffff; --primary: #2563eb; --primary-dark: #1d4ed8;
    --accent: #f59e0b; --success: #10b981; --danger: #ef4444; --text: #1e293b;
    --text2: #64748b; --border: #e2e8f0; --shadow: 0 4px 24px rgba(37,99,235,0.10); --radius: 18px; --font: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 17px; overflow-x: hidden; }
  .screen { display: none; min-height: 100vh; flex-direction: column; animation: fadeIn .25s; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .topbar { background: var(--primary); color: #fff; padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 99; box-shadow: 0 2px 12px rgba(37,99,235,0.18); }
  .topbar h1 { font-size: 19px; font-weight: 800; letter-spacing: .3px; }
  .topbar .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .lang-btn { background: rgba(255,255,255,0.18); border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #login-screen { align-items: center; justify-content: center; background: linear-gradient(145deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%); padding: 30px 24px; min-height: 100vh; }
  .login-box { background: #fff; border-radius: 28px; padding: 36px 28px 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
  .login-logo { text-align: center; margin-bottom: 18px; }
  .field-label { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; display: block; }
  .input-wrap { margin-bottom: 16px; }
  select, input[type=text], input[type=password], input[type=number], input[type=date], input[type=month] { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; transition: border .2s; }
  select:focus, input:focus { border-color: var(--primary); }
  .btn { display: block; width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 800; cursor: pointer; text-align: center; margin-top: 6px; font-family: var(--font); }
  .btn:active { background: var(--primary-dark); transform: scale(.98); }
  .btn.secondary { background: var(--bg); color: var(--primary); border: 2px solid var(--border); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.success { background: var(--success); color: #fff; }
  .btn.warn { background: var(--accent); color: #fff; }
  .btn.refresh-btn { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 20px; margin-top: 0; background: rgba(255,255,255,0.2); display: flex; align-items: center; gap: 4px; color: #fff; border: none; }
  .btn.refresh-inline { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; margin-top: 0; background: var(--bg); color: var(--primary); border: 1px solid var(--border); }
  .content { padding: 18px 16px 100px; flex: 1; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1.5px solid var(--border); box-shadow: 0 -2px 16px rgba(0,0,0,0.07); z-index: 98; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; cursor: pointer; border: none; background: none; font-family: var(--font); color: var(--text2); font-size: 11px; font-weight: 700; }
  .nav-item.active { color: var(--primary); }
  .nav-item .nav-icon { font-size: 22px; margin-bottom: 2px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-title { font-size: 15px; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .amount-input-wrap { position: relative; margin-bottom: 6px; }
  .amount-prefix { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 800; color: var(--primary); }
  input.amount-input { padding-left: 54px; font-size: 26px; font-weight: 900; height: 64px; background: #eff6ff; border-color: var(--primary); }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { font-size: 15px; color: var(--text2); font-weight: 600; }
  .stat-value { font-size: 17px; font-weight: 900; color: var(--text); }
  .stat-value.big { font-size: 26px; color: var(--primary); }
  .stat-value.green { color: var(--success); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; background: #eff6ff; color: var(--primary); margin-left: 6px; }
  .badge.amber { background: #fef3c7; color: #92400e; }
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-chip { white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; border: 2px solid var(--border); background: #fff; color: var(--text2); cursor: pointer; flex-shrink: 0; }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .record-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .record-item:last-child { border-bottom: none; }
  .record-icon { font-size: 26px; flex-shrink: 0; margin-top: 2px; }
  .record-info { flex: 1; }
  .record-store { font-size: 14px; font-weight: 800; color: var(--text); }
  .record-meta { font-size: 12px; color: var(--text2); margin-top: 2px; line-height: 1.6; }
  .record-amount { font-size: 18px; font-weight: 900; color: var(--primary); }
  .record-sub { font-size: 11px; color: var(--text2); text-align: right; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; opacity: 0; transition: all .3s; z-index: 999; white-space: nowrap; max-width: 85vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success-toast { background: var(--success); }
  #toast.error-toast { background: var(--danger); }
  #toast.pending-toast { background: var(--accent); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 24px 24px 0 0; padding: 28px 24px 40px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; animation: slideUp .25s; }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 18px; }
  .progress-bar-wrap { background: var(--border); border-radius: 8px; height: 10px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #60a5fa); border-radius: 8px; transition: width .5s; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 100px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .bar-fill { width: 100%; background: linear-gradient(180deg, #3b82f6, #1d4ed8); border-radius: 6px 6px 0 0; min-height: 4px; transition: height .5s; }
  .bar-label { font-size: 10px; color: var(--text2); margin-top: 4px; font-weight: 700; }
  .welcome-banner { background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%); border-radius: var(--radius); padding: 20px; color: #fff; margin-bottom: 14px; position: relative; overflow: hidden; }
  .welcome-banner h2 { font-size: 20px; font-weight: 900; }
  .welcome-banner p { font-size: 13px; opacity: .85; margin-top: 4px; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }
  .role-tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-left: 6px; }
  .role-tag.boss { background: #fde8e8; color: #b91c1c; }
  .role-tag.admin { background: #fee2e2; color: #991b1b; }
  .role-tag.manager { background: #dbeafe; color: #1d4ed8; }
  .role-tag.supervisor { background: #d1fae5; color: #065f46; }
  .role-tag.staff { background: #f3e8ff; color: #6d28d9; }
  .user-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .user-row:last-child { border-bottom: none; }
  .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; flex-shrink: 0; }
  .user-avatar.pending-av { background: var(--accent); }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .user-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; font-family: var(--font); }
  .btn-sm.edit { background: #eff6ff; color: var(--primary); }
  .btn-sm.del { background: #fee2e2; color: var(--danger); }
  .btn-sm.approve { background: #d1fae5; color: var(--success); }
  .btn-sm.reject { background: #fee2e2; color: var(--danger); }
  .pending-card { border: 2px solid var(--accent); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; background: #fffbeb; }
  .pending-badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 800; margin-left: 6px; }
  .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 30px; gap: 10px; color: var(--text2); font-size:14px; font-weight:700; }
  .spin { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink:0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* LOG TAB */
  .log-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .log-item:last-child { border-bottom: none; }
  .log-action-new  { display:inline-block; background:#d1fae5; color:#065f46; border-radius:20px; padding:2px 10px; font-size:11px; font-weight:800; }
  .log-action-edit { display:inline-block; background:#fff3cd; color:#856404; border-radius:20px; padding:2px 10px; font-size:11px; font-weight:800; }
  .log-diff { font-size:12px; color:var(--text2); margin-top:4px; line-height:1.7; }
  .diff-arrow { color:#94a3b8; margin:0 4px; }
  .diff-changed { color:var(--danger); font-weight:800; }
  .diff-new { color:var(--success); font-weight:800; }
  @media (min-width: 500px) { body { max-width: 480px; margin: 0 auto; } }
  /* EOD / SETTLEMENT */
  .eod-badge { display:inline-block;background:#d1fae5;color:#065f46;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800; }
  .update-badge { display:inline-block;background:#fff3cd;color:#856404;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800; }
  .new-badge { display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800; }
</style>
</head>
<body>

<div id="toast"></div>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:340px;margin:0 auto 12px;display:block">
        <defs>
          <linearGradient id="gMain" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
          <linearGradient id="gAccent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#fbbf24"/>
          </linearGradient>
          <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(37,99,235,0.25)"/></filter>
        </defs>
        <text x="180" y="52" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="42" fill="url(#gMain)" filter="url(#shadow)" text-anchor="middle" letter-spacing="3">BRANCHES</text>
        <text x="180" y="84" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="20" fill="#1e3a8a" text-anchor="middle" letter-spacing="6">SALES REPORT</text>
        <rect x="70" y="98" width="220" height="4" rx="2" fill="url(#gAccent)"/>
        <text x="260" y="118" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="14" fill="#f59e0b" font-style="italic">by ki</text>
        <text x="350" y="132" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="end">version 5.0</text>
        <text x="20" y="25" font-size="18" fill="#f59e0b" opacity="0.8">✦</text>
        <text x="335" y="65" font-size="14" fill="#60a5fa" opacity="0.9">✦</text>
        <text x="100" y="125" font-size="10" fill="#93c5fd" opacity="0.7">✦</text>
      </svg>
    </div>
    <div class="input-wrap">
      <label class="field-label">Username 用户名</label>
      <input type="text" id="login-name" placeholder="e.g. bonia_ali" autocomplete="off" autocapitalize="none" autocorrect="off">
    </div>
    <div class="input-wrap">
      <label class="field-label">PIN (4 digits 4位密码)</label>
      <input type="password" id="login-pin" maxlength="4" placeholder="••••" inputmode="numeric">
    </div>
    <button class="btn" onclick="doLogin()" id="login-btn">Login 登录</button>
    <button class="btn secondary" onclick="openRegisterModal()" style="margin-top:10px;">📝 Register Account 注册申请</button>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app-screen" class="screen">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <svg viewBox="0 0 190 40" xmlns="http://www.w3.org/2000/svg" style="width:145px;height:32px;flex-shrink:0">
        <defs>
          <linearGradient id="tgWhite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2e8f0"/>
          </linearGradient>
          <linearGradient id="tgGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <text x="0" y="17" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="16" fill="url(#tgWhite)" letter-spacing="1.5">BRANCHES</text>
        <text x="0" y="31" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="10" fill="url(#tgWhite)" opacity="0.9" letter-spacing="2">SALES REPORT</text>
        <rect x="0" y="35" width="105" height="2.5" rx="1.25" fill="url(#tgGold)"/>
        <text x="112" y="32" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="11" fill="url(#tgGold)" font-style="italic">by ki</text>
        <text x="188" y="38" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="end">v5.0</text>
      </svg>
      <div class="sub" id="app-user-info"></div>
    </div>
    <div class="topbar-right">
      <button class="btn refresh-btn" onclick="triggerSyncRefresh()" id="sync-btn">🔄</button>
      <button class="lang-btn" onclick="toggleLang()">中/EN</button>
    </div>
  </div>

  <div class="content" id="tab-submit"  style="display:block"></div>
  <div class="content" id="tab-records" style="display:none"></div>
  <div class="content" id="tab-summary" style="display:none"></div>
  <div class="content" id="tab-log"     style="display:none"></div>
  <div class="content" id="tab-admin"   style="display:none"></div>
  <div class="content" id="tab-profile" style="display:none"></div>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" onclick="switchTab('submit',this)"  id="nav-submit">
      <span class="nav-icon">📤</span><span id="nav-submit-lbl">Submit</span>
    </button>
    <button class="nav-item" onclick="switchTab('records',this)" id="nav-records">
      <span class="nav-icon">📋</span><span id="nav-records-lbl">Records</span>
    </button>
    <button class="nav-item" onclick="switchTab('summary',this)" id="nav-summary">
      <span class="nav-icon">📊</span><span id="nav-summary-lbl">Summary</span>
    </button>
    <button class="nav-item" onclick="switchTab('log',this)" id="nav-log" style="display:none">
      <span class="nav-icon">📜</span><span id="nav-log-lbl">Log</span>
    </button>
    <button class="nav-item" onclick="switchTab('admin',this)" id="nav-admin" style="display:none">
      <span class="nav-icon">⚙️</span><span id="nav-admin-lbl">Admin</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile',this)" id="nav-profile">
      <span class="nav-icon">👤</span><span id="nav-profile-lbl">Me</span>
    </button>
  </nav>
</div>

<!-- ===================== REGISTER MODAL ===================== -->
<div class="modal-overlay" id="register-modal">
  <div class="modal-box">
    <div class="modal-title">📝 Account Registration Request</div>
    <div class="input-wrap">
      <label class="field-label">Preferred Username 用户名</label>
      <input type="text" id="reg-username" placeholder="e.g. bonia_ali (lowercase)" autocapitalize="none">
    </div>
    <div class="input-wrap">
      <label class="field-label">Full Name / Staff Name 姓名</label>
      <input type="text" id="reg-name" placeholder="e.g. Ali Ahmad">
    </div>
    <div class="input-wrap">
      <label class="field-label">WhatsApp Phone Number 📱 电话号码</label>
      <input type="text" id="reg-phone" placeholder="e.g. 60123456789" inputmode="tel">
    </div>
    <div class="input-wrap">
      <label class="field-label">Target Store Location 门店</label>
      <select id="reg-store">
        <option value="">-- Select Store --</option>
        <option value="Bonia Sabindo">Bonia Sabindo</option>
        <option value="Bonia Eastern">Bonia Eastern</option>
        <option value="Polo Sabindo">Polo Sabindo</option>
        <option value="Polo Eastern">Polo Eastern</option>
        <option value="Gm Sabindo">Gm Sabindo</option>
        <option value="Gm Eastern">Gm Eastern</option>
      </select>
    </div>
    <div class="input-wrap">
      <label class="field-label">Work Role 职位</label>
      <select id="reg-role">
        <option value="staff">Staff 员工</option>
        <option value="supervisor">Supervisor 主管</option>
        <option value="manager">Manager 经理</option>
      </select>
    </div>
    <div class="input-wrap">
      <label class="field-label">Preferred PIN (4 digits) 密码</label>
      <input type="password" id="reg-pin" maxlength="4" placeholder="••••" inputmode="numeric">
    </div>
    <div style="background:#fff8e1;border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#78350f;font-weight:600;">
      ⚠️ Your request will be sent to Admin for approval. You can login only after Admin approves it.<br>
      <span style="font-size:12px;opacity:.8">管理员审批后方可登录。</span>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn secondary" style="flex:1" onclick="closeRegisterModal()">Cancel 取消</button>
      <button class="btn success"   style="flex:1" onclick="submitRegisterRequest()">Submit Request 提交</button>
    </div>
  </div>
</div>

<!-- ===================== CONFIRM SUBMIT MODAL ===================== -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Confirm Submission</div>
    <div id="modal-body"></div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn secondary" style="flex:1" onclick="closeModal()">Cancel 取消</button>
      <button class="btn success"   style="flex:1" onclick="confirmSubmit()">Confirm & Submit ✓</button>
    </div>
  </div>
</div>

<!-- ===================== USER EDIT MODAL ===================== -->
<div class="modal-overlay" id="user-edit-modal">
  <div class="modal-box">
    <div class="modal-title" id="user-edit-title">Edit User</div>

// ============================================================
// SYNC / REFRESH
// ============================================================
// ── Robust GET helper — uses fetch with no-cors fallback via script tag ──────
// Google Apps Script GETs work fine with plain fetch() AS LONG AS the
// deployment is set to "Execute as: Me" + "Who has access: Anyone".
// We add { redirect:'follow' } to chase the redirect GAS always issues.
function gasGet(action) {
  return new Promise((resolve, reject) => {
    const url = WEB_APP_URL + '?action=' + action + '&t=' + Date.now();
    fetch(url, { method:'GET', redirect:'follow', credentials:'omit', cache:'no-cache' })
      .then(r => {
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(text => {
        if(text.trim().startsWith('<')) {
          reject(new Error('GAS returned HTML — check: Deploy > Who has access = Anyone'));
          return;
        }
        try { resolve(JSON.parse(text)); }
        catch(e) { reject(new Error('Bad JSON: ' + text.slice(0,200))); }
      })
      .catch(err => { reject(err); });
  });
}

async function triggerSyncRefresh() {

    if(json&&json.sales&&Array.isArray(json.sales)){
      saveSales(json.sales); renderCurrentTab(); checkAllStoresSubmitted();

      if(currentTab!=='records') { const tmp=currentTab; currentTab='records'; currentTab=tmp; }
      showToast(lang==='zh'?'数据已从云端更新 ✓':'Synced from Cloud ✓','success');
    } else if(Array.isArray(json)){
      saveSales(json); renderCurrentTab(); checkAllStoresSubmitted();
      showToast(lang==='zh'?'数据已从云端更新 ✓':'Synced from Cloud ✓','success');
    } else {
      console.error('Unexpected response:', json);
      showToast('Sync error: unexpected response','error');
    }
  } catch(e){
    console.error('Sync error:', e);
    showToast(lang==='zh'?'同步失败 — 请检查脚本部署设置':'Sync failed — check GAS deployment settings','error');
  }
  if(btn) btn.textContent='🔄';
}

async function fetchLiveUsers() {
  if(!WEB_APP_URL||WEB_APP_URL.includes("PASTE_YOUR")) return null;
  try {
    const users = await gasGet('getUsers');
    if(users&&typeof users==='object'&&!Array.isArray(users)&&Object.keys(users).length>0){
      cachedUsers=users; saveData('cached_users',users);
    }
    return cachedUsers;
  } catch(e){
    console.warn('fetchLiveUsers:', e.message);
    const cached = loadData('cached_users',{});
    if(Object.keys(cached).length>0) cachedUsers=cached;
    return cachedUsers;
  }
}

async function fetchLog() {
  try {
    const json = await gasGet('getLog');
    if(json&&json.log&&Array.isArray(json.log)){ cachedLog=json.log; return cachedLog; }
  } catch(e){ console.error('fetchLog error:', e); }
  return [];
}

// ============================================================
// LOGIN — robust: tries live fetch, falls back to cache, shows clear errors
// ============================================================
async function doLogin() {
  const username = document.getElementById('login-name').value.trim().toLowerCase();
  const pin      = document.getElementById('login-pin').value.trim();
  if(!username) { showToast(lang==='zh'?'请输入用户名':'Enter your username','error'); return; }
  if(!pin)      { showToast(lang==='zh'?'请输入密码':'Enter your PIN','error'); return; }
  if(pin.length!==4) { showToast(lang==='zh'?'密码必须是4位数字':'PIN must be 4 digits','error'); return; }

  const loginBtn = document.getElementById('login-btn');
  if(loginBtn) { loginBtn.disabled=true; loginBtn.textContent = lang==='zh'?'验证中...':'Verifying...'; }
  showToast(lang==='zh'?'正在连接服务器...':'Connecting to server...','pending');

  // ── Step 1: Try fetching live users ─────────────────────────
  let fetchedFresh = false;
  try {
    const liveUsers = await gasGet('getUsers');
    if(liveUsers && typeof liveUsers==='object' && !Array.isArray(liveUsers) && Object.keys(liveUsers).length>0) {
      cachedUsers = liveUsers;
      saveData('cached_users', liveUsers);
      fetchedFresh = true;
    }
  } catch(e) {
    console.warn('Live user fetch failed, trying cache:', e.message);
  }

  // ── Step 2: Fall back to localStorage cache ──────────────────
  if(!fetchedFresh || Object.keys(cachedUsers).length===0) {
    const cached = loadData('cached_users', {});
    if(Object.keys(cached).length > 0) {
      cachedUsers = cached;
      if(!fetchedFresh) showToast(lang==='zh'?'服务器连接失败，使用本地缓存登录':'Server offline, using cached data','pending');
    } else {
      // Absolutely no data anywhere
      if(loginBtn) { loginBtn.disabled=false; loginBtn.textContent=lang==='zh'?'登录':'Login 登录'; }
      showToast(lang==='zh'?'无法连接服务器且无本地缓存，请检查网络或Apps Script部署':'Cannot reach server & no cached data. Check internet & GAS deployment.','error');
      return;
    }
  }

  // ── Step 3: Validate credentials ────────────────────────────
  const userMatch = cachedUsers[username];
  if(loginBtn) { loginBtn.disabled=false; loginBtn.textContent='Login 登录'; }

  if(!userMatch) {
    showToast(lang==='zh'?'用户名不存在':'Username not found','error'); return;
  }
  if(String(userMatch.pin).trim() !== String(pin).trim()) {
    showToast(lang==='zh'?'密码错误':'Wrong PIN','error'); return;
  }
  if(userMatch.status && userMatch.status!=='active') {
    showToast(lang==='zh'?'账号待审批，请联系管理员':'Account pending approval. Contact Admin.','error'); return;
  }

  // ── Step 4: Login success ────────────────────────────────────
  currentUser = { ...userMatch, username };
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  const isAdmin = ['admin','boss'].includes(currentUser.role);
  const isExec  = ['admin','boss','manager'].includes(currentUser.role);
  document.getElementById('nav-admin').style.display = isAdmin?'flex':'none';
  document.getElementById('nav-log').style.display   = isExec?'flex':'none';
  updateTopBar(); updateNavLabels();
  switchTab('submit', document.getElementById('nav-submit'));
  // Sync in background — don't block login
  triggerSyncRefresh();
}

  checkAndLoadExistingSales();
}

function checkAndLoadExistingSales() {
  const dateVal  = document.getElementById('submit-date')?.value;
  const storeVal = document.getElementById('submit-store')?.value;
  if(!dateVal||!storeVal) return;
  const existing=getSales().find(s=>s.dateKey===dateVal&&s.store===storeVal);
  if(existing){
    document.getElementById('s-cash').value   = existing.cash  !==undefined?existing.cash:'';
    document.getElementById('s-qr').value     = existing.qr    !==undefined?existing.qr:'';
    document.getElementById('s-card').value   = existing.card  !==undefined?existing.card:'';
    document.getElementById('s-bank').value   = existing.bank  !==undefined?existing.bank:'';
    document.getElementById('s-remark').value = existing.remark||'';
  } else {
    ['s-cash','s-qr','s-card','s-bank'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('s-remark').value='';
  }
  updateLiveTotal();
}

function updateLiveTotal() {
  const c=parseFloat(document.getElementById('s-cash').value)||0;
  const q=parseFloat(document.getElementById('s-qr').value)||0;
  const k=parseFloat(document.getElementById('s-card').value)||0;
  const b=parseFloat(document.getElementById('s-bank').value)||0;
  document.getElementById('live-total').textContent='RM '+(c+q+k+b).toFixed(2);
}

function openConfirm() {
  const store     =document.getElementById('submit-store').value;
  const targetDate=document.getElementById('submit-date').value;
  if(!store||!targetDate){showToast(lang==='zh'?'请选择门店和日期':'Select store and date','error');return;}

  // ── HARD BLOCK: Staff & Supervisors cannot submit any date other than today ──
  const isRestricted=['staff','supervisor'].includes(currentUser.role);
  const todayStr=new Date().toISOString().slice(0,10);
  if(isRestricted&&targetDate!==todayStr){
    showToast(t('onlyTodayAllowed'),'error'); return;
  }

  const cash  =parseFloat(document.getElementById('s-cash').value)||0;
  const qr    =parseFloat(document.getElementById('s-qr').value)||0;
  const card  =parseFloat(document.getElementById('s-card').value)||0;
  const bank  =parseFloat(document.getElementById('s-bank').value)||0;
  const total =cash+qr+card+bank;
  const remark=document.getElementById('s-remark').value;

  // Check if this is a new submission or an edit
  const existingRecord=getSales().find(item=>item.dateKey===targetDate&&item.store===store);
  const isEdit=!!existingRecord;

  document.getElementById('modal-title').innerHTML=t('confirmTitle')+
    (isEdit?` <span class="log-action-edit">${t('editEntry')}</span>`:`<span class="log-action-new" style="margin-left:8px;">${t('newEntry')}</span>`);

  let editWarning='';
  if(isEdit){
    editWarning=`
      <div style="background:#fff3cd;border:1.5px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#78350f;font-weight:600;">
        ✏️ ${lang==='zh'?'您正在修改已提交的数据，此操作将被记录在审计日志中。':'You are editing an existing submission. This change will be recorded in the audit log.'}
      </div>`;
  }

  document.getElementById('modal-body').innerHTML=`
    ${editWarning}
    <div class="stat-row"><span class="stat-label">🏪 Store</span><span class="stat-value">${store}</span></div>
    <div class="stat-row"><span class="stat-label">📅 Date</span><span class="stat-value">${targetDate}</span></div>
    <div class="stat-row"><span class="stat-label">💵 ${t('cash')}</span><span class="stat-value">RM ${cash.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-label">📱 ${t('qr')}</span><span class="stat-value">RM ${qr.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-label">💳 ${t('card')}</span><span class="stat-value">RM ${card.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-label">🏦 ${t('bank')}</span><span class="stat-value">RM ${bank.toFixed(2)}</span></div>
    <div class="stat-row"><span class="stat-label">🧾 ${t('totalSales')}</span><span class="stat-value big">RM ${total.toFixed(2)}</span></div>
    ${remark?`<div class="stat-row"><span class="stat-label">📝</span><span class="stat-value" style="font-size:14px">${remark}</span></div>`:''}
  `;
  window._pendingSubmit={store,targetDate,cash,qr,card,bank,total,remark};
  document.getElementById('confirm-modal').classList.add('open');
}

function closeModal(){document.getElementById('confirm-modal').classList.remove('open');}

function confirmSubmit() {
  const s=window._pendingSubmit;
  const now=new Date();
  const existingRecord=getSales().find(item=>item.dateKey===s.targetDate&&item.store===s.store);
  const submissionType=existingRecord?'update':'daily_sales';
  const changeLog={
    before:existingRecord?{cash:existingRecord.cash,qr:existingRecord.qr,card:existingRecord.card,bank:existingRecord.bank,total:existingRecord.total}:null,
    after:{cash:s.cash,qr:s.qr,card:s.card,bank:s.bank,total:s.total}
  };
  const record={
    id:Date.now(),store:s.store,cash:s.cash,qr:s.qr,card:s.card,bank:s.bank,
    total:s.total,remark:s.remark,submitter:currentUser.name,
    role:currentUser.role,datetime:now.toISOString(),
    dateKey:s.targetDate,month:s.targetDate.slice(0,7),
    submissionType,changeLog:JSON.stringify(changeLog)
  };
  showToast(lang==='zh'?'正在同步至云端...':'Uploading to Cloud...','pending');
  fetch(WEB_APP_URL,{
    method:'POST',mode:'no-cors',cache:'no-cache',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'submitSales',...record})
  }).then(()=>{
    let sales=getSales().filter(item=>!(item.dateKey===s.targetDate&&item.store===s.store));
    sales.push(record);
    saveSales(sales);
    closeModal();
    showToast(t('submitted'),'success');
    renderSubmitTab();
    checkAllStoresSubmitted();
    // Also refresh records/summary if currently viewing them
    if(currentTab==='records') renderRecordsTab();
    if(currentTab==='summary') renderSummaryTab();
  }).catch(err=>{showToast('Error: '+err,'error');});
}

function renderSummaryTab() {
  const isExec=['boss','admin','manager'].includes(currentUser.role);
  if(!isExec){
    document.getElementById('tab-summary').innerHTML=`
      <div class="card" style="text-align:center;padding:40px 20px">
        <div style="font-size:52px;">🔒</div>
        <h3 style="margin:12px 0 8px">${t('accessDenied')}</h3>
        <p style="color:var(--text2)">${t('accessMsg')}</p>
      </div>`; return;
  }
  const sales = getSales();
  const todayKey = new Date().toISOString().slice(0,10);
  let yest=new Date(); yest.setDate(yest.getDate()-1);
  const yestKey = yest.toISOString().slice(0,10);
  let allowedStores = STORES.filter(s=>s!=='HQ');
  if(currentUser.role==='admin') allowedStores = STORES;

  // ── Determine which sales to show in the store ranking ──────
  let rankingSales;
  const vm = summaryViewMode;
  if(vm==='month')        rankingSales = sales.filter(s=>s.month===selectedMonthValue);
  else if(vm==='today')   rankingSales = sales.filter(s=>s.dateKey===todayKey);
  else if(vm==='yesterday') rankingSales = sales.filter(s=>s.dateKey===yestKey);
  else if(vm==='custom_date') rankingSales = sales.filter(s=>s.dateKey===summaryCustDate);
  else rankingSales = sales.filter(s=>s.month===selectedMonthValue);

  // Apply store filter
  let filteredForTotal = summaryStoreFilter==='all'
    ? rankingSales
    : rankingSales.filter(s=>s.store===summaryStoreFilter);

  const rangeTotal = filteredForTotal.reduce((a,s)=>a+parseFloat(s.total||0),0);
  const monthTotal = sales.filter(s=>s.month===selectedMonthValue)
                         .reduce((a,s)=>a+parseFloat(s.total||0),0);

  // ── Build store map for ranking bars ────────────────────────
  const storeMap={};
  allowedStores.forEach(s=>storeMap[s]=0);
  rankingSales.forEach(s=>{if(storeMap[s.store]!==undefined) storeMap[s.store]+= parseFloat(s.total||0);});
  const maxStore=Math.max(...Object.values(storeMap),1);

  // ── 7-day trend ─────────────────────────────────────────────
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const dk=d.toISOString().slice(0,10);
    const label=d.toLocaleDateString([],{weekday:'short'}).slice(0,2);
    const daySales = summaryStoreFilter==='all'
      ? sales.filter(s=>s.dateKey===dk)
      : sales.filter(s=>s.dateKey===dk&&s.store===summaryStoreFilter);
    const val=daySales.reduce((a,s)=>a+parseFloat(s.total||0),0);
    days.push({label,val,dk});
  }
  const maxDay=Math.max(...days.map(d=>d.val),1);

  // ── View mode label ─────────────────────────────────────────
  const vmLabel = vm==='month' ? selectedMonthValue
    : vm==='today' ? todayKey
    : vm==='yesterday' ? yestKey
    : summaryCustDate;

  // ── Today submission status for each branch ─────────────────
  const todaySubmitted = new Set(sales.filter(s=>s.dateKey===todayKey).map(s=>s.store));
  const confirmedStores = new Set(sales.filter(s=>s.dateKey===todayKey&&s.submissionType==='confirmed_eod').map(s=>s.store));

  document.getElementById('tab-summary').innerHTML=`
    <div class="card-header-flex">
      <h2 style="font-size:18px;font-weight:900">${t('summaryTab')}</h2>
      <button class="btn refresh-inline" onclick="triggerSyncRefresh()">🔄 ${t('refresh')}</button>
    </div>

    <!-- FILTER CARD -->
    <div class="card" style="padding:14px;background:#eff6ff;margin-bottom:12px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <label class="field-label" style="font-size:11px;margin-bottom:4px">📅 ${lang==='zh'?'门店排行视图':'Store Ranking View'}</label>
          <select onchange="summaryViewMode=this.value;renderSummaryTab()" style="padding:8px 10px;font-size:13px">
            <option value="today"       ${vm==='today'?'selected':''}>${t('todayOpt')}</option>
            <option value="yesterday"   ${vm==='yesterday'?'selected':''}>${t('yestOpt')}</option>
            <option value="custom_date" ${vm==='custom_date'?'selected':''}>${t('customOpt')}</option>
            <option value="month"       ${vm==='month'?'selected':''}>${lang==='zh'?'月度':'Monthly'}</option>
          </select>
          ${vm==='custom_date'?`<input type="date" value="${summaryCustDate}" onchange="summaryCustDate=this.value;renderSummaryTab()" style="padding:6px;font-size:12px;margin-top:6px">`:''}
          ${vm==='month'?`<input type="month" value="${selectedMonthValue}" onchange="selectedMonthValue=this.value;renderSummaryTab()" style="padding:6px;font-size:12px;margin-top:6px">`:''}
        </div>
        <div>
          <label class="field-label" style="font-size:11px;margin-bottom:4px">🏪 ${lang==='zh'?'门店筛选':'Filter Store'}</label>
          <select onchange="summaryStoreFilter=this.value;renderSummaryTab()" style="padding:8px 10px;font-size:13px">
            <option value="all" ${summaryStoreFilter==='all'?'selected':''}>${t('allStores')}</option>
            ${allowedStores.map(s=>`<option value="${s}" ${summaryStoreFilter===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>

    <!-- TOTAL CARDS -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div class="card" style="margin:0;text-align:center;padding:14px">
        <div style="font-size:10px;font-weight:800;color:var(--text2);margin-bottom:4px">📊 ${vmLabel}</div>
        <div style="font-size:18px;font-weight:900;color:var(--primary)">RM ${rangeTotal.toFixed(2)}</div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">${summaryStoreFilter==='all'?t('allStores'):summaryStoreFilter}</div>
      </div>
      <div class="card" style="margin:0;text-align:center;padding:14px">
        <div style="font-size:10px;font-weight:800;color:var(--text2);margin-bottom:4px">🗓️ ${selectedMonthValue} ${lang==='zh'?'月度':'Month'}</div>
        <div style="font-size:18px;font-weight:900;color:var(--success)">RM ${monthTotal.toFixed(2)}</div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">${t('allStores')}</div>
      </div>
    </div>

    <!-- TODAY SUBMISSION STATUS -->
    <div class="card" style="padding:14px;margin-bottom:14px">
      <div class="card-title" style="margin-bottom:10px">📋 ${lang==='zh'?'今日提交状态':'Today's Submission Status'} (${todayKey})</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${BRANCHES.map(b=>{
          const submitted = todaySubmitted.has(b);
          const confirmed = confirmedStores.has(b);
          const bg = confirmed?'#d1fae5':submitted?'#eff6ff':'#fee2e2';
          const color = confirmed?'#065f46':submitted?'#1d4ed8':'#b91c1c';
          const icon = confirmed?'✅':submitted?'🔄':'⏳';
          return `<div style="background:${bg};color:${color};border-radius:10px;padding:5px 10px;font-size:11px;font-weight:800">${icon} ${b.replace(' Sabindo','').replace(' Eastern','')}</div>`;
        }).join('')}
      </div>
    </div>

    <!-- 7-DAY TREND -->
    <div class="card">
      <div class="card-title">📈 ${t('daily')}${summaryStoreFilter!=='all'?' — '+summaryStoreFilter:''}</div>
      <div class="bar-chart">
        ${days.map(d=>`<div class="bar-col">
          <div style="font-size:9px;color:var(--primary);font-weight:800;margin-bottom:2px">${d.val>0?'RM'+(d.val>=1000?(d.val/1000).toFixed(1)+'k':d.val.toFixed(0)):''}</div>
          <div class="bar-fill" style="height:${Math.max(4,(d.val/maxDay)*70)}px;background:${d.dk===todayKey?'linear-gradient(180deg,#10b981,#059669)':'linear-gradient(180deg,#3b82f6,#1d4ed8)'}"></div>
          <div class="bar-label">${d.label}</div>

    </div>

    <div class="card">
      <div class="card-header-flex" style="margin-bottom:10px">
        <div>
          <div class="card-title" style="margin:0">🏪 ${t('byStore')}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">${vmLabel}</div>
        </div>
        <button class="btn warn" onclick="sendReminder()" style="width:auto;padding:6px 12px;font-size:12px;margin:0;border-radius:10px">${t('remindBtn')}</button>
      </div>
      ${allowedStores.filter(s=>s!=='HQ').sort((a,b)=>(storeMap[b]||0)-(storeMap[a]||0)).map((s,i)=>`
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:4px">

            </span>

          </div>

        </div>`).join('')}
    </div>`;

async function refreshLog() {

  if(loadEl) loadEl.style.display='flex';

  await fetchLog();

  if(loadEl) loadEl.style.display='none';

  let allowedStores=STORES; if(currentUser.role!=='admin') allowedStores=STORES.filter(s=>s!=='HQ');

  // Filter
  let filtered=cachedLog.filter(r=>r.store&&r.store!=='Testing');
  if(logStoreFilter!=='all') filtered=filtered.filter(r=>r.store===logStoreFilter);
  if(logActionFilter!=='all') filtered=filtered.filter(r=>{
    const a=String(r.action||'').toUpperCase();
    if(logActionFilter==='new')  return a.includes('NEW');
    if(logActionFilter==='edit') return a.includes('EDIT');
    return true;
  });
  // Sort newest first
  filtered=filtered.slice().sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp)));

  const filterHtml=`
    <div class="control-grid" style="margin-bottom:10px">
      <div>
        <label class="field-label" style="font-size:11px">🏪 ${lang==='zh'?'门店':'Store'}</label>
        <select onchange="logStoreFilter=this.value;renderLogEntries()">
          <option value="all">${t('allStores')}</option>
          ${allowedStores.filter(s=>s!=='HQ').map(s=>`<option value="${s}" ${logStoreFilter===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="field-label" style="font-size:11px">📋 ${lang==='zh'?'操作类型':'Action Type'}</label>
        <select onchange="logActionFilter=this.value;renderLogEntries()">
          <option value="all">${lang==='zh'?'全部':'All'}</option>
          <option value="new"  ${logActionFilter==='new'?'selected':''}>${t('newEntry')}</option>
          <option value="edit" ${logActionFilter==='edit'?'selected':''}>${t('editEntry')}</option>
        </select>
      </div>
    </div>`;

  // Save filtered for renderLogEntries
  window._logFiltered=filtered;

  contentEl.innerHTML=filterHtml+`<div id="log-list"></div>`;
  renderLogEntries();
}

function renderLogEntries() {
  let log=cachedLog.filter(r=>r.store&&r.store!=='Testing');
  if(logStoreFilter!=='all') log=log.filter(r=>r.store===logStoreFilter);
  if(logActionFilter!=='all') log=log.filter(r=>{
    const a=String(r.action||'').toUpperCase();
    if(logActionFilter==='new')  return a.includes('NEW');
    if(logActionFilter==='edit') return a.includes('EDIT');
    return true;
  });
  log=log.slice().sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp)));

  const listEl=document.getElementById('log-list');
  if(!listEl) return;

  if(log.length===0){
    listEl.innerHTML=`<div class="card"><div class="empty-state"><div class="e-icon">📭</div><p>${t('noLog')}</p></div></div>`;
    return;
  }

  const isEdit=a=>String(a||'').toUpperCase().includes('EDIT');

  const entries=log.map(r=>{
    const edit=isEdit(r.action);
    const actionBadge=edit
      ?`<span class="log-action-edit">✏️ ${t('editEntry')}</span>`
      :`<span class="log-action-new">✅ ${t('newEntry')}</span>`;

    const ts=r.timestamp?new Date(r.timestamp).toLocaleString([],{dateStyle:'short',timeStyle:'short'}):r.dateKey||'';

    // Build diff display for edits
    let diffHtml='';
    if(edit){
      const fields=[
        {lbl:'💵 Cash',  before:r.before_cash, after:r.after_cash},
        {lbl:'📱 QR',    before:r.before_qr,   after:r.after_qr},
        {lbl:'💳 Card',  before:r.before_card, after:r.after_card},
        {lbl:'🏦 Bank',  before:r.before_bank, after:r.after_bank},
        {lbl:'🧾 Total', before:r.before_total,after:r.after_total},
      ];
      const changed=fields.filter(f=>String(f.before)!==String(f.after)&&f.before!==''&&f.before!==undefined);
      if(changed.length>0){
        diffHtml=`<div class="log-diff">
          ${changed.map(f=>`
            <span style="color:var(--text2)">${f.lbl}:</span>
            <span class="diff-changed">RM ${parseFloat(f.before||0).toFixed(2)}</span>
            <span class="diff-arrow">→</span>
            <span class="diff-new">RM ${parseFloat(f.after||0).toFixed(2)}</span>
            &nbsp;&nbsp;
          `).join('')}
        </div>`;
      }
    } else {
      // New submission — just show totals
      diffHtml=`<div class="log-diff">
        💵 RM${parseFloat(r.after_cash||0).toFixed(2)} &nbsp;
        📱 RM${parseFloat(r.after_qr||0).toFixed(2)} &nbsp;
        💳 RM${parseFloat(r.after_card||0).toFixed(2)} &nbsp;
        🏦 RM${parseFloat(r.after_bank||0).toFixed(2)} &nbsp;
        <strong style="color:var(--primary)">= RM${parseFloat(r.after_total||0).toFixed(2)}</strong>
      </div>`;
    }

    return `
      <div class="log-item">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <span style="font-size:13px;font-weight:800">${r.store||''}</span>
            &nbsp;${actionBadge}
          </div>
          <span style="font-size:11px;color:var(--text2);white-space:nowrap">${ts}</span>
        </div>
        <div style="font-size:12px;color:var(--text2);margin-top:3px">
          📅 ${r.dateKey||''} &nbsp;·&nbsp; 👤 ${r.submitter||''} <span class="role-tag ${r.role||'staff'}" style="margin-left:2px">${t(r.role||'staff')}</span>
        </div>
        ${diffHtml}
        ${r.remark?`<div style="font-size:12px;color:var(--accent);margin-top:3px">📝 ${r.remark}</div>`:''}
      </div>`;
  }).join('');

  listEl.innerHTML=`<div class="card" style="padding:14px">${entries}</div>`;
}

async function changeCurrentUserPin() {
  const currentPin=document.getElementById('profile-curr-pin').value.trim();
  const newPin=document.getElementById('profile-new-pin').value.trim();
  const confirmPin=document.getElementById('profile-conf-pin').value.trim();
  if(!currentPin||!newPin||!confirmPin){showToast(lang==='zh'?'请填写完整！':'Fill all fields!','error');return;}
  if(String(currentPin)!==String(currentUser.pin)){showToast(lang==='zh'?'当前密码错误！':'Incorrect current PIN!','error');return;}
  if(newPin.length!==4||isNaN(newPin)){showToast(lang==='zh'?'新密码必须是4位数字！':'New PIN must be 4 digits!','error');return;}
  if(newPin!==confirmPin){showToast(lang==='zh'?'新密码不一致！':'New PINs do not match!','error');return;}
  showToast(lang==='zh'?'正在保存...':'Saving...','pending');
  const userPayload={action:'saveUser',originalKey:currentUser.username,username:currentUser.username,name:currentUser.name,phone:currentUser.phone||'',pin:newPin,role:currentUser.role,store:currentUser.store,status:'active'};
  try {
    await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(userPayload)});
    currentUser.pin=newPin;
    if(cachedUsers[currentUser.username]){cachedUsers[currentUser.username].pin=newPin;saveData('cached_users',cachedUsers);}

    document.getElementById('profile-curr-pin').value='';
    document.getElementById('profile-new-pin').value='';
    document.getElementById('profile-conf-pin').value='';
  } catch(e){showToast('Failed: '+e,'error');}
}

      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn secondary" style="flex:1" onclick="document.getElementById('eod-modal').remove()">Cancel 取消</button>
        <button class="btn success"   style="flex:1" onclick="confirmEOD('${store}','${targetDate}',${cash},${qr},${card},${bank},${total},'${remark.replace(/'/g,"\\'")}')">✅ ${lang==='zh'?'确认提交':'Confirm EOD'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function confirmEOD(store,targetDate,cash,qr,card,bank,total,remark) {
  document.getElementById('eod-modal')?.remove();
  const now=new Date();
  const existingRecord=getSales().find(item=>item.dateKey===targetDate&&item.store===store);
  const changeLog={
    before:existingRecord?{cash:existingRecord.cash,qr:existingRecord.qr,card:existingRecord.card,bank:existingRecord.bank,total:existingRecord.total}:null,
    after:{cash,qr,card,bank,total}
  };
  const record={
    id:Date.now(),store,cash,qr,card,bank,total,remark,
    submitter:currentUser.name,role:currentUser.role,
    datetime:now.toISOString(),dateKey:targetDate,
    month:targetDate.slice(0,7),
    submissionType:'confirmed_eod',
    changeLog:JSON.stringify(changeLog)
  };
  showToast(lang==='zh'?'正在提交日终数据...':'Submitting EOD data...','pending');
  fetch(WEB_APP_URL,{
    method:'POST',mode:'no-cors',cache:'no-cache',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'submitSales',...record})
  }).then(()=>{
    let sales=getSales().filter(item=>!(item.dateKey===targetDate&&item.store===store));
    sales.push(record);
    saveSales(sales);
    showToast(lang==='zh'?'日终销售已确认 ✅':'EOD Sales Confirmed ✅','success');
    renderSubmitTab();
    checkAllStoresSubmitted();
  }).catch(err=>{showToast('Error: '+err,'error');});
}

// ============================================================
// SETTLEMENT UPLOAD — photo to Google Drive via Apps Script
// ============================================================
function openSettlementUpload() {
  const store     = document.getElementById('submit-store')?.value;
  const targetDate= document.getElementById('submit-date')?.value;
  if(!store||!store.trim()){showToast(lang==='zh'?'请先选择门店':'Select a store first','error');return;}
  const overlay=document.createElement('div');
  overlay.className='modal-overlay open'; overlay.id='settlement-modal';
  overlay.innerHTML=`
    <div class="modal-box">
      <div class="modal-title">📎 ${lang==='zh'?'上传日结单':'Upload Daily Settlement'}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:16px">
        🏪 <b>${store}</b> &nbsp;·&nbsp; 📅 ${targetDate}<br>
        ${lang==='zh'?'请拍摄或选择日结凭证图片（JPG/PNG）':'Take or select a settlement photo (JPG/PNG)'}
      </div>
      <div id="upload-preview" style="display:none;margin-bottom:14px;text-align:center">
        <img id="preview-img" style="max-width:100%;max-height:200px;border-radius:10px;border:2px solid var(--border)">
        <div id="preview-name" style="font-size:12px;color:var(--text2);margin-top:6px"></div>
      </div>
      <label style="display:block;background:#eff6ff;border:2px dashed var(--primary);border-radius:14px;padding:24px;text-align:center;cursor:pointer;margin-bottom:14px">
        <input type="file" id="settlement-file" accept="image/*" capture="environment" style="display:none" onchange="previewSettlement(this)">
        <div style="font-size:36px;margin-bottom:8px">📷</div>
        <div style="font-weight:800;color:var(--primary)">${lang==='zh'?'点击拍摄 / 选择图片':'Tap to take photo or choose image'}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:4px">JPG, PNG</div>
      </label>
      <div class="input-wrap">
        <label class="field-label">${lang==='zh'?'备注（选填）':'Note (optional)'}</label>
        <input type="text" id="settlement-note" placeholder="${lang==='zh'?'如：收银机小票、银行对账单...':'e.g. POS receipt, bank slip...'}">
      </div>
      <div id="upload-progress" style="display:none;margin-bottom:10px">
        <div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:6px" id="upload-progress-label">${lang==='zh'?'正在上传...':'Uploading...'}</div>
        <div style="background:var(--border);border-radius:8px;height:8px;overflow:hidden">
          <div id="upload-progress-bar" style="height:100%;background:linear-gradient(90deg,var(--primary),#60a5fa);border-radius:8px;width:0%;transition:width 0.3s"></div>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn secondary" style="flex:1" onclick="document.getElementById('settlement-modal').remove()">Cancel 取消</button>
        <button class="btn success" style="flex:1" id="upload-btn" onclick="uploadSettlement('${store}','${targetDate}')">
          📤 ${lang==='zh'?'上传':'Upload'}
        </button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function previewSettlement(input) {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('preview-img').src=e.target.result;
    document.getElementById('preview-name').textContent=file.name+' ('+Math.round(file.size/1024)+'KB)';
    document.getElementById('upload-preview').style.display='block';
  };
  reader.readAsDataURL(file);
}

async function uploadSettlement(store, dateKey) {
  const fileInput=document.getElementById('settlement-file');
  const note=document.getElementById('settlement-note')?.value||'';
  if(!fileInput||!fileInput.files||!fileInput.files[0]){
    showToast(lang==='zh'?'请先选择图片':'Please select an image first','error'); return;
  }
  const file=fileInput.files[0];
  const btn=document.getElementById('upload-btn');
  const progressWrap=document.getElementById('upload-progress');
  const progressBar=document.getElementById('upload-progress-bar');
  const progressLabel=document.getElementById('upload-progress-label');
  if(btn) btn.disabled=true;
  if(progressWrap) progressWrap.style.display='block';

  // Animate progress
  let pct=0;
  const ticker=setInterval(()=>{
    pct=Math.min(pct+8,85);
    if(progressBar) progressBar.style.width=pct+'%';
  },200);

  try {
    // Convert to base64
    const b64=await new Promise((res,rej)=>{
      const reader=new FileReader();
      reader.onload=e=>res(e.target.result.split(',')[1]);
      reader.onerror=rej;
      reader.readAsDataURL(file);
    });

    const payload={
      action:'uploadSettlement',
      store, dateKey,
      submitter:currentUser.name,
      role:currentUser.role,
      note,
      fileName:file.name,
      mimeType:file.type,
      fileData:b64
    };

    await fetch(WEB_APP_URL,{
      method:'POST',mode:'no-cors',cache:'no-cache',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    clearInterval(ticker);
    if(progressBar) progressBar.style.width='100%';
    if(progressLabel) progressLabel.textContent=lang==='zh'?'上传成功！':'Upload successful!';
    setTimeout(()=>{
      document.getElementById('settlement-modal')?.remove();
      showToast(lang==='zh'?'日结单已上传至Google Drive ✅':'Settlement uploaded to Google Drive ✅','success');
    },800);
  } catch(e) {
    clearInterval(ticker);
    if(btn) btn.disabled=false;
    if(progressWrap) progressWrap.style.display='none';
    showToast('Upload failed: '+e,'error');
  }
}

window.addEventListener('DOMContentLoaded',fetchLiveUsers);
</script>
