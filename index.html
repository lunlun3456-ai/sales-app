<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Sales Reporter 日销报告</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  :root {
    --bg: #f0f4ff; --card: #ffffff; --primary: #2563eb; --primary-dark: #1d4ed8;
    --accent: #f59e0b; --success: #10b981; --danger: #ef4444; --text: #1e293b;
    --text2: #64748b; --border: #e2e8f0; --shadow: 0 4px 24px rgba(37,99,235,0.10); --radius: 18px; --font: 'Nunito', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 17px; overflow-x: hidden; }
  .screen { display: none; min-height: 100vh; flex-direction: column; animation: fadeIn .25s; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .topbar { background: var(--primary); color: #fff; padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 99; box-shadow: 0 2px 12px rgba(37,99,235,0.18); }
  .topbar h1 { font-size: 19px; font-weight: 800; letter-spacing: .3px; }
  .topbar .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
  .lang-btn { background: rgba(255,255,255,0.18); border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
  #login-screen { align-items: center; justify-content: center; background: linear-gradient(145deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%); padding: 30px 24px; min-height: 100vh; }
  .login-box { background: #fff; border-radius: 28px; padding: 36px 28px 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
  .login-logo { text-align: center; margin-bottom: 22px; }
  .login-logo .icon { font-size: 54px; }
  .login-logo h2 { font-size: 24px; font-weight: 900; color: var(--primary); margin-top: 6px; }
  .login-logo p { font-size: 12px; color: var(--text2); margin-top: 3px; font-weight: 600; }
  .field-label { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; display: block; }
  .input-wrap { margin-bottom: 16px; }
  select, input[type=text], input[type=password], input[type=number], input[type=date], input[type=month] { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; transition: border .2s; }
  select:focus, input:focus { border-color: var(--primary); }
  .btn { display: block; width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 800; cursor: pointer; text-align: center; margin-top: 6px; }
  .btn:active { background: var(--primary-dark); transform: scale(.98); }
  .btn.secondary { background: var(--bg); color: var(--primary); border: 2px solid var(--border); }
  .btn.danger { background: var(--danger); }
  .btn.success { background: var(--success); }
  .btn.refresh-btn { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 20px; margin-top: 0; background: var(--primary); display: flex; align-items: center; gap: 4px; }
  .content { padding: 18px 16px 100px; flex: 1; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1.5px solid var(--border); box-shadow: 0 -2px 16px rgba(0,0,0,0.07); z-index: 98; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; cursor: pointer; border: none; background: none; font-family: var(--font); color: var(--text2); font-size: 11px; font-weight: 700; }
  .nav-item.active { color: var(--primary); }
  .nav-item .nav-icon { font-size: 22px; margin-bottom: 2px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-title { font-size: 15px; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .amount-input-wrap { position: relative; margin-bottom: 6px; }
  .amount-prefix { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 800; color: var(--primary); }
  input.amount-input { padding-left: 54px; font-size: 26px; font-weight: 900; height: 64px; background: #eff6ff; border-color: var(--primary); }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { font-size: 15px; color: var(--text2); font-weight: 600; }
  .stat-value { font-size: 17px; font-weight: 900; color: var(--text); }
  .stat-value.big { font-size: 26px; color: var(--primary); }
  .stat-value.green { color: var(--success); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; background: #eff6ff; color: var(--primary); margin-left: 6px; }
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-chip { white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; border: 2px solid var(--border); background: #fff; color: var(--text2); cursor: pointer; flex-shrink: 0; }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .record-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .record-item:last-child { border-bottom: none; }
  .record-icon { font-size: 26px; flex-shrink: 0; margin-top: 2px; }
  .record-info { flex: 1; }
  .record-store { font-size: 14px; font-weight: 800; color: var(--text); }
  .record-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .record-amount { font-size: 18px; font-weight: 900; color: var(--primary); }
  .record-sub { font-size: 11px; color: var(--text2); text-align: right; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; opacity: 0; transition: all .3s; z-index: 999; white-space: nowrap; max-width: 85vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success-toast { background: var(--success); }
  #toast.error-toast { background: var(--danger); }
  #toast.pending-toast { background: var(--accent); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 24px 24px 0 0; padding: 28px 24px 40px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; animation: slideUp .25s; }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 18px; }
  .progress-bar-wrap { background: var(--border); border-radius: 8px; height: 10px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #60a5fa); border-radius: 8px; transition: width .5s; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 100px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .bar-fill { width: 100%; background: linear-gradient(180deg, #3b82f6, #1d4ed8); border-radius: 6px 6px 0 0; min-height: 4px; transition: height .5s; }
  .bar-label { font-size: 10px; color: var(--text2); margin-top: 4px; font-weight: 700; }
  .welcome-banner { background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%); border-radius: var(--radius); padding: 20px; color: #fff; margin-bottom: 14px; position: relative; overflow: hidden; }
  .welcome-banner h2 { font-size: 20px; font-weight: 900; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; }
  .role-tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-left: 6px; }
  .role-tag.boss { background: #fde8e8; color: #b91c1c; }
  .role-tag.admin { background: #fee2e2; color: #991b1b; }
  .role-tag.manager { background: #dbeafe; color: #1d4ed8; }
  .role-tag.supervisor { background: #d1fae5; color: #065f46; }
  .role-tag.staff { background: #f3e8ff; color: #6d28d9; }
  .role-tag.test { background: #e2e8f0; color: #475569; border: 1px dashed #94a3b8; } /* 🧪 Test Tag style */
  .tip-box { background: #fffbeb; border: 1.5px solid #fcd34d; border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #78350f; margin-top: 10px; font-weight: 600; }
  .tip-box .tip-title { font-weight: 800; margin-bottom: 3px; }
  @media (min-width: 500px) { body { max-width: 480px; margin: 0 auto; } }
</style>
</head>
<body>

<div id="toast"></div>

<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🏪</div>
      <h2>Sales Reporter</h2>
      <p>Cloud Synchronized Login</p>
    </div>
    <div class="input-wrap">
      <label class="field-label" id="lbl-name">Username / Staff ID (Lower Case)</label>
      <input type="text" id="login-name" placeholder="e.g. tester01, bonia_ali" autocomplete="off">
    </div>
    <div class="input-wrap">
      <label class="field-label" id="lbl-pass">PIN (4 digits)</label>
      <input type="password" id="login-pin" maxlength="4" placeholder="••••" inputmode="numeric">
    </div>
    <button class="btn" onclick="doLogin()" id="login-btn">Login 登录</button>
  </div>
</div>

<div id="app-screen" class="screen">
  <div class="topbar">
    <div>
      <h1 id="app-title">Sales Reporter</h1>
      <div class="sub" id="app-user-info"></div>
    </div>
    <button class="lang-btn" onclick="toggleLang()">中/EN</button>
  </div>

  <div class="content" id="tab-submit" style="display:block"></div>
  <div class="content" id="tab-records" style="display:none"></div>
  <div class="content" id="tab-summary" style="display:none"></div>
  <div class="content" id="tab-profile" style="display:none"></div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('submit',this)" id="nav-submit">
      <span class="nav-icon">📤</span><span id="nav-submit-lbl">Submit</span>
    </button>
    <button class="nav-item" onclick="switchTab('records',this)" id="nav-records">
      <span class="nav-icon">📋</span><span id="nav-records-lbl">Records</span>
    </button>
    <button class="nav-item" onclick="switchTab('summary',this)" id="nav-summary">
      <span class="nav-icon">📊</span><span id="nav-summary-lbl">Summary</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile',this)" id="nav-profile">
      <span class="nav-icon">👤</span><span id="nav-profile-lbl">Me</span>
    </button>
  </nav>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Confirm Submission</div>
    <div id="modal-body"></div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn secondary" style="flex:1" onclick="closeModal()">Cancel 取消</button>
      <button class="btn success" style="flex:1" onclick="confirmSubmit()">Submit ✓</button>
    </div>
  </div>
</div>

<script>
let lang = 'en';
let currentUser = null;
let currentTab = 'submit';
let cachedUsers = {}; 

let selectedDateRange = 'today';
let customDateValue = new Date().toISOString().slice(0,10);
let selectedMonthValue = new Date().toISOString().slice(0,7);
let activeRecordStoreFilter = 'all';
let staffViewMode = 'daily';

// ⚠️ PASTE YOUR NEW DEPLOYED APPS SCRIPT URL HERE:
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw6k6RqimoeKuTRnYjKKPGIOCyAWitXYbXyGnBpfSxfknmdC6nzxFAbfbNx3BGYuAw1/exec";

// ❌ "Testing" has been deleted from this array list below:
const STORES = ['HQ','Bonia Sabindo','Bonia Eastern','Polo Sabindo','Polo Eastern','Gm Sabindo','Gm Eastern'];

function saveData(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
function loadData(key, def) { try { const v=localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function getSales() { return loadData('sales_records', []); }
function saveSales(arr) { saveData('sales_records', arr); }

const T = {
  en: {
    store:'Store', role:'Role', pin:'PIN', refresh:'Refresh', appTitle:'Sales Reporter', submit:'Submit', records:'Records', summary:'Summary', me:'Me',
    submitCard:'Enter Today\'s Sales', cash:'Cash Sales 现金销额', qr:'QR Sales 扫码销额', card:'Credit Card 刷卡销额', totalSales:'Total Sales 总计额', submitBtn:'Submit Report 提交报表', remark:'Remark 备注', 
    recordsTab:'Sales Records', noRecords:'No records match this date filter', summaryTab:'Sales Summary', accessDenied:'Access Restricted', accessMsg: 'Only Boss, Admin & Manager can view metrics.',
    todayTotal:'Range Total 选定内总计', monthTotal:'Selected Month Total 选定月度总计', byStore:'Sales by Store', daily:'Daily Trend (Last 7 Days)',
    profileTab:'My Profile', logout:'Logout 退出', advice:'💡 Tips & Advice', tip1:'Submit sales every day before closing time.', tip2:'Double-check amounts before submitting.',
    submitted:'Submitted successfully to Cloud Sheet! ✓', fillAll:'Please fill in sales amounts.', confirmTitle:'Confirm Submission', confirmMsg:'Are you sure you want to submit?',
    alreadySubmitted:'Today\'s sales for this branch are already registered.', allStores:'All Stores',
    staff:'Staff', supervisor:'Supervisor', manager:'Manager', boss:'Boss', admin:'Admin', test:'Test User', filterRange:'Date Selection Range', customDateLabel:'Pick Custom Date',
    selectMonthLabel:'Filter Monthly Sales', todayOpt:'Today 今天', yestOpt:'Yesterday 昨天', customOpt:'Custom Date 自选日期', staffDailyOpt:'My Daily Sales Only', staffUptodateOpt:'Everyday Up To Date Sales'
  },
  zh: {
    store:'门店', role:'职位', pin:'密码', refresh:'刷新数据', appTitle:'日销报告', submit:'提交', records:'记录', summary:'汇总', me:'我的',
    submitCard:'输入今日销售额', cash:'现金销额 (Cash)', qr:'扫码销额 (QR Pay)', card:'刷卡销额 (Card)', totalSales:'总销售额', submitBtn:'确认提交报表', remark:'备注（选填）', 
    recordsTab:'销售记录', noRecords:'在此日期筛选下暂无匹配记录', summaryTab:'销售汇总', accessDenied:'权限受限', accessMsg: '仅老板、管理员及经理可查看汇总数据。',
    todayTotal:'指定日期总销额', monthTotal:'指定月份总销额', byStore:'各门店月度排行', daily:'每日近七天趋势',
    profileTab:'我的基本资料', logout:'安全退出登录', advice:'💡 日常维护小贴士', tip1:'请在每日店铺打烊前，准确填写并提交日销。', tip2:'提交数据前，请务必仔细核对账目金额。',
    submitted:'数据已成功云同步至谷歌表格！✓', fillAll:'请务必填写销售金额。', confirmTitle:'确认核对数据', confirmMsg:'确认数据无误并提交系统吗？',
    alreadySubmitted:'该门店今日的销售额已经提交，请勿重复操作。', allStores:'所有门店',
    staff:'店员', supervisor:'主管', manager:'经理', boss:'老板', admin:'管理员', test:'测试账户', filterRange:'日期过滤范围', customDateLabel:'选择自定义日期',
    selectMonthLabel:'按指定月份筛选排行', todayOpt:'Today 今天', yestOpt:'Yesterday 昨天', customOpt:'Custom Date 自选日期', staffDailyOpt:'仅查看我今日的账单', staffUptodateOpt:'查看所有累积历史明细'
  }
};

function t(key) { return T[lang][key] || key; }
function toggleLang() { lang = lang === 'en' ? 'zh' : 'en'; renderCurrentTab(); updateTopBar(); updateNavLabels(); }
function updateTopBar() { if(currentUser) document.getElementById('app-user-info').textContent = currentUser.name + ' | ' + currentUser.store + ' | ' + t(currentUser.role); }
function updateNavLabels() {
  document.getElementById('nav-submit-lbl').textContent = t('submit'); document.getElementById('nav-records-lbl').textContent = t('records');
  document.getElementById('nav-summary-lbl').textContent = t('summary'); document.getElementById('nav-profile-lbl').textContent = t('me');
}

async function triggerSyncRefresh() {
  if(!WEB_APP_URL || WEB_APP_URL.includes("PASTE_YOUR_GOOGLE_WEB_APP_URL")) return;
  try {
    const res = await fetch(WEB_APP_URL);
    const data = await res.json();
    if (Array.isArray(data)) { saveSales(data); renderCurrentTab(); }
  } catch(e) {}
}

async function fetchLiveUsers() {
  if(!WEB_APP_URL || WEB_APP_URL.includes("PASTE_YOUR_GOOGLE_WEB_APP_URL")) return null;
  try {
    const response = await fetch(`${WEB_APP_URL}?action=getUsers`);
    const users = await response.json();
    cachedUsers = users; saveData('cached_users', users);
    return users;
  } catch (e) { cachedUsers = loadData('cached_users', {}); return cachedUsers; }
}

async function doLogin() {
  const username = document.getElementById('login-name').value.trim().toLowerCase();
  const pin = document.getElementById('login-pin').value.trim();
  if(!username || !pin) { showToast('Please enter username and PIN','error'); return; }
  
  showToast(lang==='zh'?'正在验证...':'Verifying Account...','pending');
  await fetchLiveUsers();
  
  const userMatch = cachedUsers[username];
  if(!userMatch || userMatch.pin !== pin) { showToast('Invalid Username or PIN','error'); return; }
  
  currentUser = userMatch; currentUser.username = username;
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  updateTopBar(); updateNavLabels();
  switchTab('submit', document.getElementById('nav-submit'));
  triggerSyncRefresh();
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['submit','records','summary','profile'].forEach(t=>{ document.getElementById('tab-'+t).style.display = t===tab ? 'block' : 'none'; });
  renderCurrentTab();
}

function renderCurrentTab() {
  if(currentTab==='submit')  renderSubmitTab();
  if(currentTab==='records') renderRecordsTab();
  if(currentTab==='summary') renderSummaryTab();
  if(currentTab==='profile') renderProfileTab();
}

function renderSubmitTab() {
  const now = new Date();
  const dateStr = now.toLocaleDateString(lang==='zh'?'zh-CN':'en-MY', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const timeStr = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const isRestrictedWorker = ['supervisor','staff','test'].includes(currentUser.role);
  let storeOptions = isRestrictedWorker ? `<input type="text" value="${currentUser.store}" disabled style="background:#e2e8f0;color:var(--text2);font-weight:bold;">`
    : `<select id="submit-store"><option value="">-- Select Store --</option>${STORES.map(s=>`<option ${s===currentUser.store?'selected':''}>${s}</option>`).join('')}</select>`;

  document.getElementById('tab-submit').innerHTML = `
    <div class="welcome-banner"><h2>SALES REPORT</h2><p>📅 ${dateStr} ${timeStr}</p></div>
    <div class="card">
      <div class="card-title">${t('submitCard')}</div>
      <div class="input-wrap"><label class="field-label">${t('store')}</label>${storeOptions}</div>
      <div class="input-wrap"><label class="field-label">💵 ${t('cash')}</label><div class="amount-input-wrap"><span class="amount-prefix">RM</span><input type="number" class="amount-input" id="s-cash" placeholder="0" min="0" step="0.01" inputmode="decimal"></div></div>
      <div class="input-wrap"><label class="field-label">📱 ${t('qr')}</label><div class="amount-input-wrap"><span class="amount-prefix">RM</span><input type="number" class="amount-input" id="s-qr" placeholder="0" min="0" step="0.01" inputmode="decimal"></div></div>
      <div class="input-wrap"><label class="field-label">💳 ${t('card')}</label><div class="amount-input-wrap"><span class="amount-prefix">RM</span><input type="number" class="amount-input" id="s-card" placeholder="0" min="0" step="0.01" inputmode="decimal"></div></div>
      <div class="divider"></div>
      <div class="stat-row"><span class="stat-label">🧾 ${t('totalSales')}</span><span class="stat-value big" id="live-total">RM 0.00</span></div>
      <div class="input-wrap" style="margin-top:12px"><label class="field-label">📝 ${t('remark')}</label><input type="text" id="s-remark" placeholder="..."></div>
      <button class="btn" onclick="openConfirm()" style="margin-top:8px;font-size:19px;">${t('submitBtn')}</button>
    </div>
  `;
  ['s-cash','s-qr','s-card'].forEach(id=>{ document.getElementById(id).addEventListener('input', updateLiveTotal); });
}

function updateLiveTotal() {
  const c = parseFloat(document.getElementById('s-cash').value)||0;
  const q = parseFloat(document.getElementById('s-qr').value)||0;
  const k = parseFloat(document.getElementById('s-card').value)||0;
  document.getElementById('live-total').textContent = 'RM ' + (c+q+k).toFixed(2);
}

function openConfirm() {
  const isRestrictedWorker = ['supervisor','staff','test'].includes(currentUser.role);
  const store = isRestrictedWorker ? currentUser.store : (document.getElementById('submit-store') ? document.getElementById('submit-store').value : '');
  const cash = parseFloat(document.getElementById('s-cash').value)||0;
  const qr   = parseFloat(document.getElementById('s-qr').value)||0;
  const card = parseFloat(document.getElementById('s-card').value)||0;
  if(!store || (cash===0 && qr===0 && card===0)) { showToast(t('fillAll'),'error'); return; }

  const total = cash+qr+card;
  const now = new Date();
  const dateKey = now.toISOString().slice(0,10);
  if(getSales().find(s=>s.store===store && s.dateKey===dateKey && s.submitter===currentUser.name)) { showToast(t('alreadySubmitted'),'error'); return; }

  document.getElementById('modal-title').textContent = t('confirmTitle');
  document.getElementById('modal-body').innerHTML = `
    <div class="stat-row"><span class="stat-label">🏪 ${t('store')}</span><span class="stat-value">${store}</span></div>
    <div class="stat-row"><span class="stat-label">🧾 ${t('totalSales')}</span><span class="stat-value big">RM ${total.toFixed(2)}</span></div>
  `;
  window._pendingSubmit = { store, cash, qr, card, total, remark: document.getElementById('s-remark').value };
  document.getElementById('confirm-modal').classList.add('open');
}

function closeModal() { document.getElementById('confirm-modal').classList.remove('open'); }

function confirmSubmit() {
  const s = window._pendingSubmit; const now = new Date();
  const record = {
    id: Date.now(), store: s.store, cash: s.cash, qr: s.qr, card: s.card, total: s.total, remark: s.remark,
    submitter: currentUser.name, role: currentUser.role, datetime: now.toISOString(),
    dateKey: now.toISOString().slice(0,10), month: now.toISOString().slice(0,7),
  };
  showToast(lang === 'zh' ? '正在上传...' : 'Uploading...', 'pending');
  fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", cache: "no-cache", headers: { "Content-Type": "application/json" }, body: JSON.stringify(record) })
  .then(() => {
    const sales = getSales(); sales.push(record); saveSales(sales);
    closeModal(); showToast(t('submitted'), 'success'); renderSubmitTab();
  }).catch(err => { showToast('Sync Failed: ' + err, 'error'); });
}

function renderRecordsTab() {
  const sales = getSales();
  const isExec = ['boss','admin','manager'].includes(currentUser.role);
  const todayKey = new Date().toISOString().slice(0,10);
  let yesterdayKey = new Date(); yesterdayKey.setDate(yesterdayKey.getDate() - 1);
  yesterdayKey = yesterdayKey.toISOString().slice(0,10);

  let targetDate = todayKey;
  if(selectedDateRange === 'yesterday') targetDate = yesterdayKey;
  if(selectedDateRange === 'custom_date') targetDate = customDateValue;

  let filtered = isExec ? sales : sales.filter(s=>s.store === currentUser.store);

  if(!isExec && staffViewMode === 'daily') {
    filtered = filtered.filter(s => s.dateKey === todayKey);
  } else if(isExec || staffViewMode === 'daily') {
    filtered = filtered.filter(s => s.dateKey === targetDate);
  }
  if(isExec && activeRecordStoreFilter !== 'all') {
    filtered = filtered.filter(r => r.store === activeRecordStoreFilter);
  }

  filtered = filtered.slice().reverse();

  let filterControlsHtml = '';
  if(isExec) {
    filterControlsHtml = `
      <div class="control-grid">
        <div>
          <label class="field-label" style="font-size:11px;">${t('filterRange')}</label>
          <select id="rec-range-select" onchange="updateRecordDateRange(this.value)">
            <option value="today" ${selectedDateRange==='today'?'selected':''}>${t('todayOpt')}</option>
            <option value="yesterday" ${selectedDateRange==='yesterday'?'selected':''}>${t('yestOpt')}</option>
            <option value="custom_date" ${selectedDateRange==='custom_date'?'selected':''}>${t('customOpt')}</option>
          </select>
        </div>
        <div id="custom-date-box" style="display:${selectedDateRange==='custom_date'?'block':'none'}">
          <label class="field-label" style="font-size:11px;">${t('customDateLabel')}</label>
          <input type="date" id="rec-custom-date" value="${customDateValue}" onchange="updateCustomDateValue(this.value)">
        </div>
      </div>
      <div class="filter-scroll">
        <div class="filter-chip ${activeRecordStoreFilter==='all'?'active':''}" onclick="setRecordStoreFilter('all')">${t('allStores')}</div>
        ${STORES.map(s=>`<div class="filter-chip ${activeRecordStoreFilter===s?'active':''}" onclick="setRecordStoreFilter('${s}')">${s}</div>`).join('')}
      </div>
    `;
  } else {
    filterControlsHtml = `
      <div class="control-grid" style="grid-template-columns: 1fr;">
        <select onchange="updateStaffViewMode(this.value)">
          <option value="daily" ${staffViewMode==='daily'?'selected':''}>${t('staffDailyOpt')}</option>
          <option value="uptodate" ${staffViewMode==='uptodate'?'selected':''}>${t('staffUptodateOpt')}</option>
        </select>
      </div>
    `;
  }

  let listHtml = filtered.length === 0 ? `<div class="empty-state"><div class="e-icon">📭</div><p>${t('noRecords')}</p></div>`
    : filtered.map(r=>`
      <div class="record-item">
        <div class="record-icon">🏪</div>
        <div class="record-info">
          <div class="record-store">${r.store} <span class="badge">${r.submitter}</span></div>
          <div class="record-meta">💵 RM${parseFloat(r.cash).toFixed(2)} | 📱 RM${parseFloat(r.qr).toFixed(2)} | 💳 RM${parseFloat(r.card).toFixed(2)}</div>
          ${r.remark ? `<div style="font-size:12px;color:var(--accent);margin-top:2px;">📝 ${r.remark}</div>` : ''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="record-amount">RM ${parseFloat(r.total).toFixed(2)}</div>
          <div class="record-sub">${fmtDate(r.datetime)}</div>
        </div>
      </div>
    `).join('');

  document.getElementById('tab-records').innerHTML = `
    <div class="card-header-flex">
      <h2 style="font-size:18px;font-weight:900">${t('recordsTab')}</h2>
      <button class="btn refresh-btn" onclick="triggerSyncRefresh()">🔄 ${t('refresh')}</button>
    </div>
    ${filterControlsHtml}
    <div class="card">${listHtml}</div>
  `;
}

function updateRecordDateRange(val) { selectedDateRange = val; renderRecordsTab(); }
function updateCustomDateValue(val) { customDateValue = val; renderRecordsTab(); }
function setRecordStoreFilter(store) { activeRecordStoreFilter = store; renderRecordsTab(); }
function updateStaffViewMode(val) { staffViewMode = val; renderRecordsTab(); }

function renderSummaryTab() {
  const isExec = ['boss','admin','manager'].includes(currentUser.role);
  if(!isExec) {
    document.getElementById('tab-summary').innerHTML = `
      <div class="card" style="text-align:center;padding:40px 20px">
        <div style="font-size:52px;">🔒</div><h3>${t('accessDenied')}</h3><p>${t('accessMsg')}</p>
      </div>`; return;
  }

  const sales = getSales();
  const todayKey = new Date().toISOString().slice(0,10);
  let yesterdayKey = new Date(); yesterdayKey.setDate(yesterdayKey.getDate() - 1);
  yesterdayKey = yesterdayKey.toISOString().slice(0,10);

  let targetRangeDay = todayKey;
  if(selectedDateRange === 'yesterday') targetRangeDay = yesterdayKey;
  if(selectedDateRange === 'custom_date') targetRangeDay = customDateValue;

  const rangeSales = sales.filter(s=>s.dateKey === targetRangeDay);
  const monthSales = sales.filter(s=>s.month === selectedMonthValue);
  const rangeTotal = rangeSales.reduce((a,s)=>a+parseFloat(s.total),0);
  const monthTotal = monthSales.reduce((a,s)=>a+parseFloat(s.total),0);

  const storeMap = {}; STORES.forEach(s=>storeMap[s]=0);
  monthSales.forEach(s=>storeMap[s.store] = (storeMap[s.store]||0)+parseFloat(s.total));
  const maxStore = Math.max(...Object.values(storeMap),1);

  const days = [];
  for(let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const dk = d.toISOString().slice(0,10);
    const label = d.toLocaleDateString([],{weekday:'short'}).slice(0,2);
    const val = sales.filter(s=>s.dateKey===dk).reduce((a,s)=>a+parseFloat(s.total),0);
    days.push({label,val});
  }
  const maxDay = Math.max(...days.map(d=>d.val),1);

  document.getElementById('tab-summary').innerHTML = `
    <div class="card-header-flex">
      <h2 style="font-size:18px;font-weight:900">${t('summaryTab')}</h2>
      <button class="btn refresh-btn" onclick="triggerSyncRefresh()">🔄 ${t('refresh')}</button>
    </div>
    <div class="card" style="padding:14px; margin-bottom:14px; background:#eff6ff;">
      <div class="control-grid" style="margin-bottom:0;">
        <div>
          <label class="field-label" style="font-size:12px;margin-bottom:4px;">📅 ${t('filterRange')}</label>
          <select onchange="updateSummaryDateRange(this.value)" style="padding:8px 10px; font-size:14px;">
            <option value="today" ${selectedDateRange==='today'?'selected':''}>${t('todayOpt')}</option>
            <option value="yesterday" ${selectedDateRange==='yesterday'?'selected':''}>${t('yestOpt')}</option>
            <option value="custom_date" ${selectedDateRange==='custom_date'?'selected':''}>${t('customOpt')}</option>
          </select>
          ${selectedDateRange==='custom_date' ? `<input type="date" value="${customDateValue}" onchange="updateSummaryCustomDate(this.value)" style="padding:6px;font-size:12px;margin-top:6px;">`:''}
        </div>
        <div>
          <label class="field-label" style="font-size:12px;margin-bottom:4px;">🗓️ ${t('selectMonthLabel')}</label>
          <input type="month" value="${selectedMonthValue}" onchange="updateSummaryMonth(this.value)" style="padding:8px 10px; font-size:14px;">
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div class="card" style="margin:0;text-align:center">
        <div style="font-size:11px;font-weight:800;color:var(--text2);margin-bottom:6px">📊 TOTAL</div>
        <div style="font-size:20px;font-weight:900;color:var(--primary)">RM ${rangeTotal.toFixed(2)}</div>
      </div>
      <div class="card" style="margin:0;text-align:center">
        <div style="font-size:11px;font-weight:800;color:var(--text2);margin-bottom:6px">🗓️ MONTH [${selectedMonthValue}]</div>
        <div style="font-size:20px;font-weight:900;color:var(--success)">RM ${monthTotal.toFixed(0)}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📈 ${t('daily')}</div>
      <div class="bar-chart">
        ${days.map(d=>`<div class="bar-col"><div class="bar-fill" style="height:${Math.max(4,(d.val/maxDay)*80)}px"></div><div class="bar-label">${d.label}</div></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title">🏪 ${t('byStore')} (${selectedMonthValue})</div>
      ${STORES.map(s=>`
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px">
            <span>${s}</span><span style="color:var(--primary)">RM ${(storeMap[s]||0).toFixed(2)}</span>
          </div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${((storeMap[s]||0)/maxStore*100).toFixed(1)}%"></div></div>
        </div>
      `).join('')}
    </div>
  `;
}

function updateSummaryDateRange(val) { selectedDateRange = val; renderSummaryTab(); }
function updateSummaryCustomDate(val) { customDateValue = val; renderSummaryTab(); }
function updateSummaryMonth(val) { selectedMonthValue = val; renderSummaryTab(); }

function renderProfileTab() {
  document.getElementById('tab-profile').innerHTML = `
    <div class="card" style="text-align:center;padding:28px">
      <div style="font-size:54px;margin-bottom:10px">👤</div>
      <h2 style="font-size:22px;font-weight:900">${currentUser.name}</h2>
      <div style="margin-top:8px"><span class="role-tag ${currentUser.role}">${t(currentUser.role)}</span></div>
      <div style="margin-top:10px;color:var(--text2);font-size:15px">🏪 ${currentUser.store}</div>
    </div>
    <button class="btn danger" onclick="doLogout()" style="margin-top:8px">${t('logout')}</button>
  `;
}

function doLogout() {
  currentUser = null; document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
  document.getElementById('login-pin').value=''; document.getElementById('login-name').value='';
}

function fmtDate(iso) {
  if(!iso) return "..."; const d = new Date(iso);
  return d.toLocaleDateString(lang==='zh'?'zh-CN':'en-MY',{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function showToast(msg, type='') {
  const el = document.getElementById('toast'); el.textContent = msg;
  el.className = 'show ' + (type? type+'-toast' : ''); setTimeout(()=>el.className='',3000);
}

window.addEventListener('DOMContentLoaded', fetchLiveUsers);
</script>
</body>
</html>
