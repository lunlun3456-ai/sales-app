<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sales Reporter</title>
<style>
  :root { --primary: #2563eb; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; --card: #ffffff; }
  body { font-family: sans-serif; background: var(--bg); padding: 20px; }
  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:1000; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--card); padding:20px; border-radius:12px; width:90%; max-width:400px; }
  .btn { padding:10px; border-radius:8px; border:none; cursor:pointer; width:100%; font-weight:bold; }
  .btn.success { background:var(--success); color:white; }
  .btn.warn { background:#f59e0b; color:white; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- All Submitted Notification Modal -->
<div class="modal-overlay" id="all-submitted-modal">
  <div class="modal-box" style="text-align:center">
    <div style="font-size:40px; margin-bottom:10px;">🎉</div>
    <h3 id="all-submitted-title">All Stores Submitted!</h3>
    <p id="all-submitted-msg" style="margin:15px 0;">All branches have successfully updated their sales figures for today.</p>
    <button class="btn success" onclick="document.getElementById('all-submitted-modal').classList.remove('open')">Awesome!</button>
  </div>
</div>

<script>
// Mocking the environment
const STORES = ['Bonia Sabindo', 'Bonia Eastern', 'Polo Sabindo', 'Polo Eastern', 'Gm Sabindo', 'Gm Eastern', 'HQ'];
let currentUser = { role: 'admin', store: 'HQ' }; // Defaulting for demo
let salesData = []; 

// Notification Logic
function checkAllStoresSubmitted() {
  if (!['admin', 'boss', 'manager'].includes(currentUser.role)) return;
  
  const today = new Date().toISOString().slice(0, 10);
  const notifiedKey = 'notified_all_submitted_' + today;
  if (sessionStorage.getItem(notifiedKey)) return;

  const todaySales = salesData.filter(s => s.dateKey === today);
  const submittedStores = new Set(todaySales.map(s => s.store));
  
  // Logic: All stores except HQ
  const branches = STORES.filter(s => s !== 'HQ');
  const allSubmitted = branches.length > 0 && branches.every(b => submittedStores.has(b));

  if (allSubmitted) {
    document.getElementById('all-submitted-modal').classList.add('open');
    sessionStorage.setItem(notifiedKey, 'true');
  }
}

// Remind Logic
function sendReminder() {
  const today = new Date().toISOString().slice(0, 10);
  const todaySales = salesData.filter(s => s.dateKey === today);
  const submittedStores = new Set(todaySales.map(s => s.store));
  const branches = STORES.filter(s => s !== 'HQ');
  const pending = branches.filter(b => !submittedStores.has(b));

  if (pending.length === 0) {
    alert('All branches have already submitted their sales for today!');
    return;
  }

  const text = encodeURIComponent(`🔔 *Sales Report Reminder*\nDate: ${today}\n\nPlease submit your sales for:\n${pending.map(p => '- ' + p).join('\n')}`);
  window.open('https://wa.me/?text=' + text, '_blank');
}

// Logic to show/hide HQ in UI
function getAllowedStores() {
  // If user is Admin, they see HQ. Otherwise, filter it out.
  return currentUser.role === 'admin' ? STORES : STORES.filter(s => s !== 'HQ');
}

// Initialize on page load
window.onload = () => {
    // Example: Trigger check after data fetch
    checkAllStoresSubmitted();
};
</script>
</body>
</html>
