<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6feb">
  <title>KI Sales Report</title>
  <style>
    :root {
      --bg: #eef4fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8e2ef;
      --blue: #1f6feb;
      --blue-dark: #174ea6;
      --green: #11875d;
      --red: #d92d20;
      --amber: #b7791f;
      --shadow: 0 8px 28px rgba(31, 111, 235, .12);
      --radius: 14px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
    }

    button, input, select {
      font: inherit;
    }

    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; }
    #login-screen {
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(150deg, #123a70, #1f6feb 62%, #58a6ff);
    }

    .login-box, .card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      padding: 28px;
    }

    .logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 16px;
      background: #eaf2ff;
      color: var(--blue);
      font-weight: 900;
      font-size: 24px;
    }

    .logo h1 { margin: 0; font-size: 25px; letter-spacing: .04em; }
    .logo p { margin: 5px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    .field { margin-bottom: 14px; }
    input, select {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: #f8fbff;
      color: var(--ink);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      background: #fff;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 14px;
      background: var(--blue);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .btn:active { transform: scale(.99); }
    .btn.secondary { background: #eaf2ff; color: var(--blue); }
    .btn.success { background: var(--green); }
    .btn.danger { background: var(--red); }
    .btn.small {
      width: auto;
      min-height: 0;
      padding: 8px 11px;
      font-size: 13px;
      border-radius: 9px;
    }

    #app-screen {
      flex-direction: column;
      max-width: 520px;
      margin: 0 auto;
      background: var(--bg);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 15px 16px 12px;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 16px rgba(0,0,0,.16);
    }

    .topbar h2 { margin: 0; font-size: 18px; }
    .topbar p { margin: 2px 0 0; font-size: 12px; opacity: .86; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .dot { width: 8px; height: 8px; border-radius: 999px; background: #fbbf24; }
    .status.ok .dot { background: #34d399; }
    .status.bad .dot { background: #f87171; }

    main {
      flex: 1;
      padding: 16px 14px 86px;
    }

    .tab { display: none; }
    .tab.active { display: block; }
    .card {
      padding: 16px;
      margin-bottom: 13px;
    }

    .banner {
      padding: 16px;
      margin-bottom: 13px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #1f6feb, #58a6ff);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .banner h3 { margin: 0; font-size: 19px; }
    .banner p { margin: 5px 0 0; opacity: .88; font-size: 13px; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: 0; }
    .muted { color: var(--muted); }
    .amount { color: var(--blue); font-size: 23px; font-weight: 950; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .money-wrap { position: relative; }
    .money-wrap span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--blue);
      font-weight: 950;
    }
    .money-wrap input {
      padding-left: 45px;
      min-height: 56px;
      font-size: 22px;
      font-weight: 900;
    }

    .record {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .record:last-child { border-bottom: 0; }
    .record strong { font-size: 15px; }
    .record .meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .record .total { color: var(--blue); font-size: 18px; font-weight: 950; text-align: right; }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 0 13px;
      padding-bottom: 3px;
    }
    .chip {
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .metric {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px;
      text-align: center;
    }
    .metric b { display: block; color: var(--blue); font-size: 20px; margin-top: 5px; }

    .bar-row { margin: 13px 0; }
    .bar-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }
    .bar-track { height: 9px; background: #e6edf7; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar-fill { height: 100%; background: var(--blue); border-radius: 999px; min-width: 2px; }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      background: #fff;
      border-top: 1px solid var(--line);
      box-shadow: 0 -5px 20px rgba(0,0,0,.08);
    }
    .nav-btn {
      flex: 1;
      border: 0;
      background: #fff;
      color: var(--muted);
      padding: 10px 3px 8px;
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
    }
    .nav-btn b { display: block; font-size: 20px; line-height: 1.1; }
    .nav-btn.active { color: var(--blue); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, .52);
    }
    .modal.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow: auto;
      padding: 18px;
      border-radius: 18px 18px 0 0;
      background: #fff;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      z-index: 80;
      max-width: 88vw;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: #111827;
      color: #fff;
      font-size: 13px;
      font-weight: 850;
      transition: .2s;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%); }
    #toast.ok { background: var(--green); }
    #toast.bad { background: var(--red); }
    #toast.warn { background: var(--amber); }

    @media (max-width: 380px) {
      body { font-size: 15px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>

  <section id="login-screen" class="screen active">
    <div class="login-box">
      <div class="logo">
        <div class="logo-mark">KI</div>
        <h1>SALES REPORT</h1>
        <p>Google Spreadsheet Sync</p>
      </div>
      <div class="field">
        <label for="login-user">Username</label>
        <input id="login-user" autocomplete="username" autocapitalize="none" placeholder="kiki">
      </div>
      <div class="field">
        <label for="login-pin">PIN</label>
        <input id="login-pin" type="password" maxlength="4" inputmode="numeric" autocomplete="current-password" placeholder="4 digits">
      </div>
      <button class="btn" id="login-btn">Login</button>
      <button class="btn secondary" id="open-register" style="margin-top:10px">Register Account</button>
      <p class="muted" style="font-size:12px;text-align:center;margin:16px 0 0">Data is read from Google Sheets. Local cache is used only when offline.</p>
    </div>
  </section>

  <section id="app-screen" class="screen">
    <header class="topbar">
      <div>
        <h2>SALES REPORT</h2>
        <p id="user-line"></p>
      </div>
      <div id="sync-status" class="status"><span class="dot"></span><span>Syncing</span></div>
    </header>

    <main>
      <section id="tab-submit" class="tab active"></section>
      <section id="tab-records" class="tab"></section>
      <section id="tab-summary" class="tab"></section>
      <section id="tab-admin" class="tab"></section>
      <section id="tab-profile" class="tab"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="submit"><b>+</b>Submit</button>
      <button class="nav-btn" data-tab="records"><b>=</b>Records</button>
      <button class="nav-btn" data-tab="summary"><b>%</b>Summary</button>
      <button class="nav-btn" data-tab="admin" id="admin-nav"><b>*</b>Admin</button>
      <button class="nav-btn" data-tab="profile"><b>@</b>Me</button>
    </nav>
  </section>

  <div id="confirm-modal" class="modal">
    <div class="modal-box">
      <h3 style="margin-top:0">Confirm Submission</h3>
      <div id="confirm-body"></div>
      <div class="grid" style="margin-top:14px">
        <button class="btn secondary" data-close="confirm-modal">Cancel</button>
        <button class="btn success" id="confirm-submit">Submit & Sync</button>
      </div>
    </div>
  </div>

  <div id="register-modal" class="modal">
    <div class="modal-box">
      <h3 style="margin-top:0">Register Account</h3>
      <div class="field"><label>Username</label><input id="reg-username" autocapitalize="none"></div>
      <div class="field"><label>Full Name</label><input id="reg-name"></div>
      <div class="field"><label>Store</label><select id="reg-store"></select></div>
      <div class="field"><label>Role</label><select id="reg-role"><option value="staff">Staff</option><option value="supervisor">Supervisor</option><option value="manager">Manager</option></select></div>
      <div class="field"><label>PIN</label><input id="reg-pin" type="password" maxlength="4" inputmode="numeric"></div>
      <div class="grid">
        <button class="btn secondary" data-close="register-modal">Cancel</button>
        <button class="btn success" id="register-submit">Send Request</button>
      </div>
    </div>
  </div>

  <div id="user-modal" class="modal">
    <div class="modal-box">
      <h3 style="margin-top:0" id="user-modal-title">User</h3>
      <input type="hidden" id="edit-original">
      <div class="field"><label>Username</label><input id="edit-username" autocapitalize="none"></div>
      <div class="field"><label>Name</label><input id="edit-name"></div>
      <div class="field"><label>PIN</label><input id="edit-pin" type="password" maxlength="4" inputmode="numeric"></div>
      <div class="field"><label>Role</label><select id="edit-role"><option value="staff">Staff</option><option value="supervisor">Supervisor</option><option value="manager">Manager</option><option value="boss">Boss</option><option value="admin">Admin</option></select></div>
      <div class="field"><label>Store</label><select id="edit-store"></select></div>
      <div class="grid">
        <button class="btn secondary" data-close="user-modal">Cancel</button>
        <button class="btn success" id="save-user">Save</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyDvgwVEZgdXZuNgH4eGaRo4LlXF4wtH3NMGIpShcT2ngC3CqgF9XhOyPqAwLsdjoDl/exec';
    const STORES = ['HQ', 'Bonia Sabindo', 'Bonia Eastern', 'Polo Sabindo', 'Polo Eastern', 'Gm Sabindo', 'Gm Eastern'];
    const STORE_OPTIONS = ['ALL', ...STORES];
    const LS = {
      url: 'ki_web_app_url',
      users: 'ki_users',
      sales: 'ki_sales',
    };

    let webAppUrl = load(LS.url, DEFAULT_WEB_APP_URL);
    let currentUser = null;
    let cachedUsers = {};
    let salesRecords = [];
    let activeTab = 'submit';
    let activeStore = 'all';
    let filterRange = 'today';
    let filterMonth = monthKey(new Date());
    let filterDate = dateKey(new Date());
    let syncTimer = null;
    let pendingSale = null;

    const $ = (id) => document.getElementById(id);
    const money = (n) => `RM ${num(n).toFixed(2)}`;
    const privileged = () => currentUser && ['boss', 'admin', 'manager'].includes(currentUser.role);
    const isAdmin = () => currentUser && ['boss', 'admin'].includes(currentUser.role);

    function save(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function load(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (err) {
        return fallback;
      }
    }

    function num(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function dateKey(value) {
      if (!value) return '';
      if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value).slice(0, 10);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function monthKey(value) {
      if (!value) return '';
      if (typeof value === 'string' && /^\d{4}-\d{2}$/.test(value)) return value;
      return dateKey(value).slice(0, 7);
    }

    function todayKey(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return dateKey(d);
    }

    function normalizeSale(row) {
      const dk = dateKey(row.dateKey || row.date || row.datetime);
      return {
        id: row.id || `${dk}-${row.store || ''}`,
        store: row.store || '',
        cash: num(row.cash),
        qr: num(row.qr),
        card: num(row.card),
        bank: num(row.bank),
        total: num(row.total || num(row.cash) + num(row.qr) + num(row.card) + num(row.bank)),
        remark: row.remark || '',
        submitter: row.submitter || '',
        role: row.role || '',
        datetime: row.datetime || '',
        dateKey: dk,
        month: monthKey(row.month || dk),
      };
    }

    function setStatus(text, type = '') {
      const el = $('sync-status');
      el.className = `status ${type}`;
      el.querySelector('span:last-child').textContent = text;
    }

    function toast(message, type = '') {
      const el = $('toast');
      el.textContent = message;
      el.className = `show ${type}`;
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => el.className = '', 2600);
    }

    async function apiGet(action) {
      const res = await fetch(`${webAppUrl}?action=${encodeURIComponent(action)}&t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const payload = await res.json();
      if (payload && payload.error) throw new Error(payload.error);
      return payload;
    }

    async function apiPost(body) {
      await fetch(webAppUrl, {
        method: 'POST',
        mode: 'no-cors',
        cache: 'no-cache',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
      });
      return { ok: true };
    }

    async function syncUsers() {
      cachedUsers = load(LS.users, {});
      const users = await apiGet('getUsers');
      if (users && typeof users === 'object') {
        cachedUsers = users;
        save(LS.users, cachedUsers);
      }
      return cachedUsers;
    }

    async function syncSales({ silent = false } = {}) {
      if (!silent) setStatus('Syncing', 'warn');
      try {
        let payload;
        try {
          payload = await apiGet('getSales');
        } catch (err) {
          payload = await apiGet('getRecords');
        }
        const rows = Array.isArray(payload) ? payload : (payload.sales || payload.records || []);
        salesRecords = rows.map(normalizeSale).filter(r => r.store && r.dateKey);
        save(LS.sales, salesRecords);
        setStatus('Live', 'ok');
        if (!silent) toast('Spreadsheet synced', 'ok');
        renderActiveTab();
        return salesRecords;
      } catch (err) {
        salesRecords = load(LS.sales, []);
        setStatus('Offline', 'bad');
        if (!silent) toast(`Live sync error: ${err.message}`, 'bad');
        renderActiveTab();
        return salesRecords;
      }
    }

    function startLiveSync() {
      window.clearInterval(syncTimer);
      syncTimer = window.setInterval(() => syncSales({ silent: true }), 20000);
    }

    function fillStoreSelect(select, values = STORES, selected = '') {
      select.innerHTML = values.map(store => `<option value="${store}" ${store === selected ? 'selected' : ''}>${store}</option>`).join('');
    }

    function init() {
      fillStoreSelect($('reg-store'), STORES);
      fillStoreSelect($('edit-store'), STORE_OPTIONS);

      $('login-btn').addEventListener('click', doLogin);
      $('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
      $('open-register').addEventListener('click', () => openModal('register-modal'));
      $('register-submit').addEventListener('click', registerUser);
      $('confirm-submit').addEventListener('click', confirmSubmit);
      $('save-user').addEventListener('click', saveUser);

      document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.dataset.close));
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      cachedUsers = load(LS.users, {});
      salesRecords = load(LS.sales, []);
      setStatus('Ready', 'warn');
    }

    async function doLogin() {
      const username = $('login-user').value.trim().toLowerCase();
      const pin = $('login-pin').value.trim();
      if (!username || !pin) return toast('Enter username and PIN', 'bad');

      toast('Checking Google Sheet...', 'warn');
      try {
        await syncUsers();
      } catch (err) {
        toast('Using saved user cache', 'warn');
      }

      const user = cachedUsers[username];
      if (!user || String(user.pin) !== String(pin)) return toast('Wrong username or PIN', 'bad');
      if (user.status && user.status !== 'active') return toast('Account is pending approval', 'bad');

      currentUser = { ...user, username };
      $('user-line').textContent = `${currentUser.name} | ${currentUser.store} | ${currentUser.role}`;
      $('admin-nav').style.display = isAdmin() ? 'block' : 'none';
      $('login-screen').classList.remove('active');
      $('app-screen').classList.add('active');

      renderSubmit();
      await syncSales({ silent: true });
      startLiveSync();
      switchTab('submit');
    }

    function logout() {
      currentUser = null;
      window.clearInterval(syncTimer);
      $('app-screen').classList.remove('active');
      $('login-screen').classList.add('active');
      $('login-pin').value = '';
      setStatus('Ready', 'warn');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.id === `tab-${tab}`));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
      if (['records', 'summary', 'admin'].includes(tab)) syncSales({ silent: true });
      renderActiveTab();
    }

    function renderActiveTab() {
      if (!currentUser) return;
      if (activeTab === 'submit') renderSubmit();
      if (activeTab === 'records') renderRecords();
      if (activeTab === 'summary') renderSummary();
      if (activeTab === 'admin') renderAdmin();
      if (activeTab === 'profile') renderProfile();
    }

    function renderSubmit() {
      const selectedStore = privileged() ? (currentUser.store === 'ALL' ? STORES[0] : currentUser.store) : currentUser.store;
      $('tab-submit').innerHTML = `
        <div class="banner"><h3>Enter / Update Sales</h3><p>Submitting the same store and date updates the spreadsheet row.</p></div>
        <div class="card">
          <div class="field"><label>Date</label><input type="date" id="sale-date" value="${todayKey()}"></div>
          <div class="field"><label>Store</label>${privileged() ? `<select id="sale-store">${STORES.map(s => `<option value="${s}" ${s === selectedStore ? 'selected' : ''}>${s}</option>`).join('')}</select>` : `<input id="sale-store" value="${currentUser.store}" disabled>`}</div>
          <div class="field"><label>Cash</label><div class="money-wrap"><span>RM</span><input id="sale-cash" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
          <div class="field"><label>QR Pay</label><div class="money-wrap"><span>RM</span><input id="sale-qr" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
          <div class="field"><label>Credit Card</label><div class="money-wrap"><span>RM</span><input id="sale-card" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
          <div class="field"><label>Bank Transfer</label><div class="money-wrap"><span>RM</span><input id="sale-bank" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
          <div class="row"><span class="muted">Total Sales</span><span class="amount" id="sale-total">RM 0.00</span></div>
          <div class="field" style="margin-top:14px"><label>Remark</label><input id="sale-remark" placeholder="Optional"></div>
          <button class="btn" id="open-confirm">Submit & Sync</button>
        </div>`;

      ['sale-date', 'sale-store'].forEach(id => $(id).addEventListener('change', loadExistingSale));
      ['sale-cash', 'sale-qr', 'sale-card', 'sale-bank'].forEach(id => $(id).addEventListener('input', updateTotal));
      $('open-confirm').addEventListener('click', openConfirm);
      loadExistingSale();
    }

    function loadExistingSale() {
      const store = $('sale-store').value;
      const dk = $('sale-date').value;
      const existing = salesRecords.find(r => r.store === store && r.dateKey === dk);
      $('sale-cash').value = existing ? existing.cash : '';
      $('sale-qr').value = existing ? existing.qr : '';
      $('sale-card').value = existing ? existing.card : '';
      $('sale-bank').value = existing ? existing.bank : '';
      $('sale-remark').value = existing ? existing.remark : '';
      updateTotal();
    }

    function updateTotal() {
      const total = ['sale-cash', 'sale-qr', 'sale-card', 'sale-bank'].reduce((sum, id) => sum + num($(id).value), 0);
      $('sale-total').textContent = money(total);
    }

    function openConfirm() {
      const store = $('sale-store').value;
      const dk = $('sale-date').value;
      if (!store || !dk) return toast('Choose store and date', 'bad');

      pendingSale = {
        id: Date.now(),
        store,
        cash: num($('sale-cash').value),
        qr: num($('sale-qr').value),
        card: num($('sale-card').value),
        bank: num($('sale-bank').value),
        remark: $('sale-remark').value.trim(),
        submitter: currentUser.name,
        role: currentUser.role,
        datetime: new Date().toISOString(),
        dateKey: dk,
        month: dk.slice(0, 7),
      };
      pendingSale.total = pendingSale.cash + pendingSale.qr + pendingSale.card + pendingSale.bank;

      $('confirm-body').innerHTML = `
        <div class="row"><span>Store</span><b>${pendingSale.store}</b></div>
        <div class="row"><span>Date</span><b>${pendingSale.dateKey}</b></div>
        <div class="row"><span>Cash</span><b>${money(pendingSale.cash)}</b></div>
        <div class="row"><span>QR Pay</span><b>${money(pendingSale.qr)}</b></div>
        <div class="row"><span>Credit Card</span><b>${money(pendingSale.card)}</b></div>
        <div class="row"><span>Bank Transfer</span><b>${money(pendingSale.bank)}</b></div>
        <div class="row"><span>Total</span><b class="amount">${money(pendingSale.total)}</b></div>`;
      openModal('confirm-modal');
    }

    async function confirmSubmit() {
      if (!pendingSale) return;
      closeModal('confirm-modal');
      setStatus('Writing', 'warn');
      toast('Writing to spreadsheet...', 'warn');
      try {
        await apiPost({ action: 'submitSales', ...pendingSale });
        upsertLocalSale(pendingSale);
        toast('Saved. Refreshing spreadsheet...', 'ok');
        window.setTimeout(() => syncSales({ silent: false }), 1400);
      } catch (err) {
        setStatus('Offline', 'bad');
        toast(`Write error: ${err.message}`, 'bad');
      }
    }

    function upsertLocalSale(record) {
      salesRecords = salesRecords.filter(r => !(r.store === record.store && r.dateKey === record.dateKey));
      salesRecords.push(normalizeSale(record));
      save(LS.sales, salesRecords);
      renderActiveTab();
    }

    function filteredSales() {
      let rows = privileged() ? [...salesRecords] : salesRecords.filter(r => r.store === currentUser.store);
      if (activeStore !== 'all') rows = rows.filter(r => r.store === activeStore);
      if (filterRange === 'today') rows = rows.filter(r => r.dateKey === todayKey());
      if (filterRange === 'yesterday') rows = rows.filter(r => r.dateKey === todayKey(-1));
      if (filterRange === 'date') rows = rows.filter(r => r.dateKey === filterDate);
      if (filterRange === 'month') rows = rows.filter(r => r.month === filterMonth);
      return rows.sort((a, b) => `${b.dateKey}${b.datetime}`.localeCompare(`${a.dateKey}${a.datetime}`));
    }

    function renderFilterControls(target) {
      target.innerHTML += `
        <div class="card">
          <div class="grid">
            <div><label>Date Range</label><select id="filter-range"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="date">Pick Date</option><option value="month">Monthly</option></select></div>
            <div id="filter-extra"></div>
          </div>
        </div>`;
      $('filter-range').value = filterRange;
      $('filter-range').addEventListener('change', e => {
        filterRange = e.target.value;
        renderActiveTab();
      });
      renderFilterExtra();
    }

    function renderFilterExtra() {
      $('filter-extra').innerHTML = filterRange === 'date'
        ? `<label>Date</label><input id="filter-date" type="date" value="${filterDate}">`
        : `<label>Month</label><input id="filter-month" type="month" value="${filterMonth}">`;
      const dateInput = $('filter-date');
      const monthInput = $('filter-month');
      if (dateInput) dateInput.addEventListener('change', e => { filterDate = e.target.value; renderActiveTab(); });
      if (monthInput) monthInput.addEventListener('change', e => { filterMonth = e.target.value; renderActiveTab(); });
    }

    function renderStoreChips() {
      if (!privileged()) return '';
      return `<div class="chips"><button class="chip ${activeStore === 'all' ? 'active' : ''}" data-store="all">All Stores</button>${STORES.map(s => `<button class="chip ${activeStore === s ? 'active' : ''}" data-store="${s}">${s}</button>`).join('')}</div>`;
    }

    function bindStoreChips() {
      document.querySelectorAll('[data-store]').forEach(btn => btn.addEventListener('click', () => {
        activeStore = btn.dataset.store;
        renderActiveTab();
      }));
    }

    function renderRecords() {
      const rows = filteredSales();
      $('tab-records').innerHTML = `<div class="row" style="border:0;padding-top:0"><h3 style="margin:0">Sales Records</h3><button class="btn small secondary" id="manual-sync">Sync</button></div>`;
      renderFilterControls($('tab-records'));
      $('tab-records').innerHTML += renderStoreChips();
      $('tab-records').innerHTML += `<div class="card">${rows.length ? rows.map(recordHtml).join('') : '<p class="muted" style="text-align:center">No records found.</p>'}</div>`;
      $('manual-sync').addEventListener('click', () => syncSales({ silent: false }));
      bindStoreChips();
    }

    function recordHtml(r) {
      return `<div class="record">
        <div><strong>${r.store}</strong> <span class="muted">${r.submitter || ''}</span><div class="meta">Cash ${money(r.cash)} | QR ${money(r.qr)}<br>Card ${money(r.card)} | Bank ${money(r.bank)}${r.remark ? `<br>${r.remark}` : ''}</div></div>
        <div><div class="total">${money(r.total)}</div><div class="meta">${r.dateKey}</div></div>
      </div>`;
    }

    function renderSummary() {
      if (!privileged()) {
        $('tab-summary').innerHTML = '<div class="card"><h3>Access Restricted</h3><p class="muted">Only manager, boss, and admin users can view summary.</p></div>';
        return;
      }
      const rows = filteredSales();
      const monthRows = salesRecords.filter(r => r.month === filterMonth);
      const rangeTotal = rows.reduce((sum, r) => sum + r.total, 0);
      const monthTotal = monthRows.reduce((sum, r) => sum + r.total, 0);
      const storeTotals = Object.fromEntries(STORES.map(s => [s, 0]));
      monthRows.forEach(r => storeTotals[r.store] = (storeTotals[r.store] || 0) + r.total);
      const max = Math.max(1, ...Object.values(storeTotals));
      $('tab-summary').innerHTML = `<div class="row" style="border:0;padding-top:0"><h3 style="margin:0">Sales Summary</h3><button class="btn small secondary" id="summary-sync">Sync</button></div>`;
      renderFilterControls($('tab-summary'));
      $('tab-summary').innerHTML += `
        <div class="grid" style="margin-bottom:13px">
          <div class="metric"><span class="muted">Range Total</span><b>${money(rangeTotal)}</b></div>
          <div class="metric"><span class="muted">${filterMonth}</span><b>${money(monthTotal)}</b></div>
        </div>
        <div class="card"><h3 style="margin-top:0">Sales by Store</h3>${STORES.map(store => `<div class="bar-row"><div class="bar-head"><span>${store}</span><span>${money(storeTotals[store] || 0)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${((storeTotals[store] || 0) / max * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>`;
      $('summary-sync').addEventListener('click', () => syncSales({ silent: false }));
    }

    function renderAdmin() {
      if (!isAdmin()) {
        $('tab-admin').innerHTML = '<div class="card"><h3>No access</h3></div>';
        return;
      }
      const users = Object.entries(cachedUsers).map(([username, u]) => ({ username, ...u }));
      $('tab-admin').innerHTML = `<div class="row" style="border:0;padding-top:0"><h3 style="margin:0">Admin</h3><button class="btn small success" id="add-user">Add User</button></div>
        <div class="card">${users.map(u => `<div class="row"><div><b>${u.name || u.username}</b><div class="muted" style="font-size:12px">@${u.username} | ${u.role} | ${u.store} | ${u.status || 'active'}</div></div><div style="display:flex;gap:6px"><button class="btn small secondary" data-edit="${u.username}">Edit</button>${u.username !== currentUser.username ? `<button class="btn small danger" data-delete="${u.username}">Delete</button>` : ''}</div></div>`).join('')}</div>`;
      $('add-user').addEventListener('click', () => openUserEditor());
      document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openUserEditor(btn.dataset.edit)));
      document.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => deleteUser(btn.dataset.delete)));
    }

    function renderProfile() {
      $('tab-profile').innerHTML = `
        <div class="card">
          <h3 style="margin-top:0">${currentUser.name}</h3>
          <p class="muted">@${currentUser.username} | ${currentUser.role} | ${currentUser.store}</p>
        </div>
        <div class="card">
          <label>Google Apps Script Web App URL</label>
          <input id="url-input" value="${webAppUrl}">
          <button class="btn success" id="save-url" style="margin-top:10px">Save URL & Sync</button>
        </div>
        <div class="card">
          <div class="row"><span class="muted">Cached records</span><b>${salesRecords.length}</b></div>
          <div class="row"><span class="muted">Data source</span><b>Google Sheets</b></div>
        </div>
        <button class="btn danger" id="logout">Logout</button>`;
      $('save-url').addEventListener('click', async () => {
        webAppUrl = $('url-input').value.trim();
        save(LS.url, webAppUrl);
        await syncUsers();
        await syncSales({ silent: false });
      });
      $('logout').addEventListener('click', logout);
    }

    function openModal(id) {
      $(id).classList.add('open');
    }

    function closeModal(id) {
      $(id).classList.remove('open');
    }

    async function registerUser() {
      const payload = {
        action: 'registerRequest',
        username: $('reg-username').value.trim().toLowerCase(),
        name: $('reg-name').value.trim(),
        store: $('reg-store').value,
        role: $('reg-role').value,
        pin: $('reg-pin').value.trim(),
      };
      if (!payload.username || !payload.name || !payload.pin || payload.pin.length !== 4) return toast('Complete all fields. PIN must be 4 digits.', 'bad');
      await apiPost(payload);
      closeModal('register-modal');
      toast('Registration sent for approval', 'ok');
    }

    function openUserEditor(username = '') {
      const user = username ? cachedUsers[username] : {};
      $('user-modal-title').textContent = username ? 'Edit User' : 'Add User';
      $('edit-original').value = username;
      $('edit-username').value = username;
      $('edit-username').disabled = Boolean(username);
      $('edit-name').value = user.name || '';
      $('edit-pin').value = user.pin || '';
      $('edit-role').value = user.role || 'staff';
      fillStoreSelect($('edit-store'), STORE_OPTIONS, user.store || 'HQ');
      openModal('user-modal');
    }

    async function saveUser() {
      const payload = {
        action: 'saveUser',
        originalKey: $('edit-original').value,
        username: $('edit-username').value.trim().toLowerCase(),
        name: $('edit-name').value.trim(),
        pin: $('edit-pin').value.trim(),
        role: $('edit-role').value,
        store: $('edit-store').value,
        status: 'active',
      };
      if (!payload.username || !payload.name || !payload.pin || payload.pin.length !== 4) return toast('Complete all fields. PIN must be 4 digits.', 'bad');
      await apiPost(payload);
      cachedUsers[payload.username] = { name: payload.name, pin: payload.pin, role: payload.role, store: payload.store, status: 'active' };
      if (payload.originalKey && payload.originalKey !== payload.username) delete cachedUsers[payload.originalKey];
      save(LS.users, cachedUsers);
      closeModal('user-modal');
      toast('User saved', 'ok');
      renderAdmin();
      window.setTimeout(() => syncUsers().then(renderAdmin), 1200);
    }

    async function deleteUser(username) {
      if (!confirm(`Delete @${username}?`)) return;
      await apiPost({ action: 'deleteUser', username });
      delete cachedUsers[username];
      save(LS.users, cachedUsers);
      toast('User deleted', 'ok');
      renderAdmin();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
