<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6feb">
  <title>KI Sales Report</title>
  <style>
    :root {
      --bg: #edf4ff;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8e2ef;
      --blue: #1f6feb;
      --blue-dark: #174ea6;
      --cyan: #0ea5e9;
      --green: #11875d;
      --red: #d92d20;
      --amber: #b7791f;
      --shadow: 0 10px 30px rgba(31, 111, 235, .13);
      --radius: 18px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
    }

    button, input, select {
      font: inherit;
    }

    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; }
    #login-screen {
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(150deg, #123a70, #1f6feb 62%, #58a6ff);
    }

    .login-box, .card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      padding: 28px;
    }

    .logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 18px;
      background: linear-gradient(135deg, #eaf2ff, #d8f3ff);
      color: var(--blue-dark);
      font-weight: 900;
      font-size: 24px;
    }

    .logo h1 { margin: 0; font-size: 25px; letter-spacing: .04em; }
    .logo p { margin: 5px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    .field { margin-bottom: 14px; }
    input, select {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: #f8fbff;
      color: var(--ink);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      background: #fff;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 14px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .btn:active { transform: scale(.99); }
    .btn.secondary { background: #eaf2ff; color: var(--blue); }
    .btn.success { background: var(--green); }
    .btn.danger { background: var(--red); }
    .btn.small {
      width: auto;
      min-height: 0;
      padding: 8px 11px;
      font-size: 13px;
      border-radius: 9px;
    }

    #app-screen {
      flex-direction: column;
      max-width: 520px;
      margin: 0 auto;
      background: var(--bg);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 15px 16px 12px;
      background: linear-gradient(135deg, #123a70, #1f6feb);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 16px rgba(0,0,0,.16);
    }

    .topbar h2 { margin: 0; font-size: 18px; }
    .topbar p { margin: 2px 0 0; font-size: 12px; opacity: .86; }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lang-btn {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255,255,255,.2);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .dot { width: 8px; height: 8px; border-radius: 999px; background: #fbbf24; }
    .status.ok .dot { background: #34d399; }
    .status.bad .dot { background: #f87171; }

    main {
      flex: 1;
      padding: 16px 14px 86px;
    }

    .tab { display: none; }
    .tab.active { display: block; }
    .card {
      padding: 16px;
      margin-bottom: 13px;
    }

    .banner {
      padding: 16px;
      margin-bottom: 13px;
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 90% 10%, rgba(255,255,255,.22), transparent 32%),
        linear-gradient(135deg, #123a70, #1f6feb 68%, #58a6ff);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .banner h3 { margin: 0; font-size: 19px; }
    .banner p { margin: 5px 0 0; opacity: .88; font-size: 13px; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: 0; }
    .muted { color: var(--muted); }
    .amount { color: var(--blue); font-size: 23px; font-weight: 950; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .money-wrap { position: relative; }
    .money-wrap span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--blue);
      font-weight: 950;
    }
    .money-wrap input {
      padding-left: 45px;
      min-height: 56px;
      font-size: 22px;
      font-weight: 900;
    }

    .record {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .record:last-child { border-bottom: 0; }
    .record strong { font-size: 15px; }
    .record .meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .record .total { color: var(--blue); font-size: 18px; font-weight: 950; text-align: right; }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 0 13px;
      padding-bottom: 3px;
    }
    .chip {
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .metric {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(23, 32, 51, .05);
    }
    .metric b { display: block; color: var(--blue); font-size: 20px; margin-top: 5px; }

    .bar-row { margin: 13px 0; }
    .bar-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }
    .bar-track { height: 9px; background: #e6edf7; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); border-radius: 999px; min-width: 2px; }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      background: #fff;
      border-top: 1px solid var(--line);
      box-shadow: 0 -5px 20px rgba(0,0,0,.08);
    }
    .nav-btn {
      flex: 1;
      border: 0;
      background: #fff;
      color: var(--muted);
      padding: 10px 3px 8px;
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
    }
    .nav-btn b { display: block; font-size: 20px; line-height: 1.1; }
    .nav-btn.active { color: var(--blue); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, .52);
    }
    .modal.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow: auto;
      padding: 18px;
      border-radius: 18px 18px 0 0;
      background: #fff;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      z-index: 80;
      max-width: 88vw;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: #111827;
      color: #fff;
      font-size: 13px;
      font-weight: 850;
      transition: .2s;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%); }
    #toast.ok { background: var(--green); }
    #toast.bad { background: var(--red); }
    #toast.warn { background: var(--amber); }

    @media (max-width: 380px) {
      body { font-size: 15px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>

  <section id="login-screen" class="screen active">
    <div class="login-box">
      <div class="logo">
        <div class="logo-mark">KI</div>
        <h1>SALES REPORT</h1>
        <p>Google Spreadsheet Sync</p>
      </div>
      <div class="field">
        <label for="login-user" data-i18n="loginUsername">Username</label>
        <input id="login-user" autocomplete="username" autocapitalize="none" placeholder="kiki">
      </div>
      <div class="field">
        <label for="login-pin">PIN</label>
        <input id="login-pin" type="password" maxlength="4" inputmode="numeric" autocomplete="current-password" placeholder="4 digits">
      </div>
      <button class="btn" id="login-btn" data-i18n="login">Login</button>
      <button class="btn secondary" id="open-register" style="margin-top:10px" data-i18n="registerAccount">Register Account</button>
      <p class="muted" style="font-size:12px;text-align:center;margin:16px 0 0" data-i18n="loginHint">Data is read from Google Sheets. Local cache is used only when offline.</p>
    </div>
  </section>

  <section id="app-screen" class="screen">
    <header class="topbar">
      <div>
        <h2>SALES REPORT</h2>
        <p id="user-line"></p>
      </div>
      <div class="top-actions">
        <button class="lang-btn" id="lang-toggle">中文</button>
        <div id="sync-status" class="status"><span class="dot"></span><span>Syncing</span></div>
      </div>
    </header>

    <main>
      <section id="tab-submit" class="tab active"></section>
      <section id="tab-records" class="tab"></section>
      <section id="tab-summary" class="tab"></section>
      <section id="tab-admin" class="tab"></section>
      <section id="tab-profile" class="tab"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="submit"><b>+</b><span data-i18n="navSubmit">Submit</span></button>
      <button class="nav-btn" data-tab="records"><b>=</b><span data-i18n="navRecords">Records</span></button>
      <button class="nav-btn" data-tab="summary"><b>%</b><span data-i18n="navSummary">Summary</span></button>
      <button class="nav-btn" data-tab="admin" id="admin-nav"><b>*</b><span data-i18n="navAdmin">Admin</span></button>
      <button class="nav-btn" data-tab="profile"><b>@</b><span data-i18n="navMe">Me</span></button>
    </nav>
  </section>

  <div id="confirm-modal" class="modal">
    <div class="modal-box">
      <h3 style="margin-top:0" data-i18n="confirmSubmission">Confirm Submission</h3>
      <div id="confirm-body"></div>
      <div class="grid" style="margin-top:14px">
        <button class="btn secondary" data-close="confirm-modal" data-i18n="cancel">Cancel</button>
        <button class="btn success" id="confirm-submit" data-i18n="submitSync">Submit & Sync</button>
      </div>
    </div>
  </div>

  <div id="register-modal" class="modal">
    <div class="modal-box">
      <h3 style="margin-top:0" data-i18n="registerAccount">Register Account</h3>
      <div class="field"><label data-i18n="loginUsername">Username</label><input id="reg-username" autocapitalize="none"></div>
      <div class="field"><label data-i18n="fullName">Full Name</label><input id="reg-name"></div>
      <div class="field"><label data-i18n="store">Store</label><select id="reg-store"></select></div>
      <div class="field"><label data-i18n="role">Role</label><select id="reg-role"><option value="staff">Staff</option><option value="supervisor">Supervisor</option><option value="manager">Manager</option></select></div>
      <div class="field"><label>PIN</label><input id="reg-pin" type="password" maxlength="4" inputmode="numeric"></div>
      <div class="grid">
        <button class="btn secondary" data-close="register-modal" data-i18n="cancel">Cancel</button>
        <button class="btn success" id="register-submit" data-i18n="sendRequest">Send Request</button>
      </div>
    </div>
  </div>

  <div id="user-modal" class="modal">
    <div class="modal-box">
      <h3 style="margin-top:0" id="user-modal-title">User</h3>
      <input type="hidden" id="edit-original">
      <div class="field"><label data-i18n="loginUsername">Username</label><input id="edit-username" autocapitalize="none"></div>
      <div class="field"><label data-i18n="fullName">Name</label><input id="edit-name"></div>
      <div class="field"><label>PIN</label><input id="edit-pin" type="password" maxlength="4" inputmode="numeric"></div>
      <div class="field"><label data-i18n="role">Role</label><select id="edit-role"><option value="staff">Staff</option><option value="supervisor">Supervisor</option><option value="manager">Manager</option><option value="boss">Boss</option><option value="admin">Admin</option></select></div>
      <div class="field"><label data-i18n="store">Store</label><select id="edit-store"></select></div>
      <div class="grid">
        <button class="btn secondary" data-close="user-modal" data-i18n="cancel">Cancel</button>
        <button class="btn success" id="save-user" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw3d1UoVsdY2ifb_HECM9-frLFf8ol3uIofMqA6YeoGXdS2ZBSNItuybJ2FAzbd_hFM/exec';
    const STORES = ['HQ', 'Bonia Sabindo', 'Bonia Eastern', 'Polo Sabindo', 'Polo Eastern', 'Gm Sabindo', 'Gm Eastern'];
    const STORE_OPTIONS = ['ALL', ...STORES];
    const LS = {
      url: 'ki_web_app_url',
      users: 'ki_users',
      sales: 'ki_sales',
      lang: 'ki_lang',
    };

    const T = {
      en: {
        navSubmit: 'Submit', navRecords: 'Records', navSummary: 'Summary', navAdmin: 'Admin', navMe: 'Me',
        loginUsername: 'Username', login: 'Login', registerAccount: 'Register Account',
        loginHint: 'Data is read from Google Sheets. Local cache is used only when offline.',
        fullName: 'Full Name', role: 'Role', sendRequest: 'Send Request', save: 'Save',
        live: 'Live', offline: 'Offline', syncing: 'Syncing', ready: 'Ready', writing: 'Writing',
        enterLogin: 'Enter username and PIN', checking: 'Checking Google Sheet...', cacheUsers: 'Using saved user cache',
        wrongLogin: 'Wrong username or PIN', pendingAccount: 'Account is pending approval',
        synced: 'Spreadsheet synced', liveError: 'Live sync error', writeError: 'Write error',
        submitTitle: 'Enter / Update Sales', submitHint: 'Submitting the same store and date updates the spreadsheet row.',
        date: 'Date', store: 'Store', cash: 'Cash', qr: 'QR Pay', card: 'Credit Card', bank: 'Bank Transfer',
        totalSales: 'Total Sales', remark: 'Remark', optional: 'Optional', submitSync: 'Submit & Sync',
        chooseStoreDate: 'Choose store and date', writingSheet: 'Writing to spreadsheet...', savedRefresh: 'Saved. Refreshing spreadsheet...',
        confirmSubmission: 'Confirm Submission', total: 'Total', cancel: 'Cancel',
        recordsTitle: 'Sales Records', summaryTitle: 'Sales Summary', sync: 'Sync',
        dateRange: 'Date Range', today: 'Today', yesterday: 'Yesterday', pickDate: 'Pick Date', monthly: 'Monthly',
        month: 'Month', allStores: 'All Stores', noRecords: 'No records found.', rangeTotal: 'Range Total',
        selectedMonth: 'Selected Month', salesByStore: 'Sales by Store', accessRestricted: 'Access Restricted',
        accessMsg: 'Only manager, boss, and admin users can view summary.',
        admin: 'Admin', addUser: 'Add User', edit: 'Edit', delete: 'Delete', noAccess: 'No access',
        webAppUrl: 'Google Apps Script Web App URL', saveUrl: 'Save URL & Sync', cachedRecords: 'Cached records',
        dataSource: 'Data source', logout: 'Logout', googleSheets: 'Google Sheets',
        registerSent: 'Registration sent for approval', completeFields: 'Complete all fields. PIN must be 4 digits.',
        userSaved: 'User saved', userDeleted: 'User deleted',
      },
      zh: {
        navSubmit: '提交', navRecords: '记录', navSummary: '汇总', navAdmin: '管理', navMe: '我的',
        loginUsername: '用户名', login: '登录', registerAccount: '注册账号',
        loginHint: '数据读取自 Google 表格。离线时才使用本地缓存。',
        fullName: '姓名', role: '职位', sendRequest: '发送申请', save: '保存',
        live: '在线', offline: '离线', syncing: '同步中', ready: '就绪', writing: '写入中',
        enterLogin: '请输入用户名和 PIN', checking: '正在检查 Google 表格...', cacheUsers: '使用已保存用户资料',
        wrongLogin: '用户名或 PIN 错误', pendingAccount: '账号等待管理员批准',
        synced: '表格已同步', liveError: '实时同步错误', writeError: '写入错误',
        submitTitle: '输入 / 更新销售额', submitHint: '同一门店和日期再次提交会更新表格里的同一行。',
        date: '日期', store: '门店', cash: '现金', qr: '扫码支付', card: '刷卡', bank: '银行转账',
        totalSales: '总销售额', remark: '备注', optional: '选填', submitSync: '提交并同步',
        chooseStoreDate: '请选择门店和日期', writingSheet: '正在写入表格...', savedRefresh: '已保存，正在刷新表格...',
        confirmSubmission: '确认提交', total: '总计', cancel: '取消',
        recordsTitle: '销售记录', summaryTitle: '销售汇总', sync: '同步',
        dateRange: '日期范围', today: '今天', yesterday: '昨天', pickDate: '选择日期', monthly: '按月',
        month: '月份', allStores: '全部门店', noRecords: '没有找到记录。', rangeTotal: '所选范围总额',
        selectedMonth: '所选月份', salesByStore: '各门店销售', accessRestricted: '权限受限',
        accessMsg: '只有经理、老板和管理员可以查看汇总。',
        admin: '管理', addUser: '添加用户', edit: '编辑', delete: '删除', noAccess: '无权限',
        webAppUrl: 'Google Apps Script 网页应用 URL', saveUrl: '保存 URL 并同步', cachedRecords: '已缓存记录',
        dataSource: '数据来源', logout: '退出登录', googleSheets: 'Google 表格',
        registerSent: '注册申请已发送，等待批准', completeFields: '请填写所有资料。PIN 必须是 4 位数字。',
        userSaved: '用户已保存', userDeleted: '用户已删除',
      },
    };

    let webAppUrl = load(LS.url, DEFAULT_WEB_APP_URL);
    let lang = load(LS.lang, 'en');
    let currentUser = null;
    let cachedUsers = {};
    let salesRecords = [];
    let activeTab = 'submit';
    let activeStore = 'all';
    let filterRange = 'today';
    let filterMonth = monthKey(new Date());
    let filterDate = dateKey(new Date());
    let syncTimer = null;
    let pendingSale = null;

    const $ = (id) => document.getElementById(id);
    const money = (n) => `RM ${num(n).toFixed(2)}`;
    const privileged = () => currentUser && ['boss', 'admin', 'manager'].includes(currentUser.role);
    const isAdmin = () => currentUser && ['boss', 'admin'].includes(currentUser.role);
    const tr = (key) => (T[lang] && T[lang][key]) || T.en[key] || key;

    function applyLanguage() {
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      $('lang-toggle').textContent = lang === 'zh' ? 'EN' : '中文';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = tr(el.dataset.i18n);
      });
      if (currentUser) {
        $('user-line').textContent = `${currentUser.name} | ${currentUser.store} | ${roleLabel(currentUser.role)}`;
      }
    }

    function roleLabel(role) {
      const map = {
        staff: lang === 'zh' ? '员工' : 'Staff',
        supervisor: lang === 'zh' ? '主管' : 'Supervisor',
        manager: lang === 'zh' ? '经理' : 'Manager',
        boss: lang === 'zh' ? '老板' : 'Boss',
        admin: lang === 'zh' ? '管理员' : 'Admin',
      };
      return map[role] || role;
    }

    function save(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function load(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (err) {
        return fallback;
      }
    }

    function num(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function dateKey(value) {
      if (!value) return '';
      if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value).slice(0, 10);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function monthKey(value) {
      if (!value) return '';
      if (typeof value === 'string' && /^\d{4}-\d{2}$/.test(value)) return value;
      return dateKey(value).slice(0, 7);
    }

    function todayKey(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return dateKey(d);
    }

    function normalizeSale(row) {
      const dk = dateKey(row.dateKey || row.date || row.datetime);
      return {
        id: row.id || `${dk}-${row.store || ''}`,
        store: row.store || '',
        cash: num(row.cash),
        qr: num(row.qr),
        card: num(row.card),
        bank: num(row.bank),
        total: num(row.total || num(row.cash) + num(row.qr) + num(row.card) + num(row.bank)),
        remark: row.remark || '',
        submitter: row.submitter || '',
        role: row.role || '',
        datetime: row.datetime || '',
        dateKey: dk,
        month: monthKey(row.month || dk),
      };
    }

    function setStatus(text, type = '') {
      const el = $('sync-status');
      el.className = `status ${type}`;
      el.querySelector('span:last-child').textContent = tr(text) || text;
    }

    function toast(message, type = '') {
      const el = $('toast');
      el.textContent = message;
      el.className = `show ${type}`;
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => el.className = '', 2600);
    }

    async function apiGet(action) {
      const res = await fetch(`${webAppUrl}?action=${encodeURIComponent(action)}&t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const payload = await res.json();
      if (payload && payload.error) throw new Error(payload.error);
      return payload;
    }

    async function apiPost(body) {
      await fetch(webAppUrl, {
        method: 'POST',
        mode: 'no-cors',
        cache: 'no-cache',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
      });
      return { ok: true };
    }

    async function syncUsers() {
      cachedUsers = load(LS.users, {});
      const users = await apiGet('getUsers');
      if (users && typeof users === 'object') {
        cachedUsers = users;
        save(LS.users, cachedUsers);
      }
      return cachedUsers;
    }

    async function syncSales({ silent = false } = {}) {
      if (!silent) setStatus('syncing', 'warn');
      try {
        let payload;
        try {
          payload = await apiGet('getSales');
        } catch (err) {
          payload = await apiGet('getRecords');
        }
        const rows = Array.isArray(payload) ? payload : (payload.sales || payload.records || []);
        salesRecords = rows.map(normalizeSale).filter(r => r.store && r.dateKey);
        save(LS.sales, salesRecords);
        setStatus('live', 'ok');
        if (!silent) toast(tr('synced'), 'ok');
        renderActiveTab();
        return salesRecords;
      } catch (err) {
        salesRecords = load(LS.sales, []);
        setStatus('offline', 'bad');
        if (!silent) toast(`${tr('liveError')}: ${err.message}`, 'bad');
        renderActiveTab();
        return salesRecords;
      }
    }

    function startLiveSync() {
      window.clearInterval(syncTimer);
      syncTimer = window.setInterval(() => syncSales({ silent: true }), 20000);
    }

    function fillStoreSelect(select, values = STORES, selected = '') {
      select.innerHTML = values.map(store => `<option value="${store}" ${store === selected ? 'selected' : ''}>${store}</option>`).join('');
    }

    function init() {
      fillStoreSelect($('reg-store'), STORES);
      fillStoreSelect($('edit-store'), STORE_OPTIONS);

      $('login-btn').addEventListener('click', doLogin);
      $('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
      $('open-register').addEventListener('click', () => openModal('register-modal'));
      $('register-submit').addEventListener('click', registerUser);
      $('confirm-submit').addEventListener('click', confirmSubmit);
      $('save-user').addEventListener('click', saveUser);
      $('lang-toggle').addEventListener('click', () => {
        lang = lang === 'en' ? 'zh' : 'en';
        save(LS.lang, lang);
        applyLanguage();
        renderActiveTab();
      });

      document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.dataset.close));
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      cachedUsers = load(LS.users, {});
      salesRecords = load(LS.sales, []);
      applyLanguage();
      setStatus('ready', 'warn');
    }

    async function doLogin() {
      const username = $('login-user').value.trim().toLowerCase();
      const pin = $('login-pin').value.trim();
      if (!username || !pin) return toast(tr('enterLogin'), 'bad');

      toast(tr('checking'), 'warn');
      try {
        await syncUsers();
      } catch (err) {
        toast(tr('cacheUsers'), 'warn');
      }

      const user = cachedUsers[username];
      if (!user || String(user.pin) !== String(pin)) return toast(tr('wrongLogin'), 'bad');
      if (user.status && user.status !== 'active') return toast(tr('pendingAccount'), 'bad');

      currentUser = { ...user, username };
      $('user-line').textContent = `${currentUser.name} | ${currentUser.store} | ${roleLabel(currentUser.role)}`;
      $('admin-nav').style.display = isAdmin() ? 'block' : 'none';
      $('login-screen').classList.remove('active');
      $('app-screen').classList.add('active');

      renderSubmit();
      await syncSales({ silent: true });
      startLiveSync();
      switchTab('submit');
    }

    function logout() {
      currentUser = null;
      window.clearInterval(syncTimer);
      $('app-screen').classList.remove('active');
      $('login-screen').classList.add('active');
      $('login-pin').value = '';
      setStatus('ready', 'warn');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.id === `tab-${tab}`));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
      if (['records', 'summary'].includes(tab)) syncSales({ silent: true });
      renderActiveTab();
    }

    function renderActiveTab() {
      if (!currentUser) return;
      if (activeTab === 'submit') renderSubmit();
      if (activeTab === 'records') renderRecords();
      if (activeTab === 'summary') renderSummary();
      if (activeTab === 'admin') renderAdmin();
      if (activeTab === 'profile') renderProfile();
    }

    function renderSubmit() {
      const selectedStore = privileged() ? (currentUser.store === 'ALL' ? STORES[0] : currentUser.store) : currentUser.store;
      $('tab-submit').innerHTML = `
        <div class="banner"><h3>${tr('submitTitle')}</h3><p>${tr('submitHint')}</p></div>
        <div class="card">
          <div class="field"><label>${tr('date')}</label><input type="date" id="sale-date" value="${todayKey()}"></div>
          <div class="field"><label>${tr('store')}</label>${privileged() ? `<select id="sale-store">${STORES.map(s => `<option value="${s}" ${s === selectedStore ? 'selected' : ''}>${s}</option>`).join('')}</select>` : `<input id="sale-store" value="${currentUser.store}" disabled>`}</div>
          <div class="field"><label>${tr('cash')}</label><div class="money-wrap"><span>RM</span><input id="sale-cash" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
          <div class="field"><label>${tr('qr')}</label><div class="money-wrap"><span>RM</span><input id="sale-qr" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
          <div class="field"><label>${tr('card')}</label><div class="money-wrap"><span>RM</span><input id="sale-card" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
          <div class="field"><label>${tr('bank')}</label><div class="money-wrap"><span>RM</span><input id="sale-bank" type="number" min="0" step="0.01" inputmode="decimal"></div></div>
          <div class="row"><span class="muted">${tr('totalSales')}</span><span class="amount" id="sale-total">RM 0.00</span></div>
          <div class="field" style="margin-top:14px"><label>${tr('remark')}</label><input id="sale-remark" placeholder="${tr('optional')}"></div>
          <button class="btn" id="open-confirm">${tr('submitSync')}</button>
        </div>`;

      ['sale-date', 'sale-store'].forEach(id => $(id).addEventListener('change', loadExistingSale));
      ['sale-cash', 'sale-qr', 'sale-card', 'sale-bank'].forEach(id => $(id).addEventListener('input', updateTotal));
      $('open-confirm').addEventListener('click', openConfirm);
      loadExistingSale();
    }

    function loadExistingSale() {
      const store = $('sale-store').value;
      const dk = $('sale-date').value;
      const existing = salesRecords.find(r => r.store === store && r.dateKey === dk);
      $('sale-cash').value = existing ? existing.cash : '';
      $('sale-qr').value = existing ? existing.qr : '';
      $('sale-card').value = existing ? existing.card : '';
      $('sale-bank').value = existing ? existing.bank : '';
      $('sale-remark').value = existing ? existing.remark : '';
      updateTotal();
    }

    function updateTotal() {
      const total = ['sale-cash', 'sale-qr', 'sale-card', 'sale-bank'].reduce((sum, id) => sum + num($(id).value), 0);
      $('sale-total').textContent = money(total);
    }

    function openConfirm() {
      const store = $('sale-store').value;
      const dk = $('sale-date').value;
      if (!store || !dk) return toast(tr('chooseStoreDate'), 'bad');

      pendingSale = {
        id: Date.now(),
        store,
        cash: num($('sale-cash').value),
        qr: num($('sale-qr').value),
        card: num($('sale-card').value),
        bank: num($('sale-bank').value),
        remark: $('sale-remark').value.trim(),
        submitter: currentUser.name,
        role: currentUser.role,
        datetime: new Date().toISOString(),
        dateKey: dk,
        month: dk.slice(0, 7),
      };
      pendingSale.total = pendingSale.cash + pendingSale.qr + pendingSale.card + pendingSale.bank;

      $('confirm-body').innerHTML = `
        <div class="row"><span>${tr('store')}</span><b>${pendingSale.store}</b></div>
        <div class="row"><span>${tr('date')}</span><b>${pendingSale.dateKey}</b></div>
        <div class="row"><span>${tr('cash')}</span><b>${money(pendingSale.cash)}</b></div>
        <div class="row"><span>${tr('qr')}</span><b>${money(pendingSale.qr)}</b></div>
        <div class="row"><span>${tr('card')}</span><b>${money(pendingSale.card)}</b></div>
        <div class="row"><span>${tr('bank')}</span><b>${money(pendingSale.bank)}</b></div>
        <div class="row"><span>${tr('total')}</span><b class="amount">${money(pendingSale.total)}</b></div>`;
      openModal('confirm-modal');
    }

    async function confirmSubmit() {
      if (!pendingSale) return;
      closeModal('confirm-modal');
      setStatus('writing', 'warn');
      toast(tr('writingSheet'), 'warn');
      try {
        await apiPost({ action: 'submitSales', ...pendingSale });
        upsertLocalSale(pendingSale);
        toast(tr('savedRefresh'), 'ok');
        window.setTimeout(() => syncSales({ silent: false }), 1400);
      } catch (err) {
        setStatus('offline', 'bad');
        toast(`${tr('writeError')}: ${err.message}`, 'bad');
      }
    }

    function upsertLocalSale(record) {
      salesRecords = salesRecords.filter(r => !(r.store === record.store && r.dateKey === record.dateKey));
      salesRecords.push(normalizeSale(record));
      save(LS.sales, salesRecords);
      renderActiveTab();
    }

    function baseVisibleSales() {
      return privileged() ? [...salesRecords] : salesRecords.filter(r => r.store === currentUser.store);
    }

    function selectedRangeLabel() {
      if (filterRange === 'today') return tr('today');
      if (filterRange === 'yesterday') return tr('yesterday');
      if (filterRange === 'date') return filterDate;
      return filterMonth;
    }

    function filteredSales({ applyStore = true } = {}) {
      let rows = baseVisibleSales();
      if (applyStore && activeStore !== 'all') rows = rows.filter(r => r.store === activeStore);
      if (filterRange === 'today') rows = rows.filter(r => r.dateKey === todayKey());
      if (filterRange === 'yesterday') rows = rows.filter(r => r.dateKey === todayKey(-1));
      if (filterRange === 'date') rows = rows.filter(r => r.dateKey === filterDate);
      if (filterRange === 'month') rows = rows.filter(r => r.month === filterMonth);
      return rows.sort((a, b) => `${b.dateKey}${b.datetime}`.localeCompare(`${a.dateKey}${a.datetime}`));
    }

    function renderFilterControls(target) {
      target.innerHTML += `
        <div class="card">
          <div class="grid">
            <div><label>${tr('dateRange')}</label><select id="filter-range"><option value="today">${tr('today')}</option><option value="yesterday">${tr('yesterday')}</option><option value="date">${tr('pickDate')}</option><option value="month">${tr('monthly')}</option></select></div>
            <div id="filter-extra"></div>
          </div>
        </div>`;
      $('filter-range').value = filterRange;
      renderFilterExtra();
    }

    function renderFilterExtra() {
      $('filter-extra').innerHTML = filterRange === 'date'
        ? `<label>${tr('date')}</label><input id="filter-date" type="date" value="${filterDate}">`
        : `<label>${tr('month')}</label><input id="filter-month" type="month" value="${filterMonth}">`;
      const dateInput = $('filter-date');
      const monthInput = $('filter-month');
    }

    function bindFilterControls() {
      const rangeInput = $('filter-range');
      if (rangeInput) {
        rangeInput.value = filterRange;
        rangeInput.addEventListener('change', e => {
          filterRange = e.target.value;
          renderActiveTab();
        });
      }
      const dateInput = $('filter-date');
      const monthInput = $('filter-month');
      if (dateInput) dateInput.addEventListener('change', e => { filterDate = e.target.value; renderActiveTab(); });
      if (monthInput) monthInput.addEventListener('change', e => { filterMonth = e.target.value; renderActiveTab(); });
    }

    function renderStoreChips() {
      if (!privileged()) return '';
      return `<div class="chips"><button class="chip ${activeStore === 'all' ? 'active' : ''}" data-store="all">${tr('allStores')}</button>${STORES.map(s => `<button class="chip ${activeStore === s ? 'active' : ''}" data-store="${s}">${s}</button>`).join('')}</div>`;
    }

    function bindStoreChips() {
      document.querySelectorAll('[data-store]').forEach(btn => btn.addEventListener('click', () => {
        activeStore = btn.dataset.store;
        renderActiveTab();
      }));
    }

    function renderRecords() {
      const rows = filteredSales();
      $('tab-records').innerHTML = `<div class="row" style="border:0;padding-top:0"><h3 style="margin:0">${tr('recordsTitle')}</h3><button class="btn small secondary" id="manual-sync">${tr('sync')}</button></div>`;
      renderFilterControls($('tab-records'));
      $('tab-records').innerHTML += renderStoreChips();
      $('tab-records').innerHTML += `<div class="card">${rows.length ? rows.map(recordHtml).join('') : `<p class="muted" style="text-align:center">${tr('noRecords')}</p>`}</div>`;
      $('manual-sync').addEventListener('click', () => syncSales({ silent: false }));
      bindFilterControls();
      bindStoreChips();
    }

    function recordHtml(r) {
      return `<div class="record">
        <div><strong>${r.store}</strong> <span class="muted">${r.submitter || ''}</span><div class="meta">${tr('cash')} ${money(r.cash)} | ${tr('qr')} ${money(r.qr)}<br>${tr('card')} ${money(r.card)} | ${tr('bank')} ${money(r.bank)}${r.remark ? `<br>${r.remark}` : ''}</div></div>
        <div><div class="total">${money(r.total)}</div><div class="meta">${r.dateKey}</div></div>
      </div>`;
    }

    function renderSummary() {
      if (!privileged()) {
        $('tab-summary').innerHTML = `<div class="card"><h3>${tr('accessRestricted')}</h3><p class="muted">${tr('accessMsg')}</p></div>`;
        return;
      }
      const rows = filteredSales();
      const rangeAllStores = filteredSales({ applyStore: false });
      const monthRows = baseVisibleSales().filter(r => r.month === filterMonth);
      const rangeTotal = rows.reduce((sum, r) => sum + r.total, 0);
      const monthTotal = monthRows.reduce((sum, r) => sum + r.total, 0);
      const storeTotals = Object.fromEntries(STORES.map(s => [s, 0]));
      rangeAllStores.forEach(r => storeTotals[r.store] = (storeTotals[r.store] || 0) + r.total);
      const max = Math.max(1, ...Object.values(storeTotals));
      $('tab-summary').innerHTML = `<div class="row" style="border:0;padding-top:0"><h3 style="margin:0">${tr('summaryTitle')}</h3><button class="btn small secondary" id="summary-sync">${tr('sync')}</button></div>`;
      renderFilterControls($('tab-summary'));
      $('tab-summary').innerHTML += renderStoreChips();
      $('tab-summary').innerHTML += `
        <div class="grid" style="margin-bottom:13px">
          <div class="metric"><span class="muted">${tr('rangeTotal')} (${selectedRangeLabel()})</span><b>${money(rangeTotal)}</b></div>
          <div class="metric"><span class="muted">${tr('selectedMonth')} ${filterMonth}</span><b>${money(monthTotal)}</b></div>
        </div>
        <div class="card"><h3 style="margin-top:0">${tr('salesByStore')} (${selectedRangeLabel()})</h3>${STORES.map(store => `<div class="bar-row"><div class="bar-head"><span>${store}</span><span>${money(storeTotals[store] || 0)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${((storeTotals[store] || 0) / max * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>`;
      $('summary-sync').addEventListener('click', () => syncSales({ silent: false }));
      bindFilterControls();
      bindStoreChips();
    }

    function renderAdmin() {
      if (!isAdmin()) {
        $('tab-admin').innerHTML = `<div class="card"><h3>${tr('noAccess')}</h3></div>`;
        return;
      }
      const users = Object.entries(cachedUsers).map(([username, u]) => ({ username, ...u }));
      $('tab-admin').innerHTML = `<div class="row" style="border:0;padding-top:0"><h3 style="margin:0">${tr('admin')}</h3><button class="btn small success" id="add-user">${tr('addUser')}</button></div>
        <div class="card">${users.map(u => `<div class="row"><div><b>${u.name || u.username}</b><div class="muted" style="font-size:12px">@${u.username} | ${roleLabel(u.role)} | ${u.store} | ${u.status || 'active'}</div></div><div style="display:flex;gap:6px"><button class="btn small secondary" data-edit="${u.username}">${tr('edit')}</button>${u.username !== currentUser.username ? `<button class="btn small danger" data-delete="${u.username}">${tr('delete')}</button>` : ''}</div></div>`).join('')}</div>`;
      $('add-user').addEventListener('click', () => openUserEditor());
      document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openUserEditor(btn.dataset.edit)));
      document.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => deleteUser(btn.dataset.delete)));
    }

    function renderProfile() {
      $('tab-profile').innerHTML = `
        <div class="card">
          <h3 style="margin-top:0">${currentUser.name}</h3>
          <p class="muted">@${currentUser.username} | ${roleLabel(currentUser.role)} | ${currentUser.store}</p>
        </div>
        <div class="card">
          <label>${tr('webAppUrl')}</label>
          <input id="url-input" value="${webAppUrl}">
          <button class="btn success" id="save-url" style="margin-top:10px">${tr('saveUrl')}</button>
        </div>
        <div class="card">
          <div class="row"><span class="muted">${tr('cachedRecords')}</span><b>${salesRecords.length}</b></div>
          <div class="row"><span class="muted">${tr('dataSource')}</span><b>${tr('googleSheets')}</b></div>
        </div>
        <button class="btn danger" id="logout">${tr('logout')}</button>`;
      $('save-url').addEventListener('click', async () => {
        webAppUrl = $('url-input').value.trim();
        save(LS.url, webAppUrl);
        await syncUsers();
        await syncSales({ silent: false });
      });
      $('logout').addEventListener('click', logout);
    }

    function openModal(id) {
      $(id).classList.add('open');
    }

    function closeModal(id) {
      $(id).classList.remove('open');
    }

    async function registerUser() {
      const payload = {
        action: 'registerRequest',
        username: $('reg-username').value.trim().toLowerCase(),
        name: $('reg-name').value.trim(),
        store: $('reg-store').value,
        role: $('reg-role').value,
        pin: $('reg-pin').value.trim(),
      };
      if (!payload.username || !payload.name || !payload.pin || payload.pin.length !== 4) return toast(tr('completeFields'), 'bad');
      await apiPost(payload);
      closeModal('register-modal');
      toast(tr('registerSent'), 'ok');
    }

    function openUserEditor(username = '') {
      const user = username ? cachedUsers[username] : {};
      $('user-modal-title').textContent = username ? tr('edit') : tr('addUser');
      $('edit-original').value = username;
      $('edit-username').value = username;
      $('edit-username').disabled = Boolean(username);
      $('edit-name').value = user.name || '';
      $('edit-pin').value = user.pin || '';
      $('edit-role').value = user.role || 'staff';
      fillStoreSelect($('edit-store'), STORE_OPTIONS, user.store || 'HQ');
      openModal('user-modal');
    }

    async function saveUser() {
      const payload = {
        action: 'saveUser',
        originalKey: $('edit-original').value,
        username: $('edit-username').value.trim().toLowerCase(),
        name: $('edit-name').value.trim(),
        pin: $('edit-pin').value.trim(),
        role: $('edit-role').value,
        store: $('edit-store').value,
        status: 'active',
      };
      if (!payload.username || !payload.name || !payload.pin || payload.pin.length !== 4) return toast(tr('completeFields'), 'bad');
      await apiPost(payload);
      cachedUsers[payload.username] = { name: payload.name, pin: payload.pin, role: payload.role, store: payload.store, status: 'active' };
      if (payload.originalKey && payload.originalKey !== payload.username) delete cachedUsers[payload.originalKey];
      save(LS.users, cachedUsers);
      closeModal('user-modal');
      toast(tr('userSaved'), 'ok');
      renderAdmin();
      window.setTimeout(() => syncUsers().then(renderAdmin), 1200);
    }

    async function deleteUser(username) {
      if (!confirm(`Delete @${username}?`)) return;
      await apiPost({ action: 'deleteUser', username });
      delete cachedUsers[username];
      save(LS.users, cachedUsers);
      toast(tr('userDeleted'), 'ok');
      renderAdmin();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
